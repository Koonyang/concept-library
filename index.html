<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>개념의 서고</title>
<meta name="theme-color" content="#07080d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect fill='%2307080d' width='64' height='64'/%3E%3Cpath fill='%23c4a35a' d='M18 50 V22 Q32 12 46 22 V50 L32 42 Z'/%3E%3C/svg%3E">
<style>
:root{
  --n0:#07080d;--n1:#0b0e16;--n2:#121722;--n3:#1a2130;--n4:#232b3d;
  --gold:#c4a35a;--gold2:#e6d3a3;--gold3:#8f6b2a;--gold4:#f3e6c0;
  --parch:#e8d5b0;--parch2:#cbb992;--ink:#1a140c;--blood:#c45c4a;
  --hp:#6ebd96;--stag:#e0b43a;--mute:#7aa0c4;--shadow:rgba(0,0,0,.62);
  --ui:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--n0);color:var(--parch);
  font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Pretendard",sans-serif;
  user-select:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
#game{position:fixed;inset:0;overflow:hidden;background:var(--n0)}
#fx,#bg{position:absolute;inset:0;width:100%;height:100%;display:block}
#bg{z-index:0}#fx{z-index:8;pointer-events:none}
#vignette{position:absolute;inset:0;z-index:9;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,.55) 100%)}
#grain{position:absolute;inset:0;z-index:10;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.scene{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;opacity:0;pointer-events:none;
  visibility:hidden;transition:opacity .45s ease;background:transparent}
.scene.on{opacity:1;pointer-events:auto;visibility:visible}
#transition{position:absolute;inset:0;z-index:40;background:var(--n0);opacity:0;pointer-events:none;
  transition:opacity .45s ease}
#transition.go{opacity:1}
#mute{position:absolute;top:10px;right:10px;z-index:30;width:46px;height:36px;letter-spacing:.08em;font-size:11px}

/* ornaments */
.gold-title{font-family:Georgia,"Iowan Old Style","Apple SD Gothic Neo",serif;font-weight:600;
  letter-spacing:.22em;color:var(--gold2);
  background:linear-gradient(180deg,#f8efd4 0%,#e6d3a3 38%,#c4a35a 62%,#8f6b2a 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 0 rgba(0,0,0,.85)) drop-shadow(0 0 14px rgba(196,163,90,.35))}
.filigree{display:flex;align-items:center;gap:10px;color:var(--gold);opacity:.85}
.filigree:before,.filigree:after{content:"";flex:1;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.ico{display:inline-block;vertical-align:-3px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.frame{position:relative;background:
    linear-gradient(180deg,rgba(48,40,28,.18),transparent 28%),
    linear-gradient(180deg,rgba(22,26,38,.94),rgba(9,11,18,.96));
  border:1px solid var(--gold);
  box-shadow:inset 0 0 0 1px rgba(14,12,10,.9),inset 0 0 0 2px rgba(196,163,90,.35),
    inset 0 1px 0 rgba(243,230,192,.28),0 14px 36px var(--shadow)}
.frame:before,.frame:after{content:"";position:absolute;width:16px;height:16px;pointer-events:none;z-index:2;
  border:2px solid var(--gold4);opacity:.9}
.frame:before{top:6px;left:6px;border-right:none;border-bottom:none;box-shadow:-3px -3px 0 rgba(143,107,42,.55)}
.frame:after{top:6px;right:6px;border-left:none;border-bottom:none;box-shadow:3px -3px 0 rgba(143,107,42,.55)}
.frame .cbl,.frame .cbr{position:absolute;width:16px;height:16px;border:2px solid var(--gold4);pointer-events:none;z-index:2;opacity:.9}
.frame .cbl{bottom:6px;left:6px;border-right:none;border-top:none;box-shadow:-3px 3px 0 rgba(143,107,42,.55)}
.frame .cbr{bottom:6px;right:6px;border-left:none;border-top:none;box-shadow:3px 3px 0 rgba(143,107,42,.55)}
.btn{position:relative;overflow:hidden;padding:12px 28px;border:1px solid var(--gold);color:var(--gold4);
  letter-spacing:.18em;
  background:linear-gradient(180deg,rgba(196,163,90,.28),rgba(18,14,10,.55) 48%,rgba(7,8,13,.7));
  text-shadow:0 1px 0 rgba(0,0,0,.6),0 0 10px rgba(196,163,90,.35);
  box-shadow:inset 0 1px 0 rgba(243,230,192,.4),inset 0 -1px 0 rgba(0,0,0,.45),0 6px 16px rgba(0,0,0,.4);
  transition:transform .18s ease,box-shadow .18s ease,filter .18s ease}
.btn:after{content:"";position:absolute;top:-30%;bottom:-30%;left:0;width:40%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.38),transparent);
  transform:translateX(-180%) skewX(-22deg);pointer-events:none}
.btn:hover{filter:brightness(1.12);box-shadow:inset 0 1px 0 rgba(243,230,192,.55),0 0 20px rgba(196,163,90,.4);
  transform:translateY(-2px)}
.btn:hover:after{animation:btnshine .7s ease}
.btn:active{transform:translateY(1px) scale(.98);filter:brightness(.96)}
.btn.primary{background:linear-gradient(180deg,#e6d3a3 0%,#c4a35a 38%,#8f6b2a 70%,#5c4316 100%);
  color:#1a140c;text-shadow:0 1px 0 rgba(243,230,192,.45);border-color:#f3e6c0}
.btn[disabled]{opacity:.4;pointer-events:none;filter:none}
@keyframes btnshine{from{transform:translateX(-180%) skewX(-22deg)}to{transform:translateX(280%) skewX(-22deg)}}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;
  border:1px solid var(--gold3);color:var(--gold2);font-size:11px;letter-spacing:.08em;
  background:linear-gradient(180deg,rgba(196,163,90,.12),rgba(0,0,0,.25));
  box-shadow:inset 0 1px 0 rgba(243,230,192,.15)}

/* title */
#scene-title{align-items:center;justify-content:center;text-align:center}
#scene-title .emblem{width:88px;height:88px;margin-bottom:18px;filter:drop-shadow(0 0 16px rgba(196,163,90,.4));
  animation:floaty 4.5s ease-in-out infinite}
#scene-title h1{font-size:clamp(36px,6vw,72px);margin:8px 0 6px}
#scene-title .sub{color:var(--parch2);letter-spacing:.28em;font-size:12px;margin-bottom:8px}
#scene-title .tag{color:var(--gold2);font-size:13px;letter-spacing:.16em;margin:14px 0 28px;opacity:.85;text-shadow:0 0 12px rgba(0,0,0,.8)}
#scene-title .enter{font-size:15px;padding:14px 48px}
.candles{position:absolute;bottom:8%;width:70px;height:160px;pointer-events:none;z-index:3}
.candles.l{left:6%}.candles.r{right:6%}
.flame{position:absolute;bottom:92px;left:50%;width:14px;height:24px;margin-left:-7px;border-radius:50% 50% 50% 50%;
  background:radial-gradient(circle at 50% 30%,#fff6c8,#ffb347 40%,transparent 70%);
  animation:flicker .18s infinite alternate;filter:blur(.3px)}
.glow{position:absolute;bottom:60px;left:50%;width:140px;height:140px;margin-left:-70px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,180,70,.5),rgba(255,160,40,.12) 45%,transparent 70%);animation:glow 1.6s ease-in-out infinite}

/* lobby */
#scene-lobby,.panel-scene{padding:8px 24px 78px;
  display:flex;flex-direction:column;min-height:0;overflow:hidden;
  background:linear-gradient(180deg,rgba(7,8,13,.55) 0%,rgba(7,8,13,.78) 40%,rgba(7,8,13,.88) 100%)}
.topbar{position:relative;top:auto;left:auto;right:auto;display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap;
  z-index:5;flex:0 0 auto;width:100%;padding:2px 52px 10px 0}
.topbar .brand{letter-spacing:.2em;color:var(--gold);font-size:13px;margin-right:8px}
.hudstat{font-size:12px;color:var(--parch2);letter-spacing:.04em;display:inline-flex;align-items:center;gap:4px}
.hudstat .ico,.topbar .ico{width:13px;height:13px}
.ico.filled{stroke:none}
.lobby-grid{flex:1;display:grid;grid-template-columns:220px 1fr 280px;gap:18px;min-height:0;height:auto}
.col{display:flex;flex-direction:column;gap:12px;min-height:0}
.portrait-box{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:stretch;padding:16px 14px;min-height:0}
.portrait-box,.portrait-frame{min-height:0;height:100%}
.portrait-frame{position:relative;width:100%;flex:1 1 auto;display:flex;align-items:stretch;justify-content:center}
.pf-ring{position:relative;width:100%;flex:1;height:100%;display:flex;align-items:flex-end;min-height:0;
  background:radial-gradient(ellipse at 50% 16%,rgba(196,163,90,.18),#0b0e16 62%);
  box-shadow:inset 0 0 0 2px var(--gold),inset 0 0 0 6px #0c0a08,inset 0 0 0 7px rgba(196,163,90,.45),
    0 0 28px rgba(196,163,90,.18);
  clip-path:polygon(10% 0,90% 0,100% 8%,100% 92%,90% 100%,10% 100%,0 92%,0 8%);
  overflow:hidden;padding:8px 6px 0}
.portrait-box svg{width:100%;height:auto;max-height:100%;filter:drop-shadow(0 10px 16px rgba(0,0,0,.55));display:block}
.pf-plate{margin-top:10px;padding:6px 16px 8px;text-align:center;width:100%;
  background:linear-gradient(180deg,rgba(196,163,90,.16),rgba(7,8,13,.5));
  border-top:1px solid rgba(196,163,90,.35);border-bottom:1px solid rgba(196,163,90,.2)}
.pname{margin-top:0;letter-spacing:.18em;font-size:13px}
.floors{display:flex;gap:8px;flex-wrap:wrap}
.floor-btn{padding:8px 16px;border:1px solid var(--gold3);color:var(--parch2);letter-spacing:.12em;font-size:13px;
  background:linear-gradient(180deg,rgba(196,163,90,.1),rgba(7,8,13,.45));
  box-shadow:inset 0 1px 0 rgba(243,230,192,.12);transition:transform .18s,box-shadow .18s,border-color .18s,color .18s}
.floor-btn:hover{color:var(--gold2);border-color:var(--gold);transform:translateY(-1px)}
.floor-btn.on{border-color:var(--gold4);color:var(--gold4);
  background:linear-gradient(180deg,rgba(196,163,90,.32),rgba(18,14,10,.55));
  box-shadow:0 0 16px rgba(196,163,90,.35),inset 0 1px 0 rgba(243,230,192,.4)}
.floor-hero{position:relative;height:168px;overflow:hidden;flex:0 0 auto}
.floor-hero .cap{position:absolute;left:0;top:0;bottom:0;right:38%;z-index:1;
  display:flex;flex-direction:column;justify-content:center;
  padding:16px 22px 16px 20px;
  background:linear-gradient(90deg,rgba(7,8,13,.92) 0%,rgba(7,8,13,.72) 62%,rgba(7,8,13,0) 100%)}
.floor-hero h2{letter-spacing:.2em;font-size:22px;margin-bottom:4px}
.guests{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding-right:4px}
.guest-card{display:flex;gap:14px;padding:10px 14px 10px 10px;cursor:pointer;text-align:left;width:100%;
  align-items:center;transition:border-color .22s,box-shadow .22s,transform .22s,background .22s}
.guest-card:hover,.guest-card.on{border-color:var(--gold4);box-shadow:0 0 20px rgba(196,163,90,.28),inset 0 0 24px rgba(196,163,90,.06);
  transform:translateX(4px) translateY(-1px);background:linear-gradient(90deg,rgba(196,163,90,.1),rgba(11,14,22,.92))}
.guest-card .bust{flex:0 0 auto;width:92px;height:114px;padding:4px;
  background:radial-gradient(ellipse at 50% 20%,rgba(196,163,90,.16),#0b0e16 70%);
  box-shadow:inset 0 0 0 1px var(--gold),inset 0 0 0 3px rgba(14,12,10,.9),inset 0 0 0 4px rgba(196,163,90,.35);
  overflow:hidden}
.guest-card svg{width:100%;height:100%;display:block;object-fit:contain}
.guest-card .ginfo{flex:1;min-width:0}
.guest-card .chev{color:var(--gold);opacity:.5;font-size:18px;padding-right:4px}
.gmeta{font-size:11px;color:var(--parch2);margin:4px 0}
.detail{display:none}
.detail h3{letter-spacing:.12em;color:var(--gold2);font-size:20px}
.detail p{font-size:13px;line-height:1.7;color:var(--parch);opacity:.9}
.botnav{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:6;
  transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .3s ease}
.botnav.away{transform:translateY(130%);opacity:0;pointer-events:none}

.botnav{transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .3s ease}
.botnav.away{transform:translateY(130%);opacity:0;pointer-events:none}
.sheet-backdrop{position:absolute;inset:0;z-index:16;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s ease}
.sheet-backdrop.on{opacity:1;pointer-events:auto}
.guest-sheet{position:absolute;left:0;right:0;bottom:0;z-index:18;max-height:78%;overflow:auto;
  transform:translateY(110%);transition:transform .42s cubic-bezier(.2,.8,.2,1);
  padding:8px 16px 22px;
  background:linear-gradient(180deg,rgba(48,40,28,.2),transparent 18%),linear-gradient(180deg,rgba(22,26,38,.98),rgba(7,8,13,.98));
  border-top:1px solid var(--gold4);
  box-shadow:inset 0 1px 0 rgba(243,230,192,.25),0 -18px 40px rgba(0,0,0,.55);-webkit-overflow-scrolling:touch}
.guest-sheet.on{transform:translateY(0)}
.sheet-handle{width:48px;height:4px;border-radius:2px;background:var(--gold3);margin:4px auto 10px}
.sheet-top{display:flex;gap:14px;align-items:flex-start}
.sheet-top svg{width:110px;height:150px;flex:0 0 auto;filter:drop-shadow(0 8px 12px rgba(0,0,0,.5))}
.sheet-actions{display:flex;gap:8px;margin-top:14px}
.sheet-actions .btn.primary{flex:1;padding:16px 18px;font-size:16px;letter-spacing:.16em}
.sheet-close{position:absolute;top:12px;right:12px;width:36px;height:36px;border:1px solid var(--gold3);color:var(--gold2)}
.bonus-sum{padding:10px 12px;border:1px solid var(--gold3);background:rgba(0,0,0,.28);color:var(--gold2);font-size:12px;letter-spacing:.04em;line-height:1.6}
.gift-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.gift-cell{padding:10px;display:flex;flex-direction:column;gap:4px}
.gift-cell .on{border-color:var(--gold)}
@media (min-width:861px){
  .guest-sheet{left:auto;right:20px;bottom:24px;top:auto;width:min(460px,40vw);max-height:calc(100% - 110px);
    transform:translateX(120%);border:1px solid var(--gold3);border-top:1px solid var(--gold)}
  .guest-sheet.on{transform:translateX(0)}
  .sheet-handle{display:none}
}

/* battle */
#scene-battle{background:transparent}
.battle-stage{position:absolute;inset:0;display:flex;flex-direction:column}
.arena{flex:1;position:relative;overflow:hidden}
.arena-bg{position:absolute;inset:0;width:100%;height:100%}
.fighter{position:absolute;bottom:7%;width:min(40vw,380px);transform-origin:50% 100%;
  animation:breathe 3.8s ease-in-out infinite;filter:drop-shadow(0 18px 22px rgba(0,0,0,.75));
  z-index:3}
.fighter:after{content:"";position:absolute;left:50%;bottom:2%;width:70%;height:48px;transform:translateX(-50%);
  background:radial-gradient(ellipse,rgba(230,211,163,.32),transparent 70%);pointer-events:none;z-index:-1}
.fighter svg{width:100%;height:auto;display:block}
.fighter.librarian{left:4%}
.fighter.guest{right:4%;animation-delay:-1.4s}
.fighter.guest.arch-knight{animation:idleKnight 3.2s ease-in-out infinite}
.fighter.guest.arch-scholar{animation:idleScholar 3.6s ease-in-out infinite}
.fighter.guest.arch-beast{animation:idleBeast 2.2s ease-in-out infinite}
.fighter.guest.arch-puppet{animation:idlePuppet 2.8s ease-in-out infinite}
.fighter.guest.arch-fixer{animation:idleFixer 3.4s ease-in-out infinite}
.fighter.guest.arch-mage{animation:idleMage 4s ease-in-out infinite}
.fighter.staggered{filter:grayscale(.3) brightness(1.15) drop-shadow(0 0 16px rgba(224,180,58,.7));
  animation:staggerShake .18s linear infinite}
.fighter.hit{animation:guestHit .28s ease}
.fighter.defeated{animation:guestDown .55s ease forwards;filter:grayscale(.65) brightness(.7)}
@keyframes idleKnight{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes idleScholar{0%,100%{transform:translateY(0) rotate(-.4deg)}50%{transform:translateY(-7px) rotate(.5deg)}}
@keyframes idleBeast{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-5px) scale(1.03,.97)}}
@keyframes idlePuppet{0%,100%{transform:rotate(-1.4deg) translateY(0)}40%{transform:rotate(1.8deg) translateY(-4px)}75%{transform:rotate(-.6deg) translateY(-1px)}}
@keyframes idleFixer{0%,100%{transform:translateY(0) translateX(0)}50%{transform:translateY(-5px) translateX(1px)}}
@keyframes idleMage{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}
@keyframes guestHit{0%{transform:translateX(0)}35%{transform:translateX(16px) rotate(3deg)}100%{transform:translateX(0)}}
@keyframes guestDown{to{transform:translateY(36px) rotate(10deg);opacity:.25}}
.hud-top{position:absolute;top:10px;left:16px;right:60px;display:grid;grid-template-columns:1fr auto 1fr;gap:16px;z-index:5;align-items:start}
.bars{padding:12px 14px 12px}
.bar-lab{display:flex;justify-content:space-between;font-size:11px;color:var(--parch2);letter-spacing:.08em;margin-bottom:5px}
.bar{height:14px;background:linear-gradient(180deg,#05060a,#12141c);border:1px solid var(--gold3);
  overflow:hidden;position:relative;box-shadow:inset 0 1px 2px rgba(0,0,0,.7)}
.bar .ghost,.bar .fill{position:absolute;left:0;top:0;bottom:0;width:0;display:block}
.bar .ghost{background:rgba(243,230,192,.55);transition:width .85s .12s ease-out}
.bar .fill{box-shadow:0 0 10px currentColor;transition:width .28s ease-out}
.bar.hp .fill{background:linear-gradient(180deg,#d5ffe8 0%,#6ebd96 42%,#2d6b52 100%)}
.bar.stag .fill{background:linear-gradient(180deg,#fff3b0 0%,#e0b43a 45%,#8a6a10 100%)}
.bar .segs{position:absolute;inset:0;pointer-events:none;z-index:2;
  background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(0,0,0,.55) 9px 10px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15),inset 0 -1px 0 rgba(0,0,0,.4)}
.orbs,.pips{display:flex;gap:6px;align-items:center;margin-top:7px;font-size:11px;color:var(--parch2);letter-spacing:.08em}
.orb{width:12px;height:12px;border-radius:50%;border:1px solid var(--gold);background:#222;box-shadow:none;transition:.3s}
.orb.on{background:radial-gradient(circle at 35% 35%,#fff6c8,var(--gold));box-shadow:0 0 8px var(--gold)}
.pip{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:11px solid #333}
.pip.on{border-bottom-color:var(--gold);filter:drop-shadow(0 0 4px var(--gold))}
.turnchip{align-self:center;color:var(--gold2);letter-spacing:.2em;font-size:12px;text-align:center}
.clash{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:28px;
  z-index:6;opacity:0;pointer-events:none;filter:drop-shadow(0 0 18px rgba(196,163,90,.45))}
.clash.show{opacity:1}
.clash .vs{font-family:Georgia,serif;letter-spacing:.45em;color:var(--gold4);font-size:28px;text-shadow:0 0 22px rgba(196,163,90,.9);z-index:2}
.die{width:110px;height:110px;transform-style:preserve-3d;position:relative;z-index:2}
.die svg{width:110px;height:110px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.6))}
.die.roll{animation:dieroll .36s ease-in}
.impact-ring,.slash{position:absolute;left:50%;top:50%;pointer-events:none;opacity:0;z-index:1}
.impact-ring{width:24px;height:24px;border:2px solid #f3e6c0;border-radius:50%;transform:translate(-50%,-50%)}
.slash{width:420px;height:5px;background:linear-gradient(90deg,transparent,#fff, #f3e6c0,transparent);
  box-shadow:0 0 18px #fff,0 0 28px #e6d3a3;transform:translate(-50%,-50%) rotate(-28deg) scaleX(0)}
.slash.s2{transform:translate(-50%,-50%) rotate(18deg) scaleX(0);width:300px;height:4px}
.clash.hit .impact-ring{animation:ring .5s ease-out}
.clash.hit .slash.s1{animation:slash .28s ease-out}
.clash.hit .slash.s2{animation:slash2 .32s ease-out .04s}
.clash.crit .vs{animation:critpulse .5s ease}
@keyframes ring{0%{width:20px;height:20px;opacity:1}100%{width:360px;height:360px;opacity:0}}
@keyframes slash{0%{transform:translate(-50%,-50%) rotate(-28deg) scaleX(0);opacity:0}
  20%{opacity:1;transform:translate(-50%,-50%) rotate(-28deg) scaleX(1)}
  100%{opacity:0;transform:translate(-50%,-50%) rotate(-28deg) scaleX(1.2)}}
@keyframes slash2{0%{transform:translate(-50%,-50%) rotate(18deg) scaleX(0);opacity:0}
  22%{opacity:1;transform:translate(-50%,-50%) rotate(18deg) scaleX(1)}
  100%{opacity:0;transform:translate(-50%,-50%) rotate(18deg) scaleX(1.15)}}
@keyframes critpulse{0%,100%{transform:scale(1)}40%{transform:scale(1.35);color:#fff;text-shadow:0 0 28px #fff}}
body.slowmo #shake{animation:slo .55s ease}
@keyframes slo{0%{transform:scale(1.045)}100%{transform:none}}
.hand{position:absolute;bottom:10px;left:0;right:0;height:240px;display:flex;justify-content:center;align-items:flex-end;z-index:7;
  pointer-events:none}

.card{position:relative;width:100%;height:100%;padding:12px 11px 10px;overflow:hidden;

    radial-gradient(ellipse at 50% 0%,rgba(196,163,90,.16),transparent 46%),

  background:linear-gradient(115deg,transparent 35%,rgba(243,230,192,.0) 42%,rgba(243,230,192,.28) 50%,rgba(243,230,192,0) 58%,transparent 65%);

.card .row{display:flex;justify-content:space-between;align-items:center;z-index:3;position:relative}

.card .emo{display:flex;align-items:center;gap:3px;color:var(--gold2);font-size:10px;letter-spacing:.06em}

  filter:drop-shadow(0 0 8px rgba(196,163,90,.45))}
.card .nm{margin-top:2px;letter-spacing:.08em;font-size:14px;z-index:3;position:relative}
.card .tx{margin-top:4px;font-size:10px;line-height:1.45;color:var(--parch2);flex:1;z-index:3;position:relative}
.card .dice{font-size:10px;color:var(--gold2);letter-spacing:.04em;z-index:3;position:relative;display:flex;gap:6px;flex-wrap:wrap}
.card .dice span{display:inline-flex;align-items:center;gap:3px}
.qpanel{position:absolute;left:50%;bottom:18%;transform:translateX(-50%);width:min(640px,92vw);z-index:12;
  padding:20px 22px;display:none}
.qpanel.on{display:block;animation:rise .16s ease}
.qpanel h4{color:var(--gold);letter-spacing:.16em;margin-bottom:10px;font-size:12px}
.qpanel .prompt{font-size:16px;line-height:1.65;margin-bottom:14px}

  background:rgba(0,0,0,.25);letter-spacing:.02em}
.qopts button:hover{border-color:var(--gold);background:rgba(196,163,90,.12)}
.result-banner{position:absolute;left:50%;top:18%;transform:translateX(-50%);z-index:12;text-align:center;display:none}
.result-banner.on{display:block;animation:rise .4s ease}
.result-banner .big{font-size:32px;letter-spacing:.28em;color:var(--gold4);text-shadow:0 0 22px rgba(196,163,90,.5)}
.result-banner .msg{margin-top:8px;max-width:520px;color:var(--parch);line-height:1.6}
.expl{margin-top:12px;padding:12px 14px;border:1px solid var(--gold3);background:rgba(0,0,0,.35);
  color:var(--parch2);font-size:13px;line-height:1.7;text-align:left}
.dmg{position:absolute;z-index:16;font-family:Georgia,serif;font-size:38px;font-weight:700;color:#ffe7b0;
  text-shadow:0 0 8px #000,0 0 16px var(--gold),0 0 24px var(--blood);animation:floatDmg .75s ease forwards;pointer-events:none}
.dmg.hurt{color:#ff8b7a}
.dmg.stag{color:#e0b43a;font-size:26px;letter-spacing:.08em;text-shadow:0 0 8px #000,0 0 16px #e0b43a}
.flash{position:absolute;inset:0;z-index:8;pointer-events:none;background:#fff;opacity:0}
.logbox{position:absolute;left:16px;top:118px;width:min(260px,24vw);max-height:16vh;overflow:auto;
  font-size:11px;line-height:1.55;color:var(--parch2);padding:8px 10px;background:rgba(0,0,0,.4);

#shake{position:absolute;inset:0}

/* shelf & collection */
.panel-scene{padding:56px 24px 86px;overflow:hidden}
.scroll{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;padding-bottom:12px}
.book-item,.key-item{padding:14px;display:flex;gap:12px;align-items:center}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;padding-bottom:88px}
.al-cell{padding:10px;text-align:center;min-height:128px;border:1px solid var(--n4);background:rgba(0,0,0,.25)}
.al-cell.own{border-color:var(--gold3);background:rgba(26,33,48,.7)}
.al-cell.eq{border-color:var(--gold);box-shadow:0 0 12px rgba(196,163,90,.35)}
.al-cell .nm{font-size:11px;margin-top:6px;color:var(--parch2)}
.tabs{display:flex;gap:8px;margin:8px 0 14px;flex-wrap:wrap}

/* gacha stage */
.gacha-stage{position:relative;min-height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  overflow:hidden;background:radial-gradient(ellipse at 50% 80%,rgba(196,163,90,.16),transparent 55%),#07080d}
.pillar{position:absolute;bottom:0;left:50%;width:90px;height:0;transform:translateX(-50%);
  background:linear-gradient(180deg,transparent 0%,currentColor 55%,#fff6c8 100%);opacity:0;filter:blur(10px);pointer-events:none}
.pillar.p-wide{width:220px;filter:blur(22px);opacity:0}
.pillar.p-mid{width:70px;filter:blur(8px)}
.pillar.p-core{width:14px;filter:blur(2px);background:linear-gradient(180deg,transparent,#fff)}
.pillar.on{height:100%;opacity:.7;animation:pillar .85s ease forwards}
.flare{position:absolute;left:50%;bottom:8%;width:20px;height:20px;border-radius:50%;transform:translate(-50%,0) scale(0);
  background:radial-gradient(circle,#fff,#e6d3a3 40%,transparent 70%);pointer-events:none;opacity:0}
.flare.on{animation:flare .9s ease forwards}
@keyframes flare{0%{transform:translate(-50%,0) scale(.2);opacity:0}30%{opacity:1;transform:translate(-50%,-20px) scale(6)}100%{opacity:0;transform:translate(-50%,-40px) scale(10)}}
.gcard{width:210px;height:300px;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.2,.8,.2,1);z-index:2}
.gcard.flip{transform:rotateY(180deg)}
.gface{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--gold);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;
  background:linear-gradient(180deg,#1a140c,#0b0e16)}
.gface.back{background:
  repeating-linear-gradient(45deg,rgba(196,163,90,.08) 0 8px,transparent 8px 16px),
  radial-gradient(circle at 50% 40%,#2a2214,#0b0e16)}
.gface.front{transform:rotateY(180deg);text-align:center}
.gface .rar{letter-spacing:.3em;color:var(--gold);margin-top:8px}

/* toast / fx */
#toast{position:absolute;top:20%;left:50%;transform:translateX(-50%);z-index:35;color:var(--gold4);
  letter-spacing:.18em;font-size:20px;text-shadow:0 0 18px rgba(196,163,90,.6);opacity:0;transition:opacity .3s;pointer-events:none}
#toast.on{opacity:1}
.learn-toast{position:absolute;left:16px;bottom:26%;width:min(380px,86vw);z-index:20;pointer-events:none;opacity:0;
  transition:opacity .3s ease;padding:10px 12px;border-left:2px solid var(--gold);
  background:rgba(10,10,16,.88);color:var(--parch);font-size:12px;line-height:1.6;
  box-shadow:0 10px 28px rgba(0,0,0,.45)}
.learn-toast.on{opacity:1}
.learn-toast b{color:var(--gold2);letter-spacing:.1em;font-weight:600;display:block;margin-bottom:4px;font-size:11px}
#lineup{position:absolute;inset:0;z-index:25;display:none;align-items:flex-end;justify-content:center;gap:1.5vw;
  padding:6% 3% 8%;background:radial-gradient(ellipse at 50% 30%,rgba(30,34,48,.2),rgba(7,8,13,.94));pointer-events:none}
#lineup.on{display:flex}
#lineup .lu-item{flex:1;max-width:280px;text-align:center}
#lineup .lu-item svg{width:100%;height:auto;max-height:72vh;filter:drop-shadow(0 16px 18px rgba(0,0,0,.6))}
#lineup .lu-name{color:var(--gold2);letter-spacing:.12em;margin-top:10px;font-size:14px;text-shadow:0 2px 8px #000}
#lineup .lu-sub{color:var(--parch2);font-size:11px;letter-spacing:.16em;margin-top:2px}
.burst{position:absolute;inset:0;pointer-events:none;z-index:11}

@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes flicker{from{transform:scaleY(.9) scaleX(1.05);opacity:.8}to{transform:scaleY(1.1) scaleX(.95);opacity:1}}
@keyframes glow{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:.8;transform:scale(1.08)}}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-5px) scale(1.01,1.015)}}
@keyframes staggerShake{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-3px) rotate(-1deg)}75%{transform:translateX(3px) rotate(1deg)}}
@keyframes dieroll{0%{transform:rotateX(0) rotateY(0) scale(.4)}70%{transform:rotateX(420deg) rotateY(300deg) scale(1.1)}100%{transform:rotateX(360deg) rotateY(360deg) scale(1)}}
@keyframes rise{from{opacity:0;transform:translateX(-50%) translateY(16px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes floatDmg{0%{opacity:0;transform:translate(-50%,8px) scale(.8)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-48px) scale(1.1)}}
@keyframes pillar{from{opacity:0;height:0}to{opacity:.55;height:100%}}
@keyframes bookIn{0%{transform:scale(1.3) rotate(-8deg);filter:blur(6px);opacity:.2}100%{transform:none;filter:none;opacity:1}}

@media (max-width:860px){
  #scene-lobby,.panel-scene{padding:6px 10px 70px}
  .topbar{padding:0 48px 8px 0;gap:4px 8px}

  .hudstat,.pill{font-size:10px}
  .lobby-grid{display:flex;flex-direction:column;grid-template-columns:none;grid-template-rows:none;gap:8px;min-height:0;overflow:hidden}

  .lobby-grid>.col.mid{flex:1 1 auto;min-height:0;overflow:hidden}
  .floor-hero{height:86px}

  .guests{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px;gap:8px}
  .guest-card{flex:0 0 auto;padding:8px}
  .guest-card svg{width:64px;height:80px}
  .detail{flex:0 1 auto;max-height:30%;min-height:0;overflow:auto;padding:10px 12px}
  .detail h3{font-size:16px}
  .detail p{font-size:12px;line-height:1.5;max-height:4.6em;overflow:auto}
  .botnav{bottom:8px;left:8px;right:8px;gap:8px}

  #mute{top:8px;right:8px;bottom:auto;width:42px;height:32px}

  .fighter.guest{right:1%}

  .hand .cc{width:86px;height:128px;margin:0 -14px}

  .card .nm{font-size:11px;margin-top:2px}

  .bars{padding:8px 8px}
  .bar-lab,.orbs,.pips{white-space:nowrap;font-size:10px}

  .qopts{grid-template-columns:1fr}

}
#mute{white-space:nowrap;word-break:keep-all;min-width:3.4em}
</style>
</head>

</div>
<svg width="0" height="0" style="position:absolute">

      <stop offset="0%" stop-color="#3a2a18"/><stop offset="100%" stop-color="#120e0a"/>

</svg>
<script>
/* ============================================================
 * 개념의 서고 — 데이터 (나중에 FLOORS / WEAK_POINTS / TICKET_RULES / GACHA_RULES 만 교체)
 * ============================================================ */
const FLOORS = [
  { id:"memory", name:"기억의 층", subject:"학습법 (예시)", motto:"잊힐 때까지 기다리는 책장." },
  { id:"cognition", name:"인지의 층", subject:"학습법 (예시)", motto:"알고 있는지, 아직 모르는지를 보는 창." }
];

const WEAK_POINTS = [
  {
    id:"pomodoro", floorId:"memory", concept:"포모도로 기법", subject:"학습법 (예시)", weakness:1, archetype:"fixer", palette:"teal", accessory:"hourglass",
    explanation:"포모도로는 25분 집중과 5분 휴식을 한 세트로 반복하며, 집중 중에는 다른 일을 끼워 넣지 않는 기법입니다. 목적은 무작정 긴 공부가 아니라, 집중과 휴식의 리듬을 만드는 것입니다.",
    questions:[
      { type:"mc", prompt:"포모도로 기법의 기본 집중 시간으로 가장 잘 쓰이는 것은?", options:["25분","10분","60분","5분"], correctIndex:0 },
      { type:"mc", prompt:"한 포모도로 세션이 끝나면 보통 좋은 짧은 휴식은?", options:["5분","30분","휴식 없이 바로 다음","2시간"], correctIndex:0 },
      { type:"ox", prompt:"포모도로 집중 시간 동안에는 다른 일을 끼워 넣는 것이 좋다.", options:["O","X"], correctIndex:1 },
      { type:"mc", prompt:"포모도로를 쓰는 가장 큰 목적은?", options:["집중과 휴식의 리듬을 만드는 것","하루 전체를 한 과목에만 쓰는 것","시험 범위를 줄이는 것","암기 횟수를 기록하는 것"], correctIndex:0 }
    ]
  },
  {
    id:"active-recall", floorId:"memory", concept:"능동적 회상", subject:"학습법 (예시)", weakness:2, archetype:"scholar", palette:"amber", accessory:"quill",
    explanation:"능동적 회상은 자료를 닫고 기억에서 꺼내 보는 연습입니다. 다시 읽기나 하이라이트만으로는 '알게 된 느낌'만 부풀리기 쉽습니다. 백지에 써 보거나 문제로 점검하는 쪽이 기억을 더 강하게 만듭니다.",
    questions:[
      { type:"mc", prompt:"능동적 회상에 가장 가까운 설명은?", options:["책을 닫고 기억에서 꺼내 보기","중요한 문장에 밑줄만 긋기","교과서를 여러 번 다시 읽기","형광펜으로 색만 칠하기"], correctIndex:0 },
      { type:"ox", prompt:"교과서를 여러 번 읽기만 하는 것이 능동적 회상이다.", options:["O","X"], correctIndex:1 },
      { type:"mc", prompt:"다음 중 능동적 회상에 가장 가까운 활동은?", options:["백지에 기억나는 대로 써 보기","색연필로 필기를 꾸미기","강의를 다시 틀어만 보기","요약본을 그대로 베껴 쓰기"], correctIndex:0 },
      { type:"mc", prompt:"능동적 회상이 효과적인 이유는?", options:["기억에서 꺼내는 연습이 기억을 강화하기 때문","글씨를 예쁘게 쓰게 되기 때문","공부 시간이 길어지기 때문","같은 문장을 반복 필사하기 때문"], correctIndex:0 }

  {

function giftTotals(s){

}

function rollDie(die, mode, minBonus=0){
  if(mode==="break") return 0;
  const lo=die.min+(minBonus||0);
  const hi=Math.max(lo, die.max);
  if(mode==="boost") return hi+2;
  if(mode==="weak") return lo;
  return lo + Math.floor(Math.random()*(hi-lo+1));
}
function resolveClash(page, guestDie, correct, staggered, emotion){
  const pd = page.dice[0];
  const playerRoll = rollDie(pd, correct?"boost":"weak", giftTotals(save).dieMin) + (correct?emotion:0);
  const guestRoll = rollDie(guestDie, (staggered||correct)?"break":"normal");
  let damageToGuest=0, damageToPlayer=0, flavor="", crit=false;
  if(correct){
    crit = playerRoll >= pd.max+2+emotion-1;
    if(isAttack(pd.type)){ damageToGuest=playerRoll; flavor=`합 승리! 손님의 주사위가 깨졌고, ${pd.type} ${playerRoll}로 꿰뚫었다.`; }

  } else if(pd.type==="방어"){
    damageToPlayer=Math.max(0,guestRoll-playerRoll);
    flavor=`합 패배. 방어 ${playerRoll}으로 ${guestRoll}을 받아, ${damageToPlayer} 피해. 설명을 기억해 두자.`;

    if(playerRoll>=guestRoll) flavor=`합은 졌지만, 회피 ${playerRoll}이 일격을 흘렸다. 그래도 설명은 읽어 두자.`;

  }

function rollRarity(pitySr,pitySsr){
  if(pitySsr+1>=GACHA_RULES.ssrPity) return "SSR";
  if(pitySr+1>=GACHA_RULES.srPity) return Math.random()<0.2?"SSR":"SR";
  const roll=Math.random()*100;
  const n=GACHA_RULES.rates.N, r=n+GACHA_RULES.rates.R, sr=r+GACHA_RULES.rates.SR;
  return roll<n?"N":roll<r?"R":roll<sr?"SR":"SSR";
}
function pickGachaItem(rarity, ownedIds){
  const owned=new Set(ownedIds);
  const unowned=COSMETIC_ITEMS.filter(i=>!owned.has(i.id));
  const of=(rar,only)=>COSMETIC_ITEMS.filter(i=>i.rarity===rar&&(!only||!owned.has(i.id)));
  if(!GACHA_RULES.preferUnowned||!unowned.length){ const p=of(rarity,false); return pick(p.length?p:COSMETIC_ITEMS); }
  let pool=of(rarity,true);
  if(!pool.length){
    const start=RARITY_ORDER.indexOf(rarity);
    for(let i=start+1;i<RARITY_ORDER.length;i++){ pool=of(RARITY_ORDER[i],true); if(pool.length) break; }
    if(!pool.length) for(let i=start-1;i>=0;i--){ pool=of(RARITY_ORDER[i],true); if(pool.length) break; }
    if(!pool.length) pool=unowned;
  }
  return pick(pool);
}

const SFX = (() => {
  let ctx=null, muted=false, amb=null, ambNodes=[];
  const ensure=()=>{ if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)(); if(ctx.state==="suspended") ctx.resume(); return ctx; };
  const env=(g,t,a=.01,h=.06,d=.2,vol=.08)=>{ g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+a); g.gain.exponentialRampToValueAtTime(.0001,t+a+h+d); };
  function tone(freq,type,dur,vol=.08,det=0){
    if(muted) return; const c=ensure(), t=c.currentTime;
    const o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(freq+det,t);
    o.connect(g); g.connect(c.destination);
    env(g,t,.01,.04,dur,vol); o.start(t); o.stop(t+dur+.05);
  }
  function noise(dur,vol=.05,hp=800){
    if(muted) return; const c=ensure(), t=c.currentTime;
    const buf=c.createBuffer(1,c.sampleRate*dur,c.sampleRate);
    const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const src=c.createBufferSource(); src.buffer=buf;
    const f=c.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp;
    const g=c.createGain(); env(g,t,.005,.02,dur,vol);
    src.connect(f); f.connect(g); g.connect(c.destination); src.start(t);
  }
  return {
    get muted(){ return muted; },
    setMuted(v){ muted=v; if(v) this.stopAmb(); else if(ctx) this.ambience(); },
    unlock(){ ensure(); },
    hover(){ tone(740,"sine",.08,.03); },
    click(){ tone(520,"triangle",.09,.05); tone(880,"sine",.06,.03); },
    card(){ tone(390,"triangle",.12,.05); tone(220,"sine",.16,.03); },
    dice(){ noise(.18,.06,1200); tone(180,"square",.1,.03); },
    clash(win){
      noise(.22,.1,400);
      if(win){ tone(220,"sawtooth",.2,.07); tone(440,"triangle",.25,.05); tone(880,"sine",.4,.04); }
      else { tone(110,"sawtooth",.3,.08); tone(90,"square",.25,.04); }
    },
    crit(){ tone(523,"sine",.3,.06); tone(784,"sine",.35,.05); tone(1046,"triangle",.5,.04); },
    stagger(){ tone(140,"sawtooth",.4,.07); noise(.3,.08,300); },
    emotion(){ [392,523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,"sine",.25,.05), i*80)); },
    win(){ [392,494,587,784].forEach((f,i)=>setTimeout(()=>tone(f,"triangle",.28,.06), i*110)); },
    lose(){ tone(196,"sine",.4,.06); setTimeout(()=>tone(147,"triangle",.5,.05),200); },
    gacha(r){
      noise(.15,.05,900);
      if(r==="SSR"){ [261,329,392,523,784].forEach((f,i)=>setTimeout(()=>tone(f,"sine",.4,.07),i*90)); }
      else if(r==="SR"){ [329,415,523].forEach((f,i)=>setTimeout(()=>tone(f,"triangle",.28,.06),i*100)); }
      else tone(330,"sine",.2,.05);
    },
    book(){ tone(196,"triangle",.3,.05); tone(392,"sine",.4,.04); },
    ambuence(){},
    ambience(){
      if(muted) return; const c=ensure(); this.stopAmb();
      const make=(freq,type,vol)=>{
        const o=c.createOscillator(), g=c.createGain(), lfo=c.createOscillator(), lg=c.createGain();
        o.type=type; o.frequency.value=freq;
        lfo.frequency.value=.06+Math.random()*.04; lg.gain.value=freq*.03;
        lfo.connect(lg); lg.connect(o.frequency);
        g.gain.value=vol; o.connect(g); g.connect(c.destination);
        o.start(); lfo.start(); ambNodes.push(o,lfo,g);
      };
      make(55,"sine",.03); make(82,"sine",.018); make(164,"triangle",.01);
      amb=true;
    },
    stopAmb(){ ambNodes.forEach(n=>{ try{ n.stop?n.stop():n.gain&&(n.gain.value=0);}catch(e){} }); ambNodes=[]; amb=null; }
  };
})();

function setBar(id,pct){
  pct=Math.max(0,Math.min(100,pct||0));
  const fill=$("#"+id), ghost=$("#"+id+"-g");
  const prev=fill?parseFloat(fill.style.width)||0:pct;
  if(fill) fill.style.width=pct+"%";
  if(ghost){
    if(pct>=prev-0.05){ ghost.style.transition="none"; ghost.style.width=pct+"%"; void ghost.offsetWidth; ghost.style.transition=""; }
    else ghost.style.width=pct+"%";
  }
}

      ctx.fillRect(x, y-hh, 10*scale, hh);
      if((x|0)%5===0){ ctx.fillStyle="#c4a35a"; ctx.fillRect(x+2,y-hh,2,Math.min(8,hh)); }
      x+=gap;
    }
    ctx.restore();
  }
  function gothicWindow(ctx, cx, cy, sc, stained){
    ctx.save(); ctx.translate(cx, cy); ctx.scale(sc, sc);
    ctx.beginPath(); ctx.moveTo(-78,130); ctx.lineTo(-78,24); ctx.quadraticCurveTo(0,-36,78,24); ctx.lineTo(78,130); ctx.closePath();
    if(stained){
      const g=ctx.createLinearGradient(0,-20,0,130);
      g.addColorStop(0,"rgba(60,80,110,.45)"); g.addColorStop(.5,"rgba(40,50,70,.35)"); g.addColorStop(1,"rgba(20,24,36,.5)");
      ctx.fillStyle=g; ctx.fill();
      ctx.save(); ctx.clip();
      ctx.strokeStyle="rgba(196,163,90,.35)"; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(0,-20); ctx.lineTo(0,130); ctx.moveTo(-78,68); ctx.lineTo(78,68);
      ctx.moveTo(-40,24); ctx.lineTo(-40,130); ctx.moveTo(40,24); ctx.lineTo(40,130); ctx.stroke();
      // warm light through glass
      const lg=ctx.createRadialGradient(0,40,4,0,40,90);
      lg.addColorStop(0,"rgba(230,211,163,.28)"); lg.addColorStop(1,"rgba(230,211,163,0)");
      ctx.fillStyle=lg; ctx.fillRect(-78,-36,156,166);
      ctx.restore();
    } else {
      ctx.fillStyle="rgba(16,20,30,.4)"; ctx.fill();
    }
    ctx.strokeStyle="rgba(196,163,90,.7)"; ctx.lineWidth=2.2; ctx.stroke();
    ctx.strokeStyle="rgba(243,230,192,.35)"; ctx.lineWidth=.8;
    ctx.beginPath(); ctx.moveTo(-78,130); ctx.lineTo(-78,24); ctx.quadraticCurveTo(0,-36,78,24); ctx.lineTo(78,130); ctx.stroke();
    ctx.restore();
  }
  function drawArena(ctx){
    // side halls + perspective floor, no center window
    const spotL=ctx.createRadialGradient(w*.22,h*.72,10,w*.22,h*.72,w*.28);
    spotL.addColorStop(0,"rgba(230,211,163,.16)"); spotL.addColorStop(1,"transparent");
    const spotR=ctx.createRadialGradient(w*.78,h*.72,10,w*.78,h*.72,w*.28);
    spotR.addColorStop(0,"rgba(180,160,200,.10)"); spotR.addColorStop(1,"transparent");
    ctx.fillStyle=spotL; ctx.fillRect(0,0,w,h);
    ctx.fillStyle=spotR; ctx.fillRect(0,0,w,h);
    // tall side shelves
    for(let side=0; side<2; side++){
      for(let row=0; row<7; row++){
        const y=h*.18+row*(h*.09);
        const x0=side?w-150:12;
        ctx.fillStyle="#120e0a"; ctx.fillRect(x0,y+28,138,7);
        ctx.fillStyle="rgba(196,163,90,.22)"; ctx.fillRect(x0,y+28,138,1);
        for(let i=0;i<9;i++){
          const hh=16+(i*7+row*3)%18;
          const gold=(i+row)%5===0;
          ctx.fillStyle=gold?"#c4a35a": (i%2?"#2a1c12":"#1a140c");
          ctx.fillRect(x0+6+i*14, y+28-hh, 12, hh);
        }
      }
    }
    // wood floor perspective
    ctx.beginPath();
    ctx.moveTo(w*.1,h*.82); ctx.lineTo(w*.9,h*.82); ctx.lineTo(w,h); ctx.lineTo(0,h); ctx.closePath();
    const fg=ctx.createLinearGradient(0,h*.82,0,h);
    fg.addColorStop(0,"rgba(28,22,14,.85)"); fg.addColorStop(1,"rgba(8,6,4,.95)");
    ctx.fillStyle=fg; ctx.fill();
    ctx.strokeStyle="rgba(196,163,90,.35)"; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.moveTo(w*.1,h*.82); ctx.lineTo(w*.9,h*.82); ctx.stroke();
    ctx.strokeStyle="rgba(196,163,90,.12)"; ctx.lineWidth=1;
    for(let i=1;i<8;i++){
      const y=h*.82+(h*.18)*(i/8);
      ctx.beginPath(); ctx.moveTo(w*.1*(1-i/8), y); ctx.lineTo(w-w*.1*(1-i/8), y); ctx.stroke();
    }
    for(let i=0;i<=10;i++){
      const t=i/10;
      ctx.beginPath(); ctx.moveTo(w*.1+t*w*.8, h*.82); ctx.lineTo(t*w, h); ctx.stroke();
    }
  }
  function frame(ts){
    t=ts*.001;
    bctx.clearRect(0,0,w,h);
    const px=parallax.x, py=parallax.y;
    const g=bctx.createLinearGradient(0,0,0,h);
    g.addColorStop(0,"#0b0e16"); g.addColorStop(.45,"#121018"); g.addColorStop(1,"#07080d");
    bctx.fillStyle=g; bctx.fillRect(0,0,w,h);
    const lg=bctx.createRadialGradient(w*.5+px*8,h*.16+py*6,10,w*.5,h*.2,w*.5);
    lg.addColorStop(0, mode==="battle"?"rgba(230,211,163,.08)":"rgba(230,211,163,.26)");
    lg.addColorStop(1,"rgba(0,0,0,0)");
    bctx.fillStyle=lg; bctx.fillRect(0,0,w,h);
    if(mode==="battle"){
      drawArena(bctx);
    } else {
      gothicWindow(bctx, w/2+px*6, h*.075+py*4, mode==="title"?1.15:0.92, true);
      drawShelfLayer(bctx, h*.46+py*8, .7, .4, px*10 + t*2);
      drawShelfLayer(bctx, h*.62+py*14, 1, .6, -px*18);
      drawShelfLayer(bctx, h*.82+py*22, 1.45, .85, px*28);
      bctx.fillStyle="rgba(10,8,6,.55)"; bctx.fillRect(0,h*.86,w,h*.14);
      bctx.strokeStyle="rgba(196,163,90,.25)"; bctx.beginPath(); bctx.moveTo(40,h*.88); bctx.lineTo(w-40,h*.88); bctx.stroke();
    }
    for(const p of dust){
      p.y-=p.s*p.z; p.x+=Math.sin(t*p.z+p.y*.01)*.15;
      if(p.y<-5){ p.y=h+5; p.x=Math.random()*w; }
      bctx.fillStyle=p.hue+(p.a)+")";
      bctx.beginPath(); bctx.arc(p.x+px*p.z*8,p.y,p.r,0,6.28); bctx.fill();
    }
    fctx.clearRect(0,0,w,h);
    sparks=sparks.filter(s=>s.life>0);
    for(const s of sparks){
      s.life-=s.dec; s.x+=s.vx; s.y+=s.vy; s.vy+=.14;
      fctx.globalAlpha=Math.max(0,s.life);
      fctx.fillStyle=s.c;
      if(s.long){ fctx.save(); fctx.translate(s.x,s.y); fctx.rotate(s.rot||0); fctx.fillRect(0,0,s.sz*6,s.sz*.7); fctx.restore(); }
      else fctx.fillRect(s.x,s.y,s.sz,s.sz);
    }
    fctx.globalAlpha=1;
    requestAnimationFrame(frame);
  }
  return {
    init(){
      bg=$("#bg"); fx=$("#fx"); bctx=bg.getContext("2d"); fctx=fx.getContext("2d");
      resize(); addEventListener("resize", resize);
      addEventListener("pointermove", e=>{
        parallax.x=(e.clientX/w-.5)*12; parallax.y=(e.clientY/h-.5)*8;
      });
      requestAnimationFrame(frame);
    },
    setMode(m){ mode=m; },
    burst(x,y,n=28,color="#e6d3a3"){
      for(let i=0;i<n;i++){
        const a=Math.random()*6.28, sp=2+Math.random()*8;
        sparks.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3,life:1,dec:.016+Math.random()*.03,sz:1.5+Math.random()*3.2,c:color,long:i%3===0,rot:a});
      }
    },
    size(){ return {w,h}; }
  };
})();

function bindSheetSwipe(sheet){
  let y0=null, dy=0;
  const start=e=>{ const t=e.touches?e.touches[0]:e; y0=t.clientY; dy=0; };
  const move=e=>{
    if(y0==null) return;
    const t=e.touches?e.touches[0]:e; dy=t.clientY-y0;
    if(dy>0 && window.innerWidth<=860) sheet.style.transform=`translateY(${dy}px)`;
  };
  const end=()=>{
    if(y0==null) return;
    sheet.style.transform="";
    if(dy>64) closeGuestSheet();
    y0=null; dy=0;
  };
  sheet.addEventListener("touchstart", start, {passive:true});
  sheet.addEventListener("touchmove", move, {passive:true});
  sheet.addEventListener("touchend", end);
}


function paintMiniFloor(cv, fid){
  if(!cv) return;
  const W=cv.clientWidth,H=cv.clientHeight; if(!W||!H) return;
  cv.width=W*devicePixelRatio; cv.height=H*devicePixelRatio;
  const c=cv.getContext("2d"); c.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  const g=c.createLinearGradient(0,0,0,H); g.addColorStop(0,"#161018"); g.addColorStop(1,"#0a080c");
  c.fillStyle=g; c.fillRect(0,0,W,H);
  const rg=c.createRadialGradient(W*.72,H*.3,6,W*.72,H*.35,W*.4);
  rg.addColorStop(0,"rgba(230,211,163,.28)"); rg.addColorStop(1,"transparent");
  c.fillStyle=rg; c.fillRect(0,0,W,H);
  const x0=W*0.48;
  c.fillStyle="#1a140c"; c.fillRect(x0,H-16,W-x0,16);
  c.fillStyle="rgba(196,163,90,.25)"; c.fillRect(x0,H-16,W-x0,1);
  const n=Math.max(6, Math.floor((W-x0)/16));
  for(let i=0;i<n;i++){
    const x=x0+8+i*16, hh=18+(i*9)%(H*0.55);
    c.fillStyle=i%5===0?"#c4a35a":(i%2?"#2a1c12":"#1a140c");

    if(i%3===0){ c.fillStyle="rgba(230,211,163,.15)"; c.fillRect(x+2, H-16-hh, 2, Math.min(10,hh)); }
  }
}

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function buildQuiz(guest, recall){
  let qs=guest.questions.map(q=>{
    if(!recall || q.type==="ox") return {...q, options:q.options.slice()};
    const pairs=q.options.map((o,i)=>({o,i}));
    const sh=shuffle(pairs);
    return {...q, options:sh.map(p=>p.o), correctIndex:sh.findIndex(p=>p.i===q.correctIndex)};
  });
  return recall?shuffle(qs):qs;
}
function ensureRecall(id){
  if(!save.recallStats[id]) save.recallStats[id]={recalls:0,wins:0,correct:0,total:0,history:[]};
  return save.recallStats[id];
}

    qIndex:0, combo:0, turn:1, phase:"select",

}

function paintBattleFloor(cv, fid){
  if(!cv) return;
  const W=cv.clientWidth,H=cv.clientHeight;
  if(!W||!H) return;
  cv.width=W*devicePixelRatio; cv.height=H*devicePixelRatio;
  const c=cv.getContext("2d"); c.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  const g=c.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#0a0c12"); g.addColorStop(.45,"#101018"); g.addColorStop(1,"#07060a");
  c.fillStyle=g; c.fillRect(0,0,W,H);
  // high faint arch, well above HUD
  c.save(); c.globalAlpha=.35; c.translate(W/2, -20);
  c.beginPath(); c.moveTo(-120,110); c.lineTo(-120,20); c.quadraticCurveTo(0,-40,120,20); c.lineTo(120,110); c.closePath();
  const wg=c.createLinearGradient(0,0,0,110);
  wg.addColorStop(0,"rgba(80,100,130,.35)"); wg.addColorStop(1,"rgba(20,24,36,.1)");
  c.fillStyle=wg; c.fill();
  c.strokeStyle="rgba(196,163,90,.35)"; c.lineWidth=1.5; c.stroke();
  c.restore();
  const sl=c.createRadialGradient(W*.22,H*.7,20,W*.22,H*.7,W*.3);
  sl.addColorStop(0,"rgba(230,211,163,.2)"); sl.addColorStop(1,"transparent");
  const sr=c.createRadialGradient(W*.78,H*.7,20,W*.78,H*.7,W*.3);
  sr.addColorStop(0,"rgba(170,150,200,.12)"); sr.addColorStop(1,"transparent");
  c.fillStyle=sl; c.fillRect(0,0,W,H); c.fillStyle=sr; c.fillRect(0,0,W,H);
  for(let side=0;side<2;side++){
    for(let row=0;row<7;row++){
      const y=H*.16+row*(H*.085);
      const x0=side?W-148:10;
      c.fillStyle="#120e0a"; c.fillRect(x0,y+26,138,7);
      c.fillStyle="rgba(196,163,90,.2)"; c.fillRect(x0,y+26,138,1);
      for(let i=0;i<9;i++){
        const hh=16+(i*7+row*3)%18;
        c.fillStyle=(i+row)%5===0?"#c4a35a":(i%2?"#2a1c12":"#1a140c");
        c.fillRect(x0+6+i*14,y+26-hh,12,hh);
      }
    }
  }
  c.beginPath();
  c.moveTo(W*.1,H*.82); c.lineTo(W*.9,H*.82); c.lineTo(W,H); c.lineTo(0,H); c.closePath();
  const fg=c.createLinearGradient(0,H*.82,0,H);
  fg.addColorStop(0,"rgba(32,24,14,.9)"); fg.addColorStop(1,"rgba(8,6,4,.96)");
  c.fillStyle=fg; c.fill();
  c.strokeStyle="rgba(196,163,90,.4)"; c.lineWidth=1.6;
  c.beginPath(); c.moveTo(W*.1,H*.82); c.lineTo(W*.9,H*.82); c.stroke();
  c.strokeStyle="rgba(196,163,90,.12)"; c.lineWidth=1;
  for(let i=1;i<8;i++){
    const y=H*.82+(H*.18)*(i/8);
    c.beginPath(); c.moveTo(W*.1*(1-i/8),y); c.lineTo(W-W*.1*(1-i/8),y); c.stroke();
  }
  for(let i=0;i<=10;i++){
    const k=i/10;
    c.beginPath(); c.moveTo(W*.1+k*W*.8,H*.82); c.lineTo(k*W,H); c.stroke();
  }
}

function choosePage(pageId){
  if(!reception||reception.phase!=="select"||busy) return;
  const page=PAGE_BY[pageId]; if(!page) return;
  if(reception.light<page.cost||reception.emotion<page.emotion) return;
  SFX.card();
  reception.chosenPageId=pageId;
  reception.light-=page.cost;
  reception.phase="question";
  renderBattle();
}

function showQuestion(){
  const rec=reception, guest=GUEST_BY[rec.guestId], page=PAGE_BY[rec.chosenPageId];

    <div class="qopts">${q.options.map((o,i)=>`<button data-opt="${i}">${q.type==="mc"?String.fromCharCode(65+i)+". ":""}${o}</button>`).join("")}</div>`;
  $$("[data-opt]").forEach(b=>b.onclick=()=>answer(+b.dataset.opt));

function answer(opt){
  if(!reception||reception.phase!=="question"||busy) return;
  const rec=reception, guest=GUEST_BY[rec.guestId], page=PAGE_BY[rec.chosenPageId];
  const bank=rec.quiz||guest.questions;
  const q=bank[rec.qIndex%bank.length];
  const correct=opt===q.correctIndex;
  const gDie=rec.staggered?{...COMBAT.guestDie[guest.weakness],min:0,max:1}:COMBAT.guestDie[guest.weakness];
  const clash=resolveClash(page,gDie,correct,rec.staggered,rec.emotion);
  const ticketsBefore=ticketsHeld(save);
  rec.guestDie=gDie;
  rec.playerRoll=clash.playerRoll; rec.guestRoll=clash.guestRoll;
  rec.lastCorrect=correct; rec.lastFlavor=clash.flavor; rec.crit=clash.crit;
  rec.dmgG=clash.damageToGuest; rec.dmgP=clash.damageToPlayer; rec.stagHit=clash.staggerHit;

  let nextGuestHp=Math.max(0,rec.guestHp-clash.damageToGuest);
  let nextPlayerHp=Math.max(0,save.hp-clash.damageToPlayer);
  let nextStagger=rec.staggered?0:rec.stagger+clash.staggerHit;
  let nowStaggered=false;
  if(!rec.staggered && nextStagger>=rec.staggerMax){ nowStaggered=true; nextStagger=rec.staggerMax; }
  let emotion=rec.emotion, charge=rec.emotionCharge, combo=correct?rec.combo+1:0;
  let emoUp=false;
  if(correct){ charge+=1; if(charge>=COMBAT.chargesPerEmotion && emotion<COMBAT.emotionMax){ emotion+=1; charge=0; emoUp=true; } }
  else charge=0;
  const defeated=nextGuestHp<=0;
  const firstClear=defeated && !save.conqueredIds.includes(guest.id);
  const nextQ=save.questionsAnswered+1;
  const nextWins=save.receptionsWon+(firstClear?1:0);
  const ticketsGained=Math.max(0,(ticketsGranted(nextQ,nextWins)-save.ticketsSpent)-ticketsBefore);

  let nextLevel=save.level,nextXp=save.xp,nextMax=save.maxHp,levelMsg="";
  if(defeated){
    nextXp+=COMBAT.xpByWeakness[guest.weakness];
    let need=xpNeeded(nextLevel); const msgs=[];
    while(nextXp>=need){ nextXp-=need; nextLevel++; nextMax+=COMBAT.hpPerLevel; need=xpNeeded(nextLevel); msgs.push(`${pick(LEVEL_UP_MESSAGES)} (Lv.${nextLevel})`); }
    if(msgs.length) levelMsg=msgs.join(" ");
  }
  rec.log.push(clash.flavor);
  rec.sessionTotal=(rec.sessionTotal||0)+1;
  if(correct) rec.sessionCorrect=(rec.sessionCorrect||0)+1;
  const rst=ensureRecall(guest.id); rst.total++; if(correct) rst.correct++;
  if(!correct) rec.log.push("해설 · "+guest.explanation);
  if(nowStaggered) rec.log.push(`${guest.concept} 손님이 흐트러졌다!`);
  if(emoUp) rec.log.push(`감정 단계가 ${emotion}으로 올랐다.`);
  if(ticketsGained) rec.log.push(`책갈피 뽑기권 +${ticketsGained}`);
  if(defeated) rec.log.push(firstClear?`${guest.concept} 손님이 책이 되었다.`:`재접대를 마쳤다.`);

  const prevStat=save.conceptStats[guest.id]||{correct:0,total:0};
  save.hp=defeated&&levelMsg?nextMax:nextPlayerHp;
  save.maxHp=nextMax; save.level=nextLevel; save.xp=nextXp;
  save.questionsAnswered=nextQ; save.receptionsWon=nextWins;
  if(firstClear){ save.conqueredIds=[...save.conqueredIds,guest.id]; save.books={...save.books,[guest.id]:"shelved"}; }
  save.conceptStats={...save.conceptStats,[guest.id]:{correct:prevStat.correct+(correct?1:0),total:prevStat.total+1}};
  persist();

  rec.guestHp=nextGuestHp; rec.stagger=nowStaggered?rec.staggerMax:nextStagger;
  rec.willStagger=nowStaggered; rec.emotion=emotion; rec.emotionCharge=charge; rec.combo=combo;
  rec.qIndex++; rec.ticketsGained=ticketsGained; rec.levelUpMessage=levelMsg; rec.emoUp=emoUp;
  rec.maxLight=Math.min(COMBAT.maxLightCap,COMBAT.baseLight+emotion);
  rec.phase="rolling";
  playClashAnim(defeated, nextPlayerHp<=0 && !defeated);
}

function playClashAnim(winAll, loseAll){
  busy=true;
  const rec=reception;
  $("#qpanel")?.classList.remove("on");
  $("#hand").style.opacity=".15";
  const clash=$("#clash"); clash.classList.add("show");
  $("#die-p").innerHTML=dieSvg(PAGE_BY[rec.chosenPageId].dice[0].type, null, false);
  $("#die-g").innerHTML=dieSvg(rec.guestDie.type, null, false);
  clash.classList.remove("hit","crit");
  $("#die-p").classList.add("roll"); $("#die-g").classList.add("roll");
  SFX.dice();
  const delay=rec.crit?400:300;
  setTimeout(()=>{
    $("#die-p").innerHTML=dieSvg(PAGE_BY[rec.chosenPageId].dice[0].type, rec.playerRoll, false);
    $("#die-g").innerHTML=dieSvg(rec.guestDie.type, rec.guestRoll, rec.lastCorrect);
    SFX.clash(rec.lastCorrect);
    if(rec.crit) SFX.crit();
    clash.classList.add("hit");
    if(rec.crit){ clash.classList.add("crit"); document.body.classList.add("slowmo"); setTimeout(()=>document.body.classList.remove("slowmo"),280); }
    const {w,h}=FX.size();
    FX.burst(w/2,h*.44, rec.crit?70:40, rec.lastCorrect?"#e6d3a3":"#c45c4a");
    FX.burst(w/2,h*.44, 14, "#fff6c8");
    flash(rec.crit?.45:.22);
    shake(rec.crit?12:8);
    const lib=$("#fig-lib").getBoundingClientRect(), gst=$("#fig-gst").getBoundingClientRect();
    if(rec.dmgG){ floatDmg(gst.left+gst.width/2, gst.top+36, rec.dmgG, "hp"); $("#fig-gst").classList.add("hit"); }
    if(rec.dmgP){ floatDmg(lib.left+lib.width/2, lib.top+36, rec.dmgP, "hurt"); $("#fig-lib").classList.add("hit"); }
    if(rec.stagHit) floatDmg(gst.left+gst.width/2+30, gst.top+92, rec.stagHit, "stag");
    setBar("bar-php",(save.hp/effectiveMaxHp(save))*100);
    setBar("bar-ghp",(rec.guestHp/rec.guestMaxHp)*100);
    setBar("bar-stg",(rec.stagger/rec.staggerMax)*100);
    const lphp=$("#lab-php"); if(lphp) lphp.textContent=save.hp+"/"+effectiveMaxHp(save);
    const lghp=$("#lab-ghp"); if(lghp) lghp.textContent=rec.guestHp+"/"+rec.guestMaxHp;
    const lstg=$("#lab-stg"); if(lstg) lstg.textContent=rec.stagger+"/"+rec.staggerMax;
    if(rec.willStagger){ SFX.stagger(); $("#fig-gst").classList.add("staggered"); }
    if(!rec.lastCorrect){
      const guest=GUEST_BY[rec.guestId];
      learnToast(`<b>해설 · ${guest.concept}</b>${guest.explanation}`, 4200);
    }
    rec.staggered=!!rec.willStagger;
    rec.phase= winAll?"win": loseAll?"lose":"result";
    const after=rec.crit?300:200;
    setTimeout(()=>{
      busy=false;
      if(winAll){ SFX.win(); SFX.book(); $("#fig-gst")?.classList.add("defeated"); setTimeout(()=>showWin(), 240); }
      else if(loseAll){ SFX.lose(); showLose(); }
      else nextTurn();
    }, after);
  }, delay);
}

function nextTurn(){
  if(!reception||busy) return;
  const rec=reception;
  const breathe=rec.chosenPageId==="breathe"?1:0;
  const cap=Math.min(COMBAT.maxLightCap,COMBAT.baseLight+rec.emotion);
  rec.phase="select"; rec.chosenPageId=undefined; rec.lastFlavor=undefined;
  rec.staggered=false; rec.stagger=rec.willStagger?0:rec.stagger; rec.willStagger=false;
  rec.light=Math.min(cap, rec.light+lightRegen(save)+breathe);
  rec.maxLight=cap; rec.turn++;
  renderBattle();
}


function rollEgoGift(guest, isRecall){
  const pool=EGO_GIFTS.filter(g=>g.guestId===guest.id);
  const owned=new Set(save.egoOwned||[]);
  const unowned=pool.filter(g=>!owned.has(g.id));
  if(!unowned.length) return null;
  save.egoPity=save.egoPity||{};
  save.egoPity[guest.id]=(save.egoPity[guest.id]||0)+1;
  const rate=isRecall?EGO_GIFT_RULES.dropRateRecall:EGO_GIFT_RULES.dropRateFirstClear;
  const pity=EGO_GIFT_RULES.pityEvery && save.egoPity[guest.id]>=EGO_GIFT_RULES.pityEvery;
  if(!(Math.random()<rate || pity || (!isRecall && rate>=1))) return null;
  const item=unowned[Math.floor(Math.random()*unowned.length)];
  save.egoOwned=[...save.egoOwned, item.id];
  save.egoPity[guest.id]=0;
  save.egoEquipped=save.egoEquipped||emptyEgoEquip();
  if(!save.egoEquipped[item.slot]) save.egoEquipped[item.slot]=item.id;
  return item;
}
function finishReceptionStats(guest, won){
  const st=ensureRecall(guest.id);
  const rec=reception;
  if(rec&&rec.isRecall){ st.recalls++; if(won) st.wins++; }
  else if(won){ st.wins++; }
  const tot=rec&&rec.sessionTotal||0, ok=rec&&rec.sessionCorrect||0;
  if(tot){ st.history=[...(st.history||[]), ok/tot].slice(-5); }
  save.recallStats={...save.recallStats, [guest.id]:st};
}
function showWin(){
  const rec=reception, guest=GUEST_BY[rec.guestId];
  finishReceptionStats(guest, true);
  const gift=rollEgoGift(guest, !!rec.isRecall);
  rec.droppedGift=gift;
  persist();
  const b=$("#rbanner"); b.classList.add("on");
  const giftMsg=gift?`에고 기프트 「${gift.name}」을 손에 넣었다. (${gift.slot})`:(rec.isRecall?"이번 회상에서는 기프트가 떨어지지 않았다.":"");

    <div class="big" style="margin-top:8px">${guest.concept}</div>
    <div class="msg">${rec.isRecall?"회상을 마쳤다.":(rec.levelUpMessage||"손님이 서고의 책이 되었다. 열람하거나 소각해 새 책장을 얻을 수 있다.")}</div>
    ${giftMsg?`<div class="msg" style="margin-top:8px;color:var(--gold2)">${giftMsg}</div>`:""}
    <div style="display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap">
      <button class="btn primary" id="btn-toshelf">책장으로</button>
      <button class="btn" id="btn-nextg">다음 손님</button>
      <button class="btn" id="btn-lobby">층으로</button>
    </div>`;
  $("#btn-toshelf").onclick=()=>{ reception=null; transit("shelf",()=>renderShelf()); };
  $("#btn-nextg").onclick=()=>{
    const next=WEAK_POINTS.find(x=>!save.conqueredIds.includes(x.id));
    if(next) beginReception(next.id);
    else { reception=null; transit("lobby",()=>renderLobby()); }
  };
  $("#btn-lobby").onclick=()=>{ reception=null; transit("lobby",()=>renderLobby()); };
}

function showLose(){
  const rec=reception, guest=GUEST_BY[rec.guestId];
  finishReceptionStats(guest, false); persist();
  const b=$("#rbanner"); b.classList.add("on");
  b.innerHTML=`<div class="big">접대가 꺾였다</div>
    <div class="msg">괜찮아. 설명을 다시 읽고 책장을 바꾸면 된다. 모은 장서와 책은 그대로다.</div>
    <div class="expl">${guest.explanation}</div>
    <div style="display:flex;gap:8px;justify-content:center;margin-top:16px">
      <button class="btn primary" id="btn-retry">다시 접대</button>
      <button class="btn" id="btn-lobby">층으로</button>
    </div>`;
  $("#btn-retry").onclick=()=>{ save.hp=save.maxHp; persist(); beginReception(guest.id); };
  $("#btn-lobby").onclick=()=>{ save.hp=save.maxHp; persist(); reception=null; transit("lobby",()=>renderLobby()); };
}

/* ---------- shelf / collection ---------- */
function renderShelf(){
  const books=WEAK_POINTS.filter(g=>save.books[g.id]);
  $("#scene-shelf").innerHTML=`
    <div class="topbar">${hudStats()}</div>
    <h2 class="gold-title" style="font-size:22px;margin-bottom:8px">책장</h2>
    <p class="gmeta" style="margin-bottom:12px">접대에 성공한 손님이 책이 됩니다. 열람은 새 책장을, 소각은 핵심 책장을 엽니다.</p>
    <div class="scroll">${books.length?books.map(g=>{
      const st=save.books[g.id], rw=BOOK_REWARDS[g.id];
      const rn=rw&&PAGE_BY[rw.readPage]?.name, bn=rw&&KEY_BY[rw.burnKey]?.name;
      return `<div class="book-item frame">${cornerHtml()}${bookSvg(g.concept)}
        <div style="flex:1"><div class="gold-title" style="font-size:16px">${g.concept}</div>
        <div class="gmeta">${st==="shelved"?"보관 중":st==="read"?"열람함":"소각함"} · 열람: ${rn||"—"} · 소각: ${bn||"—"}</div>
        ${st==="shelved"?`<div style="margin-top:8px;display:flex;gap:6px">
          <button class="btn primary" data-read="${g.id}">열람</button>
          <button class="btn" data-burn="${g.id}">소각</button></div>`:
          `<div class="gmeta" style="margin-top:6px">이 책은 이미 서고의 힘이 되었습니다.</div>`}
        </div></div>`;
    }).join(""):`<div class="frame" style="padding:20px">${cornerHtml()}아직 책장이 비어 있습니다. 손님을 접대해 책을 남기세요.</div>`}</div>
    <h3 class="gold-title" style="font-size:16px;margin:16px 0 8px">핵심 책장</h3>
    <div class="scroll" style="flex:0 0 auto;grid-template-rows:auto">${KEY_PAGES.map(p=>{
      const un=save.unlockedKeyIds.includes(p.id), eq=save.equippedKeyId===p.id;
      return `<div class="key-item frame">${cornerHtml()}<div>
        <div class="gold-title" style="font-size:15px">${p.name}</div>
        <div class="gmeta">${un?p.text:"아직 열리지 않은 장서복입니다."}</div>
        ${un?`<button class="btn ${eq?"":"primary"}" style="margin-top:8px" data-key="${p.id}">${eq?"착장 중":"착장"}</button>`:`<span class="pill">미획득</span>`}
      </div></div>`;
    }).join("")}</div>
    <h3 class="gold-title" style="font-size:16px;margin:16px 0 8px">에고 기프트</h3>
    <p class="gmeta" style="margin-bottom:8px">접대와 회상으로 모은 기프트. 개별 효과는 아주 작지만, 장착한 기프트와 세트 보너스가 쌓입니다. 장서 뽑기와는 별개입니다.</p>
    <div class="bonus-sum" style="margin-bottom:10px">누적 효과 · ${bonusLabel(giftTotals(save))}</div>
    <div class="gift-grid">${EGO_GIFTS.map(g=>{
      const have=(save.egoOwned||[]).includes(g.id), eq=(save.egoEquipped||{})[g.slot]===g.id;
      const from=GUEST_BY[g.guestId]?.concept||g.guestId;
      return `<div class="gift-cell frame ${eq?"eq":""}">${cornerHtml()}
        <div class="gold-title" style="font-size:14px">${have?g.name:"????"}</div>
        <div class="gmeta">${g.slot} · ${from}${have?"":" · 미획득"}</div>
        <div class="gmeta">${have?g.text:"해당 손님을 접대하거나 회상해 얻을 수 있다."}</div>
        ${have?`<button class="btn ${eq?"":"primary"}" style="margin-top:6px" data-gift="${g.id}">${eq?"해제":"장착"}</button>`:""}
      </div>`;
    }).join("")}</div>
    ${botNav("shelf")}`;
  bindNav();
  $$("[data-read]").forEach(b=>b.onclick=()=>handleBook(b.dataset.read,"read"));
  $$("[data-burn]").forEach(b=>b.onclick=()=>handleBook(b.dataset.burn,"burn"));
  $$("[data-key]").forEach(b=>b.onclick=()=>{ save.equippedKeyId=b.dataset.key; persist(); SFX.click(); renderShelf(); });
  $$("[data-gift]").forEach(b=>b.onclick=()=>{
    const g=EGO_BY[b.dataset.gift]; if(!g) return;
    save.egoEquipped=save.egoEquipped||emptyEgoEquip();
    save.egoEquipped[g.slot] = save.egoEquipped[g.slot]===g.id ? null : g.id;
    if(save.hp>effectiveMaxHp(save)) save.hp=effectiveMaxHp(save);
    persist(); SFX.click(); renderShelf();
  });
}

function handleBook(id, action){
  const rw=BOOK_REWARDS[id]; if(!rw||save.books[id]!=="shelved") return;
  SFX.book();
  if(action==="read"){
    if(!save.unlockedPageIds.includes(rw.readPage)) save.unlockedPageIds=[...save.unlockedPageIds,rw.readPage];
    if(id==="metacognition" && !save.unlockedPageIds.includes("apex")) save.unlockedPageIds=[...save.unlockedPageIds,"apex"];
    save.books={...save.books,[id]:"read"};
    toast(`${PAGE_BY[rw.readPage]?.name||"책장"} 해금`);
  } else {
    if(!save.unlockedKeyIds.includes(rw.burnKey)) save.unlockedKeyIds=[...save.unlockedKeyIds,rw.burnKey];
    save.books={...save.books,[id]:"burned"};
    toast(`${KEY_BY[rw.burnKey]?.name||"핵심 책장"} 해금`);
  }
  persist(); renderShelf();
}

function renderCollection(){
  const held=ticketsHeld(save);
  const items=slotFilter==="전체"?COSMETIC_ITEMS:COSMETIC_ITEMS.filter(i=>i.slot===slotFilter);
  $("#scene-collection").innerHTML=`
    <div class="topbar">${hudStats()}</div>
    <h2 class="gold-title" style="font-size:22px">장서</h2>
    <p class="gmeta" style="margin:6px 0 10px">장신구는 외형 전용이며 전투 수치에 영향이 없습니다. 도감 ${save.ownedIds.length}/${COLLECTION_TOTAL} · 권 ${held}장 · SSR 천장 ${Math.max(0,GACHA_RULES.ssrPity-save.pullsSinceSsr)}회</p>
    <div class="tabs">
      ${[["gacha","뽑기"],["album","도감"],["dress","코디"]].map(([id,lb])=>`<button class="btn ${collectTab===id?"primary":""}" data-ct="${id}">${lb}</button>`).join("")}
    </div>
    <div id="col-body" style="flex:1;overflow:auto"></div>
    ${botNav("collection")}`;
  bindNav();
  $$("[data-ct]").forEach(b=>b.onclick=()=>{ collectTab=b.dataset.ct; renderCollection(); });
  const body=$("#col-body");
  if(collectTab==="gacha"){
    body.innerHTML=`
      <div class="gacha-stage frame" id="gstage">${cornerHtml()}
        <div class="pillar p-wide" id="pillar"></div>
        <div class="pillar p-mid" id="pillar2"></div>
        <div class="pillar p-core" id="pillar3"></div>
        <div class="flare" id="flare"></div>
        <div id="greveal"></div>
      </div>
      <div style="display:flex;gap:8px;justify-content:center;margin:14px 0">
        <button class="btn primary" id="pull1" ${held<1?"disabled":""}>1회 뽑기</button>
        <button class="btn" id="pull10" ${held<10?"disabled":""}>10회 뽑기</button>
      </div>
      <div class="gmeta" style="text-align:center">확률 N ${GACHA_RULES.rates.N}% · R ${GACHA_RULES.rates.R}% · SR ${GACHA_RULES.rates.SR}% · SSR ${GACHA_RULES.rates.SSR}% · 미보유 우선</div>`;
    $("#pull1").onclick=()=>pullGacha(1);
    $("#pull10").onclick=()=>pullGacha(10);
    if(reveals) paintReveal();
  } else if(collectTab==="album"){
    body.innerHTML=`<div class="tabs">${["전체",...SLOTS].map(s=>`<button class="btn ${slotFilter===s?"primary":""}" data-sf="${s}">${s}</button>`).join("")}</div>
      <div class="album">${items.map(it=>{
        const own=save.ownedIds.includes(it.id), eq=save.equipped[it.slot]===it.id;
        return `<div class="al-cell ${own?"own":""} ${eq?"eq":""}">
          ${glyphSvg(it,!own,42)}
          <div class="nm">${own?it.name:"????"}</div>
          <div class="gmeta">${it.rarity}${own?"":" · "+it.slot}</div>
          ${own?`<button class="btn" style="margin-top:6px;padding:4px 8px" data-eq="${it.id}">${eq?"해제":"착장"}</button>`:""}
        </div>`;
      }).join("")}</div>`;
    $$("[data-sf]").forEach(b=>b.onclick=()=>{ slotFilter=b.dataset.sf; renderCollection(); });
    $$("[data-eq]").forEach(b=>b.onclick=()=>equipItem(b.dataset.eq));
  } else {
    body.innerHTML=`<div style="display:grid;grid-template-columns:min(280px,40vw) 1fr;gap:16px">
      <div class="frame" style="padding:12px;text-align:center">${cornerHtml()}${librarianSvg(save,240,340)}
        <div class="pname">사서 큐 양</div><div class="gmeta">${keyPerk(save).name} · 장신구는 외형만 변경</div></div>
      <div>${SLOTS.map(slot=>{
        const eq=ITEM_BY[save.equipped[slot]||""];
        const owned=COSMETIC_ITEMS.filter(i=>i.slot===slot&&save.ownedIds.includes(i.id));
        return `<div class="frame" style="padding:10px;margin-bottom:8px">${cornerHtml()}
          <div style="display:flex;justify-content:space-between"><b style="color:var(--gold2)">${slot}</b>
          ${eq?`<button class="btn" data-off="${slot}">해제</button>`:""}</div>
          <div class="gmeta">${eq?eq.name:"기본 모습"}</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">${owned.length?owned.map(i=>`<button data-eq="${i.id}" title="${i.name}">${glyphSvg(i,false,28)}</button>`).join(""):`<span class="gmeta">아직 모은 장서가 없습니다.</span>`}</div>
        </div>`;
      }).join("")}</div></div>`;
    $$("[data-eq]").forEach(b=>b.onclick=()=>equipItem(b.dataset.eq));
    $$("[data-off]").forEach(b=>b.onclick=()=>{ save.equipped[b.dataset.off]=null; persist(); renderCollection(); });
  }
}

function equipItem(id){
  const it=ITEM_BY[id]; if(!it) return;
  save.equipped[it.slot] = save.equipped[it.slot]===id ? null : id;
  persist(); SFX.click(); renderCollection();
}

function pullGacha(times){
  if(ticketsHeld(save)<times) return;
  SFX.click();
  const results=[];
  for(let i=0;i<times;i++){
    const rarity=rollRarity(save.pullsSinceSr,save.pullsSinceSsr);
    const item=pickGachaItem(rarity,save.ownedIds);
    const isNew=!save.ownedIds.includes(item.id);
    if(isNew) save.ownedIds=[...save.ownedIds,item.id];
    if(item.rarity==="SSR"){ save.pullsSinceSr=0; save.pullsSinceSsr=0; }
    else if(item.rarity==="SR"){ save.pullsSinceSr=0; save.pullsSinceSsr++; }
    else { save.pullsSinceSr++; save.pullsSinceSsr++; }
    save.ticketsSpent++;
    results.push({item,isNew,flavor:pick(REVEAL_TEXT[item.rarity])});
  }
  persist(); reveals=results; paintReveal();
}

function paintReveal(){
  const box=$("#greveal"); if(!box||!reveals) return;
  const best=reveals.reduce((a,b)=>RARITY_ORDER.indexOf(b.item.rarity)>RARITY_ORDER.indexOf(a.item.rarity)?b:a);
  const colors={N:"#9aa3b2",R:"#6ebd96",SR:"#7aa0c4",SSR:"#e6d3a3"};
  const col=colors[best.item.rarity];
  ["pillar","pillar2","pillar3"].forEach(id=>{
    const el=$("#"+id); if(!el) return;
    el.style.color=col; el.classList.remove("on"); void el.offsetWidth; el.classList.add("on");
  });
  const fl=$("#flare"); if(fl){ fl.classList.remove("on"); void fl.offsetWidth; fl.classList.add("on"); }
  SFX.gacha(best.item.rarity);
  const {w,h}=FX.size();
  FX.burst(w/2,h*.58, best.item.rarity==="SSR"?110:best.item.rarity==="SR"?60:28, col);
  FX.burst(w/2,h*.58, 24, "#fff6c8");
  box.innerHTML=reveals.map((r,i)=>`
    <div class="gcard" id="gc${i}" style="display:${i===0?"block":"none"}">
      <div class="gface back"><div class="gold-title">개념의 서고</div><div class="gmeta" style="margin-top:8px">장서</div></div>
      <div class="gface front" style="box-shadow:0 0 28px ${colors[r.item.rarity]}">
        ${glyphSvg(r.item,false,64)}
        <div class="rar">${r.item.rarity}</div>
        <div class="gold-title" style="font-size:16px;margin-top:8px">${r.item.name}</div>
        <div class="gmeta">${r.item.slot} · ${r.isNew?"새로 등록":"중복"}</div>
        <div class="gmeta" style="margin-top:8px">${r.flavor}</div>
      </div>
    </div>`).join("") + (reveals.length>1?`<div class="gmeta" style="margin-top:10px" id="gidx">1 / ${reveals.length}</div><button class="btn" id="gnext" style="margin-top:8px">다음</button>`:"");
  let idx=0;
  const flip=()=>{ const c=$("#gc"+idx); if(c) setTimeout(()=>c.classList.add("flip"),80); };
  flip();
  const nxt=$("#gnext");
  if(nxt) nxt.onclick=()=>{
    $("#gc"+idx).style.display="none";
    idx=(idx+1)%reveals.length;
    $$(".gcard").forEach((c,i)=>c.style.display=i===idx?"block":"none");
    $("#gc"+idx).classList.remove("flip");
    if($("#gidx")) $("#gidx").textContent=`${idx+1} / ${reveals.length}`;
    SFX.gacha(reveals[idx].item.rarity); flip();
  };
}


function showGuestLineup(ids){
  const list=(ids&&ids.length?ids:WEAK_POINTS.map(g=>g.id)).slice(0,4).map(id=>GUEST_BY[id]).filter(Boolean);
  const ov=$("#lineup"); if(!ov) return;
  ov.innerHTML=list.map(g=>{
    const look=guestLook(g);
    return `<div class="lu-item fighter guest arch-${look.arch}" style="position:relative;bottom:auto;width:auto;animation-name:none;filter:none">
      ${guestSvg(g,false,240,380,false)}
      <div class="lu-name">${g.concept}</div>
      <div class="lu-sub">${ARCH_LABEL[look.arch]||look.arch}</div>
    </div>`;
  }).join("");
  ov.classList.add("on");
  $$(".scene").forEach(s=>s.style.visibility="hidden");
}
function hideGuestLineup(){
  const ov=$("#lineup"); if(ov) ov.classList.remove("on");
  $$(".scene").forEach(s=>s.style.visibility="");
}

/* ---------- boot ---------- */
function boot(){
  ensureScenes();
  FX.init();
  SFX.setMuted(!!save.muted);
  $("#mute").onclick=()=>{
    SFX.unlock();
    SFX.setMuted(!SFX.muted);
    save.muted=SFX.muted; persist();
    $("#mute").textContent=SFX.muted?"무음":"소리";
    if(!SFX.muted) SFX.ambience();
  };
  renderTitle();
  // debug for screenshots / tests
  window.__studyGame = {
    save, transit, showScene, renderLobby, renderBattle, renderCollection, renderShelf, renderTitle,
    beginReception, answer, choosePage, pullGacha, giveTickets(n){ save.ticketsSpent=Math.max(0, save.ticketsSpent-n); persist(); },
    setScene(n){ showScene(n); if(n==="lobby")renderLobby(); if(n==="battle")renderBattle(); if(n==="collection")renderCollection(); if(n==="shelf")renderShelf(); if(n==="title")renderTitle(); },
    setTab(tab){ collectTab=tab; if(scene==="collection") renderCollection(); },
    demoGacha(rarity){
      collectTab="gacha";
      const item=COSMETIC_ITEMS.find(i=>i.rarity===rarity)||COSMETIC_ITEMS[0];
      reveals=[{item,isNew:true,flavor:(REVEAL_TEXT[item.rarity]&&REVEAL_TEXT[item.rarity][0])||""}];
      showScene("collection"); renderCollection(); paintReveal();
    },
    forceTickets(n){ save.questionsAnswered = n * TICKET_RULES.questionsPerLecture; persist(); },
    get reception(){return reception;},
    playClashWin(){
      if(reception&&reception.phase==="select"){
        const p=reception.handIds.find(id=>PAGE_BY[id]&&PAGE_BY[id].cost<=reception.light&&PAGE_BY[id].emotion<=reception.emotion);
        if(p){
          choosePage(p);
          setTimeout(()=>{
            const bank=reception.quiz||GUEST_BY[reception.guestId].questions;
            const q=bank[reception.qIndex%bank.length];
            answer(q.correctIndex);
          }, 80);
        }
      }
    },
    openGuestSheet, closeGuestSheet, showGuestLineup, hideGuestLineup,
    giftTotals, bonusLabel
  };
}

document.addEventListener("DOMContentLoaded", boot);
</script></body></html>
