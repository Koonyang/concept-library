<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>개념의 서고</title>
<meta name="build" content="archetypes-sheet-burn-20261113a">
<link rel="preload" href="assets/fonts/space-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<meta name="theme-color" content="#07080d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect fill='%2307080d' width='64' height='64'/%3E%3Cpath fill='%23c4a35a' d='M18 50 V22 Q32 12 46 22 V50 L32 42 Z'/%3E%3C/svg%3E">
<style>
:root{
  --n0:#07080d;--n1:#0b0e16;--n2:#121722;--n3:#1a2130;--n4:#232b3d;
  --gold:#c4a35a;--gold2:#e6d3a3;--gold3:#8f6b2a;--gold4:#f3e6c0;
  --parch:#e8d5b0;--parch2:#cbb992;--ink:#1a140c;--blood:#c45c4a;
  --hp:#6ebd96;--stag:#e0b43a;--mute:#7aa0c4;--shadow:rgba(0,0,0,.62);
  --ui:16px;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --display:"Space Grotesk","Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --nav-h:72px;
  --safe-bottom:env(safe-area-inset-bottom, 0px);
  --panel-pad-bottom:calc(var(--nav-h) + var(--safe-bottom) + 16px);
  --audio-top:10px;
  --audio-btn:36px;
  --inspect-top:170px;
  --inspect-bottom:256px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--n0);color:var(--parch);
  font-family:var(--sans);
  user-select:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
#game{position:fixed;inset:0;overflow:hidden;background:var(--n0)}
#fx,#bg{position:absolute;inset:0;width:100%;height:100%;display:block}
#bg{z-index:0}#fx{z-index:8;pointer-events:none}
#vignette{position:absolute;inset:0;z-index:9;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,.55) 100%)}
#grain{position:absolute;inset:0;z-index:10;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.scene{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;opacity:0;pointer-events:none;
  visibility:hidden;transition:opacity .45s ease;background:transparent}
.scene.on{opacity:1;pointer-events:auto;visibility:visible}
#transition{position:absolute;inset:0;z-index:40;background:var(--n0);opacity:0;pointer-events:none;
  transition:opacity .45s ease}
#transition.go{opacity:1}
#audio-toggles{position:absolute;top:var(--audio-top);right:10px;z-index:30;display:flex;gap:6px}
@media (max-height:780px){
  :root{--inspect-top:176px;--inspect-bottom:160px}
  .ci-art{margin:0 0 6px!important}
  .ci-card.paper .ci-name{font-size:18px}
  .ci-flavor{font-size:12px;margin:6px 0 8px}
}

/* ornaments */
.gold-title{font-family:var(--display);font-weight:800;
  letter-spacing:.035em;color:var(--gold2);
  background:linear-gradient(180deg,#f8efd4 0%,#e6d3a3 38%,#c4a35a 62%,#8f6b2a 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 0 rgba(0,0,0,.85)) drop-shadow(0 0 14px rgba(236,186,104,.35))}
.filigree{display:flex;align-items:center;gap:10px;color:var(--gold);opacity:.85}
.filigree:before,.filigree:after{content:"";flex:1;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.ico{display:inline-block;vertical-align:-3px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.frame{position:relative;background:
    linear-gradient(180deg,rgba(48,40,28,.18),transparent 28%),
    linear-gradient(180deg,rgba(22,26,38,.94),rgba(9,11,18,.96));
  border:1px solid var(--gold);
  box-shadow:inset 0 0 0 1px rgba(14,12,10,.9),inset 0 0 0 2px rgba(236,186,104,.35),
    inset 0 1px 0 rgba(255,242,214,.28),0 14px 36px var(--shadow)}
.frame:before,.frame:after{content:"";position:absolute;width:16px;height:16px;pointer-events:none;z-index:2;
  border:2px solid var(--gold4);opacity:.9}
.frame:before{top:6px;left:6px;border-right:none;border-bottom:none;box-shadow:-3px -3px 0 rgba(143,107,42,.55)}
.frame:after{top:6px;right:6px;border-left:none;border-bottom:none;box-shadow:3px -3px 0 rgba(143,107,42,.55)}
.frame .cbl,.frame .cbr{position:absolute;width:16px;height:16px;border:2px solid var(--gold4);pointer-events:none;z-index:2;opacity:.9}
.frame .cbl{bottom:6px;left:6px;border-right:none;border-top:none;box-shadow:-3px 3px 0 rgba(143,107,42,.55)}
.frame .cbr{bottom:6px;right:6px;border-left:none;border-top:none;box-shadow:3px 3px 0 rgba(143,107,42,.55)}
.btn{position:relative;overflow:hidden;padding:12px 28px;border:1px solid var(--gold);color:var(--gold4);
  letter-spacing:.029em;
  background:linear-gradient(180deg,rgba(236,186,104,.28),rgba(18,14,10,.55) 48%,rgba(7,8,13,.7));
  text-shadow:0 1px 0 rgba(0,0,0,.6),0 0 10px rgba(236,186,104,.35);
  box-shadow:inset 0 1px 0 rgba(255,242,214,.4),inset 0 -1px 0 rgba(0,0,0,.45),0 6px 16px rgba(0,0,0,.4);
  transition:transform .18s ease,box-shadow .18s ease,filter .18s ease}
.btn:after{content:"";position:absolute;top:-30%;bottom:-30%;left:0;width:40%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.38),transparent);
  transform:translateX(-180%) skewX(-22deg);pointer-events:none}
.btn:hover{filter:brightness(1.12);box-shadow:inset 0 1px 0 rgba(255,242,214,.55),0 0 20px rgba(236,186,104,.4);
  transform:translateY(-2px)}
.btn:hover:after{animation:btnshine .7s ease}
.btn:active{transform:translateY(1px) scale(.98);filter:brightness(.96)}
.btn.primary{background:linear-gradient(180deg,#e6d3a3 0%,#c4a35a 38%,#8f6b2a 70%,#5c4316 100%);
  color:#1a140c;text-shadow:0 1px 0 rgba(255,242,214,.45);border-color:#f3e6c0}
.btn[disabled]{opacity:.4;pointer-events:none;filter:none}
@keyframes btnshine{from{transform:translateX(-180%) skewX(-22deg)}to{transform:translateX(280%) skewX(-22deg)}}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;
  border:1px solid var(--gold3);color:var(--gold2);font-size:11px;letter-spacing:.013em;
  background:linear-gradient(180deg,rgba(236,186,104,.12),rgba(0,0,0,.25));
  box-shadow:inset 0 1px 0 rgba(255,242,214,.15)}

/* title */
#scene-title{align-items:center;justify-content:center;text-align:center;
  padding:28px 20px calc(28px + var(--safe-bottom));overflow:auto;-webkit-overflow-scrolling:touch}
#scene-title .emblem{width:88px;height:88px;margin-bottom:18px;filter:drop-shadow(0 0 16px rgba(236,186,104,.4));
  animation:floaty 4.5s ease-in-out infinite}
#scene-title h1{font-size:clamp(36px,6vw,72px);margin:8px 0 6px}
#scene-title .sub{color:var(--parch2);letter-spacing:.045em;font-size:12px;margin-bottom:8px}
#scene-title .tag{color:var(--gold2);font-size:13px;letter-spacing:.026em;margin:14px 0 28px;opacity:.85;text-shadow:0 0 12px rgba(0,0,0,.8)}
#scene-title .enter{font-size:15px;padding:14px 48px}
.candles{position:absolute;bottom:8%;width:70px;height:160px;pointer-events:none;z-index:3}
.candles.l{left:6%}.candles.r{right:6%}
.flame{position:absolute;bottom:92px;left:50%;width:14px;height:24px;margin-left:-7px;border-radius:50% 50% 50% 50%;
  background:radial-gradient(circle at 50% 30%,#fff6c8,#ffb347 40%,transparent 70%);
  animation:flicker .18s infinite alternate;filter:blur(.3px)}
.glow{position:absolute;bottom:60px;left:50%;width:140px;height:140px;margin-left:-70px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,180,70,.5),rgba(255,160,40,.12) 45%,transparent 70%);animation:glow 1.6s ease-in-out infinite}

/* lobby */
#scene-lobby,.panel-scene{padding:8px 24px 0;
  display:flex;flex-direction:column;min-height:0;overflow:hidden;
  background:linear-gradient(180deg,rgba(7,8,13,.55) 0%,rgba(7,8,13,.78) 40%,rgba(7,8,13,.88) 100%)}
#scene-lobby{padding-bottom:var(--panel-pad-bottom)}
.page-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding-bottom:var(--panel-pad-bottom)}
.sec-head{font-size:16px;margin:20px 0 10px;flex:0 0 auto}
.empty-state{padding:28px 22px;text-align:center;min-height:132px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.empty-state .gmeta{max-width:28em;margin:0 auto;line-height:1.6}
.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.dress-grid{display:grid;grid-template-columns:min(280px,40vw) 1fr;gap:16px}
.topbar{position:relative;top:auto;left:auto;right:auto;display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap;
  z-index:5;flex:0 0 auto;width:100%;padding:2px 100px 8px 0;
  min-height:calc(var(--audio-top) + var(--audio-btn))}
.topbar .brand{letter-spacing:.032em;color:var(--gold);font-size:13px;margin-right:8px}
.hudstat{font-size:12px;color:var(--parch2);letter-spacing:.006em;display:inline-flex;align-items:center;gap:4px}
.hudstat .ico,.topbar .ico{width:13px;height:13px}
.ico.filled{stroke:none}
.lobby-grid{flex:1;display:grid;grid-template-columns:220px 1fr 280px;gap:18px;min-height:0;height:auto}
.col{display:flex;flex-direction:column;gap:12px;min-height:0}
.portrait-box{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:stretch;padding:16px 14px;min-height:0}
.portrait-box,.portrait-frame{min-height:0;height:100%}
.portrait-frame{position:relative;width:100%;flex:1 1 auto;display:flex;align-items:stretch;justify-content:center}
.pf-ring{position:relative;width:100%;flex:1;height:100%;display:flex;align-items:flex-end;min-height:0;
  background:radial-gradient(ellipse at 50% 16%,rgba(236,186,104,.18),#0b0e16 62%);
  box-shadow:inset 0 0 0 2px var(--gold),inset 0 0 0 6px #0c0a08,inset 0 0 0 7px rgba(236,186,104,.45),
    0 0 28px rgba(236,186,104,.18);
  clip-path:polygon(10% 0,90% 0,100% 8%,100% 92%,90% 100%,10% 100%,0 92%,0 8%);
  overflow:hidden;padding:8px 6px 0}
.portrait-box svg{width:100%;height:auto;max-height:100%;filter:drop-shadow(0 10px 16px rgba(0,0,0,.55));display:block}
.pf-plate{margin-top:10px;padding:6px 16px 8px;text-align:center;width:100%;
  background:linear-gradient(180deg,rgba(236,186,104,.16),rgba(7,8,13,.5));
  border-top:1px solid rgba(236,186,104,.35);border-bottom:1px solid rgba(236,186,104,.2)}
.pname{margin-top:0;letter-spacing:.029em;font-size:13px}
.floors{display:flex;gap:8px;flex-wrap:wrap}
.floor-btn{padding:8px 16px;border:1px solid var(--gold3);color:var(--parch2);letter-spacing:.019em;font-size:13px;
  background:linear-gradient(180deg,rgba(236,186,104,.1),rgba(7,8,13,.45));
  box-shadow:inset 0 1px 0 rgba(255,242,214,.12);transition:transform .18s,box-shadow .18s,border-color .18s,color .18s}
.floor-btn:hover{color:var(--gold2);border-color:var(--gold);transform:translateY(-1px)}
.floor-btn.on{border-color:var(--gold4);color:var(--gold4);
  background:linear-gradient(180deg,rgba(236,186,104,.32),rgba(18,14,10,.55));
  box-shadow:0 0 16px rgba(236,186,104,.35),inset 0 1px 0 rgba(255,242,214,.4)}
.floor-hero{position:relative;height:168px;overflow:hidden;flex:0 0 auto}
.floor-hero .cap{position:absolute;left:0;top:0;bottom:0;right:38%;z-index:1;
  display:flex;flex-direction:column;justify-content:center;
  padding:16px 22px 16px 20px;
  background:linear-gradient(90deg,rgba(7,8,13,.92) 0%,rgba(7,8,13,.72) 62%,rgba(7,8,13,0) 100%)}
.floor-hero h2{letter-spacing:.032em;font-size:22px;margin-bottom:4px}
.guests{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding-right:4px}
.guest-card{display:flex;gap:14px;padding:10px 14px 10px 10px;cursor:pointer;text-align:left;width:100%;
  align-items:center;transition:border-color .22s,box-shadow .22s,transform .22s,background .22s}
.guest-card:hover,.guest-card.on{border-color:var(--gold4);box-shadow:0 0 20px rgba(236,186,104,.28),inset 0 0 24px rgba(236,186,104,.06);
  transform:translateX(4px) translateY(-1px);background:linear-gradient(90deg,rgba(236,186,104,.1),rgba(11,14,22,.92))}
.guest-card .bust{flex:0 0 auto;width:92px;height:114px;padding:4px;
  background:radial-gradient(ellipse at 50% 20%,rgba(236,186,104,.16),#0b0e16 70%);
  box-shadow:inset 0 0 0 1px var(--gold),inset 0 0 0 3px rgba(14,12,10,.9),inset 0 0 0 4px rgba(236,186,104,.35);
  overflow:hidden}
.guest-card svg{width:100%;height:100%;display:block;object-fit:contain}
.guest-card .ginfo{flex:1;min-width:0}
.guest-card .chev{color:var(--gold);opacity:.5;font-size:18px;padding-right:4px}
.gmeta{font-size:11px;color:var(--parch2);margin:4px 0}
.detail{display:none}
.detail h3{letter-spacing:.019em;color:var(--gold2);font-size:20px}
.detail p{font-size:13px;line-height:1.7;color:var(--parch);opacity:.9}
.botnav{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:22;
  padding:12px 12px calc(12px + var(--safe-bottom));
  background:linear-gradient(180deg,transparent 0%,rgba(7,8,13,.88) 36%,rgba(7,8,13,.96) 100%);
  transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .3s ease;pointer-events:none}
.botnav .btn{pointer-events:auto}
.botnav.away{transform:translateY(130%);opacity:0;pointer-events:none}
.sheet-backdrop{position:absolute;inset:0;z-index:16;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s ease}
.sheet-backdrop.on{opacity:1;pointer-events:auto}
.guest-sheet{position:absolute;left:0;right:0;bottom:0;z-index:18;max-height:78%;overflow:auto;
  transform:translateY(110%);transition:transform .42s cubic-bezier(.2,.8,.2,1);
  padding:0 16px calc(24px + var(--safe-bottom));
  background:linear-gradient(180deg,rgba(48,40,28,.2),transparent 18%),linear-gradient(180deg,rgba(22,26,38,.98),rgba(7,8,13,.98));
  border-top:1px solid var(--gold4);
  box-shadow:inset 0 1px 0 rgba(255,242,214,.25),0 -18px 40px rgba(0,0,0,.55);-webkit-overflow-scrolling:touch}
.guest-sheet.on{transform:translateY(0)}
.sheet-handle{width:48px;height:4px;border-radius:2px;background:var(--gold3);margin:4px auto 10px}
.sheet-top{display:flex;gap:14px;align-items:flex-start}
.sheet-top svg{width:110px;height:150px;flex:0 0 auto;filter:drop-shadow(0 8px 12px rgba(0,0,0,.5))}
.sheet-actions{display:flex;gap:8px;margin-top:14px}
.sheet-actions .btn.primary{flex:1;padding:16px 18px;font-size:16px;letter-spacing:.026em}
.bonus-sum{padding:14px 22px;border:1px solid var(--gold3);background:rgba(0,0,0,.28);color:var(--gold2);font-size:12px;letter-spacing:.006em;line-height:1.6}
.gift-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.gift-cell{padding:16px 22px;display:flex;flex-direction:column;gap:4px}
.gift-cell .on{border-color:var(--gold)}
@media (min-width:861px){
  .guest-sheet{left:auto;right:20px;bottom:24px;top:auto;width:min(460px,40vw);max-height:calc(100% - 110px);
    transform:translateX(120%);border:1px solid var(--gold3);border-top:1px solid var(--gold)}
  .guest-sheet.on{transform:translateX(0)}
  .sheet-handle{display:none}
}

/* battle */
#scene-battle{background:transparent}
.battle-stage{position:absolute;inset:0;display:flex;flex-direction:column}
.arena{flex:1;position:relative;overflow:hidden}
.arena-bg{position:absolute;inset:0;width:100%;height:100%}
.arena:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  background:
    radial-gradient(ellipse at 22% 62%,rgba(245,219,170,.11),transparent 34%),
    radial-gradient(ellipse at 78% 62%,rgba(170,160,210,.08),transparent 34%),
    radial-gradient(ellipse at 50% 100%,transparent 20%,rgba(0,0,0,.5) 78%),
    linear-gradient(180deg,rgba(0,0,0,.5) 0%,rgba(0,0,0,.18) 28%,rgba(0,0,0,.12) 58%,rgba(0,0,0,.55) 100%)}
.fighter{position:absolute;top:var(--inspect-top,170px);bottom:calc(var(--inspect-bottom,256px) - 6px);
  width:min(28vw,340px);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  transform-origin:50% 100%;animation:charBreath 4s ease-in-out infinite;z-index:3;pointer-events:none}
.fighter.librarian{left:4%}
.fighter.guest{right:4%;animation-delay:-1.55s}
.fighter .char{flex:1 1 auto;min-height:0;width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;position:relative;z-index:1}
.fighter .char svg{height:100%;width:auto;max-width:100%;display:block;overflow:visible}
.fighter.librarian .char svg{filter:drop-shadow(4px 0 6px rgba(245,219,170,.42)) drop-shadow(-6px 10px 10px rgba(0,0,0,.55))}
.fighter.guest .char svg{filter:drop-shadow(-4px 0 6px rgba(190,180,230,.35)) drop-shadow(6px 10px 10px rgba(0,0,0,.55))}
.fighter:after{content:"";position:absolute;left:50%;bottom:26px;width:64%;height:32px;transform:translateX(-50%);
  background:radial-gradient(ellipse,rgba(0,0,0,.7) 0%,rgba(245,219,170,.16) 46%,transparent 72%);pointer-events:none;z-index:0}
.char-plate{flex:0 0 auto;position:relative;z-index:2;margin-top:2px;padding:4px 12px 5px;min-width:68%;max-width:100%;
  text-align:center;font-size:11px;letter-spacing:.022em;color:var(--gold2);
  background:linear-gradient(180deg,#2a2214,#120e0a);border:1px solid var(--gold3);
  box-shadow:0 4px 10px rgba(0,0,0,.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.char-book{position:absolute;left:50%;bottom:18%;transform:translateX(-50%) scale(.86);opacity:0;pointer-events:none;z-index:4;
  filter:drop-shadow(0 8px 16px rgba(0,0,0,.6)) drop-shadow(0 0 12px rgba(236,186,104,.4))}
.char-book svg{width:88px;height:110px}
.fighter .char:after{content:"";position:absolute;inset:10% 14% 8%;opacity:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,244,220,.7),rgba(220,60,40,.35));mix-blend-mode:screen}
.fighter.hit .char:after{animation:hitFlash .32s ease}
.fighter.librarian.hit{animation:charHitL .32s ease}
.fighter.guest.hit{animation:charHitR .32s ease}
.fighter.staggered{animation:charStagger 1.15s ease-in-out infinite}
.fighter.staggered .char svg{filter:grayscale(.2) brightness(1.12) drop-shadow(0 0 14px rgba(224,180,58,.75))}
.fighter.defeated{animation:none}
.fighter.defeated .char,.fighter.defeated .char-plate{animation:fadeToBook .7s ease forwards}
.fighter.defeated .char-book{animation:bookIn .7s ease forwards}
.clash-zone{position:absolute;left:50%;top:calc(var(--inspect-top,170px) + (100% - var(--inspect-top,170px) - var(--inspect-bottom,256px)) * .45);
  transform:translate(-50%,-50%);width:min(26vw,200px);height:min(26vw,200px);z-index:4;pointer-events:none}
.clash-ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(236,186,104,.32);
  box-shadow:0 0 28px rgba(236,186,104,.16),inset 0 0 36px rgba(0,0,0,.35)}
.clash-glow{position:absolute;left:12%;right:12%;bottom:10%;height:26%;
  background:radial-gradient(ellipse,rgba(236,186,104,.28),transparent 70%)}
@keyframes idleKnight{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes idleScholar{0%,100%{transform:translateY(0) rotate(-.4deg)}50%{transform:translateY(-7px) rotate(.5deg)}}
@keyframes idleBeast{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-5px) scale(1.03,.97)}}
@keyframes idlePuppet{0%,100%{transform:rotate(-1.4deg) translateY(0)}40%{transform:rotate(1.8deg) translateY(-4px)}75%{transform:rotate(-.6deg) translateY(-1px)}}
@keyframes idleFixer{0%,100%{transform:translateY(0) translateX(0)}50%{transform:translateY(-5px) translateX(1px)}}
@keyframes idleMage{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}
@keyframes guestHit{0%{transform:translateX(0)}35%{transform:translateX(16px) rotate(3deg)}100%{transform:translateX(0)}}
@keyframes guestDown{to{transform:translateY(36px) rotate(10deg);opacity:.25}}
.hud-top{position:absolute;top:10px;left:16px;right:100px;display:grid;grid-template-columns:1fr auto 1fr;gap:16px;z-index:5;align-items:start}
.bars{padding:12px 14px 12px}
.bar-lab{display:flex;justify-content:space-between;font-size:11px;color:var(--parch2);letter-spacing:.013em;margin-bottom:5px}
.bar{height:14px;background:linear-gradient(180deg,#05060a,#12141c);border:1px solid var(--gold3);
  overflow:hidden;position:relative;box-shadow:inset 0 1px 2px rgba(0,0,0,.7)}
.bar .ghost,.bar .fill{position:absolute;left:0;top:0;bottom:0;width:0;display:block}
.bar .ghost{background:rgba(255,242,214,.55);transition:width .85s .12s ease-out}
.bar .fill{box-shadow:0 0 10px currentColor;transition:width .28s ease-out}
.bar.hp .fill{background:linear-gradient(180deg,#d5ffe8 0%,#6ebd96 42%,#2d6b52 100%)}
.bar.stag .fill{background:linear-gradient(180deg,#fff3b0 0%,#e0b43a 45%,#8a6a10 100%)}
.bar .segs{position:absolute;inset:0;pointer-events:none;z-index:2;
  background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(0,0,0,.55) 9px 10px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15),inset 0 -1px 0 rgba(0,0,0,.4)}
.orbs,.pips{display:flex;gap:6px;align-items:center;margin-top:7px;font-size:11px;color:var(--parch2);letter-spacing:.013em}
.orb{width:12px;height:12px;border-radius:50%;border:1px solid var(--gold);background:#222;box-shadow:none;transition:.3s}
.orb.on{background:radial-gradient(circle at 35% 35%,#fff6c8,var(--gold));box-shadow:0 0 8px var(--gold)}
.pip{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:11px solid #333}
.pip.on{border-bottom-color:var(--gold);filter:drop-shadow(0 0 4px var(--gold))}
.turnchip{align-self:center;color:var(--gold2);letter-spacing:.032em;font-size:12px;text-align:center}
.clash{position:absolute;left:50%;top:calc(var(--inspect-top,170px) + (100% - var(--inspect-top,170px) - var(--inspect-bottom,256px)) * .45);
  transform:translate(-50%,-50%);display:flex;align-items:center;gap:28px;
  z-index:6;opacity:0;pointer-events:none;filter:drop-shadow(0 0 18px rgba(236,186,104,.45))}
.clash.show{opacity:1}
.clash .vs{font-family:var(--display);font-weight:700;letter-spacing:.016em;color:var(--gold4);font-size:28px;text-shadow:0 0 22px rgba(236,186,104,.9);z-index:2}
.die{width:110px;height:110px;transform-style:preserve-3d;position:relative;z-index:2}
.die svg{width:110px;height:110px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.6))}
.die.roll{animation:dieroll .36s ease-in}
.impact-ring,.slash{position:absolute;left:50%;top:50%;pointer-events:none;opacity:0;z-index:1}
.impact-ring{width:24px;height:24px;border:2px solid #f3e6c0;border-radius:50%;transform:translate(-50%,-50%)}
.slash{width:420px;height:5px;background:linear-gradient(90deg,transparent,#fff, #f3e6c0,transparent);
  box-shadow:0 0 18px #fff,0 0 28px #e6d3a3;transform:translate(-50%,-50%) rotate(-28deg) scaleX(0)}
.slash.s2{transform:translate(-50%,-50%) rotate(18deg) scaleX(0);width:300px;height:4px}
.clash.hit .impact-ring{animation:ring .5s ease-out}
.clash.hit .slash.s1{animation:slash .28s ease-out}
.clash.hit .slash.s2{animation:slash2 .32s ease-out .04s}
.clash.crit .vs{animation:critpulse .5s ease}
@keyframes ring{0%{width:20px;height:20px;opacity:1}100%{width:360px;height:360px;opacity:0}}
@keyframes slash{0%{transform:translate(-50%,-50%) rotate(-28deg) scaleX(0);opacity:0}
  20%{opacity:1;transform:translate(-50%,-50%) rotate(-28deg) scaleX(1)}
  100%{opacity:0;transform:translate(-50%,-50%) rotate(-28deg) scaleX(1.2)}}
@keyframes slash2{0%{transform:translate(-50%,-50%) rotate(18deg) scaleX(0);opacity:0}
  22%{opacity:1;transform:translate(-50%,-50%) rotate(18deg) scaleX(1)}
  100%{opacity:0;transform:translate(-50%,-50%) rotate(18deg) scaleX(1.15)}}
@keyframes critpulse{0%,100%{transform:scale(1)}40%{transform:scale(1.35);color:#fff;text-shadow:0 0 28px #fff}}
body.slowmo #shake{animation:slo .55s ease}
@keyframes slo{0%{transform:scale(1.045)}100%{transform:none}}
.hand{position:absolute;bottom:10px;left:0;right:0;height:240px;display:flex;justify-content:center;align-items:flex-end;z-index:7;
  pointer-events:none}
.hand .cc{pointer-events:auto;position:relative;width:148px;height:210px;margin:0 -18px;transform-origin:50% 100%;
  transition:transform .25s ease,z-index 0s;cursor:pointer}
.hand .cc:hover{transform:translateY(-28px) rotate(0deg) scale(1.06)!important;z-index:9!important}
.hand .cc.off{opacity:.38;pointer-events:auto;filter:grayscale(.4)}
.hand .cc,.hand .card{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent}

/* combat page inspect (press-and-hold) */
.card-inspect{position:absolute;inset:0;z-index:28;display:flex;align-items:center;justify-content:center;
  padding:var(--inspect-top,180px) 12px var(--inspect-bottom,176px);
  background:radial-gradient(ellipse at 50% 42%,rgba(24,18,10,.25),rgba(0,0,0,.76) 72%);
  opacity:0;visibility:hidden;pointer-events:none;transition:opacity .16s ease,visibility .16s ease}
.card-inspect.on{opacity:1;visibility:visible}
.ci-card{width:min(340px,92vw);max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;
  position:relative;padding:22px 20px 18px;color:var(--parch)}
.ci-art{display:flex;justify-content:center;margin:6px 0 12px;filter:drop-shadow(0 8px 16px rgba(0,0,0,.55))}
.ci-name{font-size:22px;text-align:center;letter-spacing:.026em;margin:2px 0 12px;line-height:1.35}
.ci-meta{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.ci-dies{display:flex;flex-direction:column;gap:8px;margin:4px 0 12px}
.ci-die{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--gold3);
  background:rgba(0,0,0,.32);font-size:13px;letter-spacing:.010em}
.ci-die .range{margin-left:auto;color:var(--gold2);font-variant-numeric:tabular-nums}
.ci-die .mod{color:var(--hp);font-size:11px;margin-left:8px}
.ci-text{font-size:14px;line-height:1.75;color:var(--parch);margin:4px 0 12px}
.ci-sec{margin-top:8px;padding-top:10px;border-top:1px solid rgba(236,186,104,.28)}
.ci-sec .lab{color:var(--gold2);font-size:11px;letter-spacing:.026em;margin-bottom:6px}
.ci-sec .gmeta{line-height:1.65}
.ci-hint{text-align:center;color:var(--parch2);font-size:10px;letter-spacing:.022em;margin-top:12px;opacity:.7}

/* audio icon toggles */
#audio-toggles{position:absolute;top:var(--audio-top,10px);right:10px;z-index:30;display:flex;gap:6px}
.icon-btn{width:var(--audio-btn,36px);height:var(--audio-btn,36px);padding:0;display:inline-flex;align-items:center;justify-content:center;
  letter-spacing:0;min-width:0}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.off{opacity:.62;filter:saturate(.7)}
.icon-btn:hover{transform:translateY(-1px)}
.bust-art{position:relative;display:block;width:100%;height:auto;line-height:0;overflow:hidden}
.bust-art img.bust-photo{width:100%;height:auto;aspect-ratio:3/4;object-fit:cover;object-position:center 12%;display:block;filter:saturate(.92) contrast(1.06)}
.bust-art.crop{height:100%}
.guest-card .bust-art,.sheet-top .bust-art,.portrait-frame .bust-art,.portrait-box .bust-art,.pf-ring .bust-art{width:100%;height:100%}
.guest-card .bust-art img.bust-photo,.sheet-top .bust-art img.bust-photo,.portrait-frame .bust-art img.bust-photo,.portrait-box .bust-art img.bust-photo,.pf-ring .bust-art img.bust-photo,.bust-art.crop img.bust-photo{height:100%;aspect-ratio:auto}
.bust-accs{position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:nowrap;justify-content:center;align-items:center;gap:3px;padding:4px 4px 5px;z-index:2;pointer-events:none;max-height:26px;overflow:hidden;
  background:linear-gradient(180deg,transparent,rgba(8,6,4,.62) 70%)}
.portrait-frame .bust-accs,.portrait-box .bust-accs,.pf-ring .bust-accs{position:relative;bottom:auto;max-height:none;flex-wrap:wrap;background:transparent;padding:8px 4px 0;overflow:visible}
.bust-accs .acc{position:static;width:18px;height:18px;transform:none;filter:invert(78%) sepia(28%) saturate(650%) hue-rotate(6deg) brightness(.95) drop-shadow(0 1px 1px #000)}
.guest-card .bust-accs{padding:2px;gap:2px;background:linear-gradient(180deg,transparent,rgba(8,6,4,.55))}
.guest-card .bust-accs .acc{width:12px;height:12px}
.fighter .bust-accs .acc{width:16px;height:16px}
.guest-card .bust-art{width:100%;height:100%;flex:0 0 auto}
.sheet-top .bust-art{width:110px;height:150px;flex:0 0 auto;max-width:100%}
.fighter .bust-art{width:100%;height:auto;max-height:100%;filter:drop-shadow(0 16px 18px rgba(0,0,0,.55))}
.fighter .bust-art img.bust-photo{height:auto;aspect-ratio:3/4;max-height:100%;object-fit:cover}
.portrait-frame .bust-art,.portrait-box .bust-art{width:100%;height:100%;min-height:160px}
.fighter .stag-tag{position:absolute;top:4%;left:50%;transform:translateX(-50%);color:var(--stag);letter-spacing:.032em;font-size:12px;z-index:3;text-shadow:0 1px 4px #000}
.credits-scroll{padding:calc(var(--audio-top) + var(--audio-btn) + 16px) 100px 32px 18px}
.credits-list{font-size:13px;line-height:1.7;color:var(--parch);display:grid;gap:14px}
.credits-list a{color:var(--gold2)}
.credits-list b{color:var(--gold2);display:block;margin-bottom:2px}
.ornate-ui{border-image-source:url("assets/ui/gold-db16.png");border-image-slice:48 fill;border-image-width:14px;border-image-repeat:stretch}

/* ---- paper combat pages (not metal) ---- */
.card.paper,.ci-card.paper,.dpage.paper{
  background-image:
    radial-gradient(ellipse at 16% 10%,rgba(120,70,25,.08),transparent 42%),
    radial-gradient(ellipse at 84% 90%,rgba(90,45,15,.1),transparent 44%),
    linear-gradient(180deg,rgba(244,232,204,.72),rgba(220,196,154,.62)),
    url("assets/textures/parchment.webp");
  background-size:auto,auto,auto,cover;background-position:center;
  color:#2a1c10;
  border:1px solid #7a5a32;
  border-radius:2px 4px 3px 5px;
  box-shadow:
    inset 0 1px 0 rgba(255,248,230,.45),
    inset 0 -14px 18px rgba(80,40,10,.06),
    1px 3px 8px rgba(0,0,0,.38);
  overflow:hidden;
  -webkit-background-clip:padding-box;background-clip:padding-box;
}
.card.paper:before,.ci-card.paper:before{
  content:"";position:absolute;inset:6px;border:1px solid rgba(60,35,15,.28);
  pointer-events:none;z-index:2;box-shadow:none;background:none}
.card.paper:after,.ci-card.paper:after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:5;
  box-shadow:inset 0 0 0 1px rgba(50,30,10,.22);
  background:
    radial-gradient(circle at 0 0,rgba(70,35,10,.26),transparent 28px),
    radial-gradient(circle at 100% 0,rgba(60,30,8,.2),transparent 24px),
    radial-gradient(circle at 0 100%,rgba(80,40,10,.22),transparent 26px),
    radial-gradient(circle at 100% 100%,rgba(50,25,8,.26),transparent 30px);
  mix-blend-mode:multiply}
.paper-fiber{position:absolute;inset:0;pointer-events:none;z-index:1;opacity:.28;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.paper-stain{position:absolute;inset:0;pointer-events:none;z-index:1;mix-blend-mode:multiply;
  background:
    radial-gradient(ellipse at 22% 72%,rgba(140,70,20,.13),transparent 30%),
    radial-gradient(ellipse at 78% 16%,rgba(90,50,20,.1),transparent 24%)}
.card.paper .nm,.ci-card.paper .ci-name,.dpage.paper .nm{
  background:none;-webkit-text-fill-color:#1a120a;color:#1a120a;filter:none;
  font-family:var(--sans);font-weight:800;letter-spacing:-.02em}
.card.paper .tx,.ci-card.paper .ci-text{color:#3a2a18}
.card.paper .dice,.card.paper .emo{color:#4a3218;text-shadow:none}
.card.paper .illu{filter:none;color:#2a1a0c}
.card.paper .illu .ico,.ci-card.paper .ico{stroke:#2a1a0c;color:#2a1a0c}
.card.paper .gem{
  clip-path:none;width:22px;height:22px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#f4e4c4,#e2c48a);
  border:1.5px solid #3a2410;color:#2a1a0c;letter-spacing:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 1px 2px rgba(0,0,0,.2);
  text-shadow:none;font-family:var(--display);font-weight:700}
.card .wax,.dpage .wax,.ci-card .wax{
  position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:7px;font-weight:700;letter-spacing:.006em;z-index:4;color:#f3e6c0;
  box-shadow:0 1px 2px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.22)}
.wax.rar-N{background:radial-gradient(circle at 35% 30%,#9a9a9a,#4a4a4a)}
.wax.rar-R{background:radial-gradient(circle at 35% 30%,#7aaf86,#2d5a3a)}
.wax.rar-SR{background:radial-gradient(circle at 35% 30%,#7a92c0,#2a3a68)}
.wax.rar-SSR{background:radial-gradient(circle at 35% 30%,#d07060,#7a2018);color:#f8e6c0}
.card .flavor,.ci-flavor,.dpage .flavor{
  font-style:italic;color:#5a3e22;font-size:10px;line-height:1.45;
  letter-spacing:.003em;z-index:3;position:relative}
.card .flavor{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  margin-top:auto;padding-top:4px;border-top:1px solid rgba(60,35,15,.2)}
.ci-flavor{margin:8px 0 12px;font-size:13px;line-height:1.7;color:#4a3218}
.hand .cc:hover{transform:translateY(-22px) rotate(0deg) scale(1.04)!important;z-index:9!important}
.hand .cc:hover .card.paper{
  box-shadow:0 0 0 1px rgba(232,180,80,.75),0 0 16px rgba(255,176,70,.32),1px 10px 20px rgba(0,0,0,.42)}
.hand .cc.off{opacity:.55;filter:grayscale(.15)}

/* deck editor */
.deck-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.deck-presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 12px}
.deck-slots{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:12px}
.deck-slot{padding:0;cursor:pointer;position:relative;aspect-ratio:3/4.2;border:none;background:none;display:block;text-align:left}
.deck-slot .card{width:100%;height:100%}
.deck-slot.empty{opacity:.75;display:flex;align-items:center;justify-content:center;color:#6a5030;font-size:11px;letter-spacing:.016em;
  border:1px dashed rgba(236,186,104,.4);background:rgba(30,22,14,.35);aspect-ratio:3/4.2}
.deck-slot .nm{font-size:11px;line-height:1.3}
#deck-pool.item-grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.dpage{display:block;padding:0;cursor:pointer;position:relative;text-align:left;border:none;background:none;aspect-ratio:3/4.2}
.dpage .card{width:100%;height:100%}
.dpage.in .card,.deck-slot:not(.empty) .card{
  box-shadow:0 0 0 2px #e6d3a3,0 0 16px rgba(236,186,104,.4),1px 3px 8px rgba(0,0,0,.38);
  transform:translateY(-2px)}
/* shelf tabs + dress-up (장서복 / 에고 기프트) */
.shelf-tabs{display:flex;gap:6px;margin:0 0 12px;padding:4px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.shelf-tab{flex:1;min-width:0;padding:10px 6px;border:0;border-radius:10px;background:none;color:var(--parch2,#b9b2a0);font:700 13px/1.1 inherit;font-family:inherit;cursor:pointer;white-space:nowrap}
.shelf-tab.on{background:rgba(var(--accent-rgb),.16);color:#fff;box-shadow:inset 0 0 0 1px rgba(var(--accent-rgb),.45)}
.dress{max-width:560px;margin:0 auto}
.dress-top{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:10px;align-items:start}
.dress-char{position:relative;padding:10px 8px 8px;border-radius:var(--r-lg);background:radial-gradient(120% 80% at 50% 30%,rgba(var(--accent-rgb),.12),transparent 70%),rgba(8,10,18,.55);overflow:hidden;transition:box-shadow .2s,transform .2s}
.dress-char.can-drop{box-shadow:0 0 0 2px rgba(255,255,255,.22)}
.dress-char.drop-on{box-shadow:0 0 0 2px var(--accent,#e9c46a),0 0 28px rgba(var(--accent-rgb),.5);transform:scale(1.015)}
.dc-stage{position:relative;width:100%;aspect-ratio:280/440}
.dc-stage svg{display:block;width:100%;height:100%}
.dc-new,.dc-old{position:absolute;inset:0}
.dc-old{animation:dcOut .5s ease forwards;pointer-events:none}
.dc-new.morph{animation:dcIn .6s cubic-bezier(.2,.8,.2,1)}
.dc-flash{position:absolute;inset:-10%;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(255,240,200,.85),rgba(255,240,200,0) 60%);opacity:0;animation:dcFlash .6s ease-out}
@keyframes dcOut{0%{opacity:1;filter:none}100%{opacity:0;filter:blur(6px) brightness(1.6)}}
@keyframes dcIn{0%{opacity:0;filter:blur(8px) brightness(2);transform:scale(.96)}60%{opacity:1}100%{opacity:1;filter:none;transform:none}}
@keyframes dcFlash{0%{opacity:.9;transform:scale(.7)}100%{opacity:0;transform:scale(1.25)}}
.dress-char .gs{filter:drop-shadow(0 0 3px rgba(255,224,138,.9))}
.dress-char .gs.fresh{animation:gsPop .7s cubic-bezier(.2,.9,.3,1.4);transform-box:fill-box;transform-origin:center}
.dress-char .gs.fresh.swap{animation:gsSwap .8s cubic-bezier(.2,.9,.3,1.2)}
@keyframes gsPop{0%{opacity:0;transform:scale(2.4)}60%{opacity:1;transform:scale(.85)}100%{transform:scale(1)}}
@keyframes gsSwap{0%{opacity:0;transform:rotate(-120deg) scale(.2)}70%{opacity:1;transform:rotate(12deg) scale(1.2)}100%{transform:none}}
.dc-drop{position:absolute;left:8px;right:8px;bottom:30px;padding:6px 8px;border-radius:99px;text-align:center;font-size:11px;font-weight:700;color:#1a1408;background:var(--accent,#e9c46a);opacity:0;transform:translateY(6px);transition:.15s;pointer-events:none}
.dress-char.can-drop .dc-drop{opacity:.9;transform:none}
.dc-name{margin-top:4px;text-align:center;font-size:12px;font-weight:700;color:#fff;letter-spacing:-.01em;line-height:1.25;word-break:keep-all}
.dress-side{min-width:0}
.dress-head{font-size:12px;font-weight:700;color:var(--parch);margin:2px 2px 8px;line-height:1.35}.dress-head b{color:#e9c46a}
.dress-grid{display:grid;gap:7px}
.dress-grid.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.dress-grid.g2{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dress-grid.can-off{outline:2px dashed rgba(255,120,120,.0)}
.dress-grid.drop-off{outline:2px dashed rgba(255,130,130,.8);outline-offset:4px;border-radius:12px}
.dress-tip{margin-top:8px;font-size:11px;line-height:1.45;color:var(--parch2,#b9b2a0)}
.dtile{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:1;min-width:0;padding:0;border-radius:12px;border:1px solid var(--line-hi);background:rgba(255,255,255,.07);color:#efe6cf;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;transition:transform .12s,box-shadow .15s,background .15s}
.dtile:active{transform:scale(.95)}
.dtile .dt-ico{width:56%;height:56%;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.dress-grid.g2 .dtile .dt-ico{width:50%;height:50%}
.dtile.sel{box-shadow:0 0 0 2px rgba(255,255,255,.55)}

   (visual-only layer; layout/sizing stays in the rules above)

:root{
  --n0:#06070d;--n1:#0a0d17;--n2:#10141f;--n3:#171c2a;--n4:#232a3d;
  --gold:#ecba68;--gold2:#f6dcab;--gold3:rgba(255,255,255,.14);--gold4:#fff2d6;
  --parch:#e9ebf4;--parch2:#9ea6bb;--ink:#14100a;--blood:#ff7a68;
  --hp:#5fd3a2;--stag:#ffc857;--mute:#8aa8ff;--shadow:rgba(2,3,10,.55);
  --accent:#ecba68;--accent-rgb:236,186,104;--violet:#8e8bff;
  --glass:rgba(16,20,33,.58);--glass-hi:rgba(26,31,48,.66);
  --line:rgba(255,255,255,.09);--line-hi:rgba(255,255,255,.18);
  --r-sm:10px;--r-md:14px;--r-lg:20px;
  --ease:cubic-bezier(.22,.9,.24,1);
}
html,body{font-family:var(--sans);font-weight:450;letter-spacing:-.012em;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;
  word-break:keep-all;overflow-wrap:break-word}
h1,h2,h3,h4,.sec-head{font-family:var(--display);font-weight:800;letter-spacing:-.03em}
b,strong{font-weight:700}
#vignette{background:
  radial-gradient(900px 520px at 12% -8%,rgba(142,139,255,.16),transparent 60%),
  radial-gradient(760px 520px at 100% 108%,rgba(var(--accent-rgb),.12),transparent 60%),
  radial-gradient(ellipse at center,transparent 44%,rgba(2,3,10,.62) 100%)}
#grain{opacity:.035}

/* type */
.gold-title{font-weight:800;letter-spacing:-.035em;color:#fff;
  background:linear-gradient(180deg,#ffffff 0%,#fbe8c4 55%,#ecba68 130%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 6px 24px rgba(var(--accent-rgb),.28))}
.topbar .brand{font-family:var(--display);font-weight:700;letter-spacing:-.02em;font-size:14px;
  color:#fff;filter:none}
.hudstat{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:0;color:var(--parch);
  padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.hudstat .ico{color:var(--accent)}
.gmeta{color:var(--parch2);letter-spacing:-.01em}
.sec-head{font-size:15px;color:var(--parch);letter-spacing:-.02em}
.sec-head:before{content:"";display:inline-block;width:6px;height:6px;border-radius:2px;background:var(--accent);margin-right:8px;vertical-align:2px;box-shadow:0 0 10px rgba(var(--accent-rgb),.7)}
.filigree{opacity:.6}
.filigree:before,.filigree:after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent)}

/* glass panels */
.frame{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.015)),var(--glass);
  border:1px solid var(--line);border-radius:var(--r-md);
  -webkit-backdrop-filter:blur(16px) saturate(1.25);backdrop-filter:blur(16px) saturate(1.25);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 12px 32px var(--shadow)}
.frame:before,.frame:after,.frame .cbl,.frame .cbr{display:none!important}
.empty-state{border-style:solid}

/* buttons */
.btn{font-family:var(--sans);font-weight:650;letter-spacing:-.01em;color:var(--parch);text-shadow:none;
  border:1px solid var(--line-hi);border-radius:var(--r-sm);
  background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.035));
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 6px 18px rgba(0,0,0,.28);
  transition:transform .22s var(--ease),box-shadow .22s var(--ease),background .22s,border-color .22s}
.btn:after{display:none}
.btn:hover{filter:none;transform:translateY(-1px);border-color:rgba(var(--accent-rgb),.55);
  background:linear-gradient(180deg,rgba(var(--accent-rgb),.18),rgba(255,255,255,.04));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 8px 24px rgba(var(--accent-rgb),.16)}
.btn:active{transform:scale(.97);filter:none}
.btn.primary{color:#1b1306;border:1px solid rgba(255,255,255,.35);font-weight:750;
  background:linear-gradient(180deg,#ffdca0 0%,#ecba68 55%,#d9964a 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 10px 28px rgba(var(--accent-rgb),.32)}
.btn.primary:hover{background:linear-gradient(180deg,#ffe6b8,#f2c479 55%,#e0a053);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 12px 32px rgba(var(--accent-rgb),.42)}
.btn[disabled]{opacity:.38}
.pill{font-weight:600;letter-spacing:0;color:var(--accent);border-radius:999px;
  border:1px solid rgba(var(--accent-rgb),.35);background:rgba(var(--accent-rgb),.1);box-shadow:none}
.icon-btn{border-radius:12px!important}
.icon-btn.off{opacity:.55;filter:none}
/* shared close (X) button — 48x48 hit area, icon drawn in a 32px disc */
.x-btn{position:relative;flex:0 0 auto;width:48px;height:48px;min-width:48px;padding:0;margin:0;border:0;background:none;display:inline-flex;align-items:center;justify-content:center;color:var(--parch);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;z-index:7}
.x-btn .x-ico{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);border:1px solid var(--line-hi);transition:background .15s,transform .15s;pointer-events:none}
.x-btn svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;pointer-events:none}
.x-btn:hover .x-ico,.x-btn:focus-visible .x-ico{background:rgba(255,255,255,.2)}
.x-btn:active .x-ico{transform:scale(.9);background:rgba(255,255,255,.28)}
.x-btn:focus-visible{outline:2px solid var(--accent,#e9c46a);outline-offset:-4px;border-radius:50%}
.sheet-head{position:sticky;top:0;z-index:6;display:flex;align-items:center;justify-content:center;height:52px;margin:0 -16px 2px;padding:0 16px;
  background:linear-gradient(180deg,rgba(22,26,38,1) 70%,rgba(22,26,38,0));touch-action:none;cursor:grab}
.sheet-head .sheet-handle{margin:0;width:44px;height:5px;border-radius:3px;background:var(--gold3);opacity:.9}
.sheet-head .x-btn{position:absolute;top:2px;right:6px}
.rp-card{position:relative}.rp-card .x-btn{position:absolute;top:2px;right:2px}.rp-card h3{margin-right:46px}

/* title */
#scene-title h1{font-size:clamp(44px,9vw,92px);letter-spacing:-.05em;line-height:1.05;margin:6px 0 10px}
#scene-title .sub{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.42em;color:var(--accent);
  padding:5px 12px 5px 16px;border:1px solid rgba(var(--accent-rgb),.3);border-radius:999px;background:rgba(var(--accent-rgb),.08);margin-bottom:6px}
#scene-title .tag{font-weight:500;letter-spacing:-.01em;color:var(--parch2);font-size:14px;opacity:1}
#scene-title .enter{font-size:16px;padding:15px 52px;border-radius:14px}
#scene-title .emblem{filter:drop-shadow(0 0 22px rgba(var(--accent-rgb),.45))}

/* lobby */
#scene-lobby,.panel-scene{background:linear-gradient(180deg,rgba(6,7,13,.5) 0%,rgba(6,7,13,.74) 42%,rgba(6,7,13,.9) 100%)}
.floors{gap:6px}
.floor-btn{border-radius:999px;border:1px solid var(--line);font-weight:600;letter-spacing:-.01em;color:var(--parch2);
  background:rgba(255,255,255,.05);box-shadow:none}
.floor-btn:hover{color:var(--parch);border-color:var(--line-hi);transform:none}
.floor-btn.on{color:#1b1306;border-color:transparent;background:linear-gradient(180deg,#ffdca0,#ecba68);
  box-shadow:0 6px 20px rgba(var(--accent-rgb),.3)}
.floor-hero{border-radius:var(--r-md)}
.floor-hero .cap{background:linear-gradient(90deg,rgba(6,7,13,.94) 0%,rgba(6,7,13,.7) 62%,rgba(6,7,13,0) 100%)}
.floor-hero h2{letter-spacing:-.03em;font-weight:800}
.guest-card{border-radius:var(--r-md)}
.guest-card:hover,.guest-card.on{border-color:rgba(var(--accent-rgb),.6);transform:translateY(-1px);
  background:linear-gradient(90deg,rgba(var(--accent-rgb),.12),rgba(16,20,33,.6));
  box-shadow:0 12px 30px rgba(0,0,0,.4),0 0 0 1px rgba(var(--accent-rgb),.25)}
.guest-card .bust{border-radius:12px;background:radial-gradient(ellipse at 50% 20%,rgba(142,139,255,.2),#0a0d17 72%);
  box-shadow:inset 0 0 0 1px var(--line)}
.guest-card .chev{color:var(--accent);opacity:.8}
.guest-card h3,.guest-card .ginfo b{font-weight:750;letter-spacing:-.02em}
.detail h3,.guest-sheet h3{letter-spacing:-.03em;color:#fff}
.pf-ring{clip-path:none;border-radius:var(--r-lg);
  background:radial-gradient(ellipse at 50% 16%,rgba(142,139,255,.2),#0a0d17 64%);
  box-shadow:inset 0 0 0 1px var(--line-hi),0 20px 50px rgba(0,0,0,.45)}
.pf-plate{background:transparent;border:none;border-top:1px solid var(--line)}
.pname{letter-spacing:-.01em;font-weight:700}

/* bottom nav + sheet */
.botnav{gap:6px;justify-content:center;
  background:linear-gradient(180deg,transparent 0%,rgba(6,7,13,.82) 45%,rgba(6,7,13,.95) 100%)}
.botnav .btn{border-radius:14px;min-width:92px;background:rgba(255,255,255,.06)}
.botnav .btn.primary{background:linear-gradient(180deg,#ffdca0,#ecba68)}
.guest-sheet{border-top:1px solid var(--line-hi);border-radius:var(--r-lg) var(--r-lg) 0 0;
  background:linear-gradient(180deg,rgba(255,255,255,.06),transparent 22%),rgba(12,15,26,.9);
  -webkit-backdrop-filter:blur(22px) saturate(1.3);backdrop-filter:blur(22px) saturate(1.3);
  box-shadow:0 -24px 60px rgba(0,0,0,.6)}
.sheet-handle{background:rgba(255,255,255,.25);width:40px}
@media (min-width:861px){.guest-sheet{border:1px solid var(--line-hi);border-radius:var(--r-lg)}}
.bonus-sum{border-radius:var(--r-md);border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--parch2)}
.gift-cell{border-radius:var(--r-md)}
.tabs{gap:6px}

/* battle */
.char-plate{font-weight:650;letter-spacing:-.01em;color:#fff;border:1px solid var(--line-hi);border-radius:999px;
  background:rgba(10,13,23,.72);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 6px 16px rgba(0,0,0,.45)}
.bars{border-radius:var(--r-md)}
.bar{height:10px;border-radius:999px;border:none;background:rgba(255,255,255,.1);box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
.bar .fill,.bar .ghost{border-radius:999px}
.bar .segs{display:none}
.bar.hp .fill{background:linear-gradient(90deg,#3ab88a,#7ff0bd)}
.bar.stag .fill{background:linear-gradient(90deg,#ffb23a,#ffe08a)}
.bar-lab{font-weight:650;letter-spacing:-.01em;color:var(--parch2)}
.bar-lab span:last-child,.bar-lab b{font-family:var(--display);color:var(--parch)}
.orb{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08)}
.orb.on{background:radial-gradient(circle at 35% 35%,#fff,var(--accent));box-shadow:0 0 10px rgba(var(--accent-rgb),.8);border-color:transparent}
.pip{border-bottom-color:rgba(255,255,255,.14)}
.turnchip{font-family:var(--display);font-weight:700;letter-spacing:.04em;color:var(--parch);
  padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.clash-ring{border:1px solid rgba(255,255,255,.12);box-shadow:0 0 36px rgba(var(--accent-rgb),.12),inset 0 0 36px rgba(0,0,0,.35)}
.clash .vs{color:#fff;font-weight:700;text-shadow:0 0 22px rgba(var(--accent-rgb),.9)}
.dmg{font-weight:700;letter-spacing:-.02em;color:#fff3d8;
  text-shadow:0 2px 0 rgba(0,0,0,.55),0 0 14px rgba(var(--accent-rgb),.85),0 0 28px rgba(255,100,70,.55)}
.dmg.hurt{color:#ff9d8f}
.dmg.stag{font-weight:700;letter-spacing:.02em}
.qpanel h4{font-family:var(--display);font-weight:700;letter-spacing:.14em;color:var(--accent);font-size:11px}
.qpanel .prompt{font-weight:600;letter-spacing:-.015em;line-height:1.6}
.qopts button{border-radius:var(--r-sm);border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--parch);
  font-weight:500;transition:transform .18s var(--ease),border-color .18s,background .18s}
.qopts button:hover{border-color:rgba(var(--accent-rgb),.6);background:rgba(var(--accent-rgb),.12);transform:translateY(-1px)}
.qopts button:active{transform:scale(.98)}
.result-banner .big{font-family:var(--display);font-weight:800;letter-spacing:-.02em;color:#fff}
.expl{border-radius:var(--r-sm);border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--parch2)}
.logbox{border-radius:10px;border-left:2px solid rgba(var(--accent-rgb),.5);background:rgba(8,10,18,.6)}
.learn-toast{border-radius:var(--r-md)}

/* paper combat pages (keep the paper, modernize the type) */
.card.paper,.ci-card.paper,.dpage.paper{border-radius:8px;border:1px solid rgba(90,62,30,.55)}
.card.paper .nm,.ci-card.paper .ci-name,.dpage.paper .nm{font-family:var(--sans);font-weight:800;letter-spacing:-.03em;color:#1c130a}
.card.paper .tx,.ci-card.paper .ci-text{font-weight:500;letter-spacing:-.01em}
.card.paper .dice,.card.paper .emo{font-family:var(--display);font-weight:700;letter-spacing:0}
.card .flavor,.ci-flavor,.dpage .flavor{font-style:normal;font-weight:500;letter-spacing:-.01em;color:#6a4a28}
.card .flavor:before,.ci-flavor:before{content:"“";font-family:var(--display)}
.card .flavor:after,.ci-flavor:after{content:"”";font-family:var(--display)}
.card .wax,.dpage .wax,.ci-card .wax{font-family:var(--display);font-weight:700}
.dpage.in:after{font-family:var(--sans);font-weight:700;letter-spacing:0;border-radius:4px;color:#1b1306;background:var(--accent)}
.dpage.in .card,.deck-slot:not(.empty) .card{box-shadow:0 0 0 2px var(--accent),0 10px 24px rgba(var(--accent-rgb),.3),1px 3px 8px rgba(0,0,0,.38)}
.ci-die{border-radius:8px}
.ci-card.paper .ci-meta .pill{border-radius:999px}
.ci-hint{letter-spacing:.02em}

/* deck / shelf / collection */
.deck-slot.empty{border:1.5px dashed rgba(255,255,255,.2);border-radius:8px;background:rgba(255,255,255,.04);color:var(--parch2);letter-spacing:0}
.deck-search,.deck-filters select{border-radius:var(--r-sm);border:1px solid var(--line-hi);background:rgba(255,255,255,.06);color:var(--parch);letter-spacing:-.01em}
.deck-search:focus,.deck-filters select:focus{outline:none;border-color:rgba(var(--accent-rgb),.7);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.15)}
.cost-curve .cc-track{border:none;border-radius:999px;background:rgba(255,255,255,.1)}
.cost-curve .cc-track i{border-radius:999px;background:linear-gradient(90deg,#d9964a,#ffdca0)}
.al-cell{border-radius:var(--r-sm);border:1px solid var(--line);background:rgba(255,255,255,.04)}
.al-cell.own{border-color:var(--line-hi);background:rgba(255,255,255,.07)}
.al-cell.eq{border-color:rgba(var(--accent-rgb),.7);box-shadow:0 0 18px rgba(var(--accent-rgb),.25)}
.gacha-stage{border-radius:var(--r-lg);background:radial-gradient(ellipse at 50% 85%,rgba(var(--accent-rgb),.18),transparent 58%),radial-gradient(ellipse at 20% 0%,rgba(142,139,255,.16),transparent 55%),#080a12}
.gface{border:1px solid rgba(var(--accent-rgb),.6);border-radius:16px}
.gface .rar{font-family:var(--display);font-weight:700;letter-spacing:.2em}
.credits-list a{color:var(--accent);text-underline-offset:3px}
.credits-list b{color:#fff}

/* subtle motion */
@keyframes trendRise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.scene.on .guest-card,.scene.on .book-item,.scene.on .key-item,.scene.on .gift-cell,.scene.on .al-cell,.scene.on .empty-state{
  animation:trendRise .38s var(--ease) both}
.scene.on .guest-card:nth-child(2),.scene.on .book-item:nth-child(2){animation-delay:.04s}
.scene.on .guest-card:nth-child(3),.scene.on .book-item:nth-child(3){animation-delay:.08s}
.scene.on .guest-card:nth-child(n+4),.scene.on .book-item:nth-child(n+4){animation-delay:.12s}
@media (prefers-reduced-motion:reduce){.scene.on *{animation-duration:.01ms!important}}
::selection{background:rgba(var(--accent-rgb),.3)}


/* ===== whole-stage battle framing: moderate characters standing on a stage ===== */
#scene-battle{--fig-h:clamp(118px,17vh,168px);--feet:clamp(214px,29vh,280px);--plate-h:26px}
.fighter{top:auto;bottom:calc(var(--feet) - var(--plate-h));height:calc(var(--fig-h) + var(--plate-h));
  width:calc(var(--fig-h) * .66);max-height:none}
.fighter.librarian{left:6%;right:auto}
.fighter.guest{right:6%;left:auto}
.fighter .char{flex:0 0 var(--fig-h);height:var(--fig-h);width:100%;min-height:0}
.fighter .char svg{height:100%;width:auto;max-width:100%}
.fighter:after{bottom:calc(var(--plate-h) - 12px);height:24px;width:92%}
.char-plate{min-width:0;width:100%;margin-top:0;height:var(--plate-h);line-height:calc(var(--plate-h) - 10px);padding:3px 10px;font-size:11px}
.clash,.clash-zone{top:calc(100% - var(--feet) - var(--fig-h) * .56)}
.clash-zone{width:min(34vw,170px);height:min(34vw,170px);opacity:.75}
@media (min-width:861px){
  #scene-battle{--fig-h:clamp(150px,24vh,232px);--feet:clamp(240px,29vh,300px)}
  .fighter.librarian{left:calc(50% - var(--fig-h) * .66 - 90px)}
  .fighter.guest{right:calc(50% - var(--fig-h) * .66 - 90px)}
}
@media (max-width:860px){
  .fighter.librarian{left:5%}.fighter.guest{right:5%}
  .char-plate{font-size:10px}
}
@media (max-height:780px) and (max-width:860px){#scene-battle{--fig-h:clamp(112px,16vh,146px);--feet:clamp(200px,28vh,232px)}}

/* curator stamp (TAK!) */
.tak-stamp{position:absolute;z-index:18;pointer-events:none;width:112px;height:112px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.02em;color:#fff3d8;
  border:3px solid rgba(255,236,200,.92);background:radial-gradient(circle,rgba(236,186,104,.28),rgba(236,186,104,.04) 70%);
  box-shadow:0 0 28px rgba(236,186,104,.75),inset 0 0 20px rgba(236,186,104,.45);
  text-shadow:0 0 14px rgba(236,186,104,.9);transform:translate(-50%,-50%);
  animation:takStamp .46s cubic-bezier(.2,.9,.2,1) forwards}
.tak-stamp:after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid rgba(255,236,200,.7);animation:takRing .46s ease-out forwards}
@keyframes takStamp{0%{opacity:0;transform:translate(-50%,-50%) scale(2)}20%{opacity:1;transform:translate(-50%,-50%) scale(.92)}36%{transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.06)}}
@keyframes takRing{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}

/* ===== result screen: full-screen scrim + centered glass card ===== */
.battle-stage.result-on .hud-top,.battle-stage.result-on .hand,.battle-stage.result-on .fighter,
.battle-stage.result-on .clash,.battle-stage.result-on .clash-zone,.battle-stage.result-on .logbox,
.battle-stage.result-on .pass-btn,.battle-stage.result-on .qpanel{opacity:0!important;visibility:hidden!important;pointer-events:none!important;transition:opacity .25s}
.result-banner{position:absolute;inset:0;left:0;top:0;transform:none;z-index:30;display:none;text-align:center}
.result-banner.on{display:flex;align-items:center;justify-content:center;padding:calc(var(--audio-top,10px) + var(--audio-btn,36px) + 8px) 14px 16px;
  background:rgba(6,8,16,.8);-webkit-backdrop-filter:blur(16px) saturate(1.1);backdrop-filter:blur(16px) saturate(1.1);
  animation:rbFade .3s ease both}
@keyframes rbFade{from{opacity:0}to{opacity:1}}
.rb-card{width:min(92vw,420px);max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:22px 20px 20px;border-radius:var(--r-lg);
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.015)),rgba(14,18,32,.86);
  border:1px solid var(--line-hi);box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.1);
  animation:rbPop .42s var(--ease) both}
@keyframes rbPop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.rb-eyebrow{display:inline-block;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.16em;color:var(--accent);
  padding:4px 12px;border-radius:999px;border:1px solid rgba(var(--accent-rgb),.35);background:rgba(var(--accent-rgb),.1)}
.rb-book{display:flex;justify-content:center;margin:14px 0 4px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.55)) drop-shadow(0 0 16px rgba(var(--accent-rgb),.35))}
.rb-book svg{width:76px;height:96px}
.rb-title{font-size:26px;color:#fff;margin:6px 0 8px;letter-spacing:-.03em;line-height:1.2;word-break:keep-all}
.rb-msg{font-size:14px;line-height:1.65;color:var(--parch2);margin:0 auto;max-width:34em;word-break:keep-all;overflow-wrap:break-word;text-wrap:balance}
.rb-levelup{margin-top:10px;font-size:13px;font-weight:650;color:var(--hp)}
.rb-gift{display:flex;gap:12px;align-items:center;text-align:left;margin-top:16px;padding:12px 14px;border-radius:var(--r-md);
  background:rgba(var(--accent-rgb),.09);border:1px solid rgba(var(--accent-rgb),.32)}
.rb-gift.none{background:rgba(255,255,255,.04);border-color:var(--line)}
.rb-gift-ico{flex:0 0 auto;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  color:#1b1306;background:linear-gradient(180deg,#ffdca0,#ecba68);box-shadow:0 6px 16px rgba(var(--accent-rgb),.3)}
.rb-gift.none .rb-gift-ico{color:var(--parch2);background:rgba(255,255,255,.08);box-shadow:none}
.rb-gift-ico .ico{width:22px;height:22px}
.rb-gift-tx{min-width:0;display:flex;flex-direction:column;gap:2px}
.rb-gift-lab{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.02em}
.rb-gift-tx b{font-size:15px;color:#fff;font-weight:750;letter-spacing:-.02em;word-break:keep-all}
.rb-gift-tx small{font-size:12px;line-height:1.5;color:var(--parch2);word-break:keep-all}
.rb-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.rb-actions .btn{padding:13px 10px;font-size:14px;letter-spacing:-.01em}
.rb-actions .btn.primary{grid-column:1/-1;padding:15px 10px;font-size:15px}
.rb-actions.two .btn.primary{grid-column:auto}
.rb-card .expl{margin-top:12px;text-align:left}

/* ===== combat rework UI: stagger gauges, intent preview, resist table, floating numbers ===== */
.dmg{display:flex;flex-direction:column;align-items:center;gap:1px;transform:translateX(-50%);line-height:1}
.dmg span{display:block}
.dmg .dtag{font-style:normal;font-family:var(--sans);font-weight:800;font-size:10px;letter-spacing:0;padding:1px 6px;border-radius:999px;
  color:#1b1306;background:#ffd98a;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.dmg.hp{color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 14px rgba(255,255,255,.55)}
.dmg.hurt{color:#ff7a68;text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 14px rgba(255,80,60,.7)}
.dmg.stag{color:#ffd23f;font-size:24px;text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 12px rgba(255,200,40,.75)}
.dmg.stag .dtag{background:#ffd23f}
.dmg.rec{color:#7ff0bd;font-size:24px;text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 12px rgba(80,230,170,.7)}
.dmg.rec .dtag{background:#7ff0bd}
.dmg.hurt .dtag{background:#ff9d8f}
.bars.is-stag{border-color:rgba(255,200,64,.7)!important;box-shadow:0 0 0 1px rgba(255,200,64,.35),0 0 22px rgba(255,200,64,.28),0 12px 32px var(--shadow)}
.bars.is-stag #lab-pst,.bars.is-stag #lab-gst{color:#ffd23f;font-weight:800}
.bar.stag .fill{transition:width .3s ease-out}
.stag-badge{position:absolute;left:50%;top:-2px;transform:translate(-50%,-100%);z-index:5;white-space:nowrap;font-size:10px;font-weight:800;letter-spacing:0;
  color:#1b1306;background:linear-gradient(180deg,#ffe38a,#ffc43a);padding:3px 9px;border-radius:999px;opacity:0;visibility:hidden;box-shadow:0 4px 14px rgba(255,196,58,.45);transition:opacity .2s}
.stag-badge.on{opacity:1;visibility:visible}
.fighter.guest:has(.intent) .stag-badge{top:auto;bottom:calc(var(--plate-h) + 4px);transform:translate(-50%,0)}
.fighter.librarian .stag-badge{top:auto;bottom:calc(var(--plate-h) + 4px);transform:translate(-50%,0)}
.fighter.guest .char,.fighter.guest .char-plate{pointer-events:auto;cursor:pointer}
.state-note{position:absolute;left:50%;top:calc(100% - var(--feet) - var(--fig-h) - 28px);transform:translateX(-50%);z-index:9;
  padding:7px 16px;border-radius:999px;font-weight:750;font-size:13px;color:#1b1306;background:linear-gradient(180deg,#ffe38a,#ffc43a);box-shadow:0 8px 24px rgba(255,196,58,.4);pointer-events:none;white-space:nowrap}
/* intent preview above the guest */
.intent{position:absolute;right:0;bottom:calc(100% + 2px);width:max(100%,min(58vw,232px));z-index:6;pointer-events:none;
  padding:8px 10px 9px;border-radius:12px;background:rgba(10,13,24,.82);border:1px solid var(--line-hi);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 10px 26px rgba(0,0,0,.5);text-align:left;transition:opacity .2s}
.intent .in-head{display:flex;align-items:center;gap:6px;min-width:0}
.intent .in-head b{font-size:13px;font-weight:800;letter-spacing:-.02em;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.intent .in-lab{font-size:9px;font-weight:800;letter-spacing:.08em;color:var(--accent);padding:1px 6px;border-radius:999px;border:1px solid rgba(var(--accent-rgb),.4);flex:0 0 auto}
.intent .in-star{font-size:10px;font-weight:800;color:#fff;padding:1px 7px;border-radius:999px;background:linear-gradient(180deg,#ff6a55,#c8321f);flex:0 0 auto;box-shadow:0 0 12px rgba(255,80,60,.7)}
.intent .in-dice{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.intent .in-die{display:inline-flex;align-items:center;gap:3px;font-family:var(--display);font-weight:600;font-size:11px;color:var(--parch);padding:2px 7px;border-radius:7px;background:rgba(255,255,255,.08);white-space:nowrap}
.intent .in-die b{font-family:var(--sans);font-weight:700}
.intent .in-die.t-방어{color:#8ff0c0}.intent .in-die.t-회피{color:#9bc3ff}
.intent .in-dmg{margin-top:6px;font-size:11px;font-weight:650;color:var(--parch2);white-space:nowrap;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.intent .in-dmg .hp{color:#ff9d8f;font-family:var(--display)}
.intent .in-dmg .st{color:#ffd23f;font-family:var(--display);display:inline-flex;align-items:center;gap:2px}
.intent .in-dmg .in-if{opacity:.75}
.intent .in-sub{margin-top:4px;font-size:11px;color:var(--parch2)}
.intent.big{border-color:rgba(255,90,70,.75);background:linear-gradient(180deg,rgba(80,14,10,.55),rgba(10,13,24,.86));
  box-shadow:0 0 0 1px rgba(255,90,70,.4),0 0 26px rgba(255,70,50,.5),0 10px 26px rgba(0,0,0,.5);animation:intentPulse 1.6s ease-in-out infinite}
@keyframes intentPulse{0%,100%{box-shadow:0 0 0 1px rgba(255,90,70,.4),0 0 18px rgba(255,70,50,.35),0 10px 26px rgba(0,0,0,.5)}50%{box-shadow:0 0 0 1px rgba(255,90,70,.7),0 0 34px rgba(255,70,50,.75),0 10px 26px rgba(0,0,0,.5)}}
.intent.down{border-color:rgba(255,200,64,.6)}
.battle-stage.rolling .intent{opacity:0}
.battle-stage.result-on .intent{display:none}
@media (min-width:861px){.intent{width:max(100%,260px)}}
/* key / short-answer question panel */
.qpanel.key{border-color:rgba(255,90,70,.7)!important;box-shadow:0 0 0 1px rgba(255,90,70,.35),0 0 32px rgba(255,70,50,.4),0 16px 40px rgba(0,0,0,.55)}
.q-key{display:inline-block;margin-left:6px;font-size:10px;font-weight:800;letter-spacing:0;color:#fff;padding:1px 8px;border-radius:999px;background:linear-gradient(180deg,#ff6a55,#c8321f)}
.qpanel.short{bottom:auto;top:calc(var(--audio-top,10px) + var(--audio-btn,36px) + 8px);max-height:calc(100% - 20px);overflow-y:auto;transform:translate(-50%,var(--vvy,0px));z-index:26;animation:none}
.qpanel.short .prompt{font-size:15px}
.short-form{display:flex;gap:8px;margin-top:2px}
.short-form input{flex:1;min-width:0;font:inherit;font-size:16px;font-weight:600;color:#fff;padding:12px 14px;border-radius:12px;
  border:1px solid var(--line-hi);background:rgba(255,255,255,.07);outline:none;letter-spacing:-.01em}
.short-form input::placeholder{color:var(--parch2);font-weight:450}
.short-form input:focus{border-color:rgba(var(--accent-rgb),.8);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.18)}
.short-form .btn{padding:12px 18px;flex:0 0 auto}
.q-hint{margin-top:8px}
.lt-you{display:block;font-size:11px;color:#ff9d8f;margin-bottom:3px;font-weight:600}
/* resist table */
.rgrid{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 8px;align-items:center;margin-top:8px}
.rg-h{font-size:10px;font-weight:800;color:var(--parch2);text-align:center;letter-spacing:.04em}
.rg-t{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--parch)}
.tier{display:flex;align-items:baseline;justify-content:center;gap:4px;padding:5px 6px;border-radius:9px;font-size:12px;font-weight:800;letter-spacing:-.01em;border:1px solid transparent;white-space:nowrap}
.tier i{font-style:normal;font-family:var(--display);font-weight:600;font-size:10px;opacity:.8}
.tier[data-t="치명"]{color:#fff;background:linear-gradient(180deg,#ff6a55,#c8321f)}
.tier[data-t="취약"]{color:#1b1306;background:linear-gradient(180deg,#ffd98a,#f0a93c)}
.tier[data-t="보통"]{color:var(--parch2);background:rgba(255,255,255,.06);border-color:var(--line)}
.tier[data-t="견딤"]{color:#bcd6ff;background:rgba(90,140,255,.16);border-color:rgba(120,160,255,.35)}
.tier[data-t="내성"]{color:#a9b8ff;background:rgba(110,100,255,.2);border-color:rgba(140,130,255,.45)}
.tier[data-t="면역"]{color:#d9c8ff;background:rgba(40,30,70,.7);border-color:rgba(190,160,255,.5)}
.resist-pop{position:absolute;inset:0;z-index:27;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(6,8,16,.55);
  opacity:0;visibility:hidden;transition:opacity .16s}
.resist-pop.on{opacity:1;visibility:visible}
.rp-card{width:min(92vw,360px);padding:16px 16px 14px;border-radius:var(--r-lg);background:rgba(14,18,32,.92)!important}
.rp-card h3{font-size:16px;color:#fff;margin-bottom:2px}
.sheet-resist{margin:10px 0 6px;padding:10px 12px 10px;border-radius:var(--r-md);background:rgba(255,255,255,.04);border:1px solid var(--line)}
.sr-title{font-weight:800;font-size:13px;color:#fff;letter-spacing:-.02em}
.sr-title small{font-weight:500;color:var(--parch2);margin-left:6px;font-size:11px}

/* ===== battle HUD v2: right-aligned guest panel, per-unit emotion pips, light chip above hand ===== */
.bars{position:relative}
.bars.left{box-shadow:inset 3px 0 0 rgba(var(--accent-rgb),.6),0 10px 28px var(--shadow)}
.bars.right{text-align:right;box-shadow:inset -3px 0 0 rgba(var(--accent-rgb),.6),0 10px 28px var(--shadow)}
.bars.right .bar-lab{flex-direction:row-reverse}
.bars.right .bar .ghost,.bars.right .bar .fill{left:auto;right:0}
.bars.right .bar-lab span:first-child{display:inline-flex;flex-direction:row-reverse;align-items:center;gap:4px}
.bars .bar-lab:first-child{font-size:12px;font-weight:700;color:var(--parch)}
.bars.left .bar-lab span:first-child{display:inline-flex;align-items:center;gap:4px}
.bars.left .bar-lab span:last-child,.bars.right .bar-lab span:last-child{font-variant-numeric:tabular-nums}
.bars .bar-lab{align-items:center;gap:8px}
.bars .bar{height:11px}
.emo-chip{position:absolute;top:-26px;left:0;z-index:5;display:flex;align-items:center;gap:4px;padding:3px 9px 3px 8px;border-radius:999px;
  background:rgba(8,10,18,.62);border:1px solid rgba(var(--accent-rgb),.38);backdrop-filter:blur(4px);white-space:nowrap;pointer-events:none}
.emo-chip .pip{border-left-width:5px;border-right-width:5px;border-bottom-width:9px;transition:border-bottom-color .3s,filter .3s}
.emo-chip .pip.gain{animation:pipGain .95s ease-out}
.emo-chip small{font-size:10px;font-weight:700;color:var(--parch2);margin-left:2px}
@keyframes pipGain{0%{transform:scale(.3) translateY(4px);filter:brightness(3) drop-shadow(0 0 8px var(--gold))}55%{transform:scale(1.6) translateY(-2px)}100%{transform:scale(1) translateY(0)}}
.lightchip{position:absolute;left:12px;bottom:170px;z-index:8;display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;
  background:rgba(8,10,18,.68);border:1px solid rgba(var(--accent-rgb),.4);color:var(--gold2);font-size:12px;pointer-events:none;backdrop-filter:blur(4px)}
.lightchip b{font-family:var(--display);font-size:14px;font-weight:700;color:var(--parch);font-variant-numeric:tabular-nums}
.lightchip small{font-size:10px;color:var(--parch2)}
.lightchip.gain{animation:lightGain .9s ease-out}
.lightchip.spend{animation:lightSpend .6s ease-out}
@keyframes lightGain{0%{box-shadow:0 0 0 0 rgba(255,236,170,.9)}60%{box-shadow:0 0 0 9px rgba(255,236,170,0);transform:scale(1.08)}100%{box-shadow:0 0 0 0 transparent;transform:scale(1)}}
@keyframes lightSpend{0%{opacity:.5}100%{opacity:1}}
.battle-stage:has(.qpanel.on) .lightchip{opacity:0;visibility:hidden}
.battle-stage.result-on .lightchip{opacity:0!important;visibility:hidden!important}
@media (max-width:860px){ .lightchip{bottom:148px;left:8px} .emo-chip{left:-12px;padding:3px 7px} }

/* ===== floor carousel header ===== */
.floor-nav{display:flex;align-items:center;justify-content:space-between;gap:6px;flex:0 0 auto}
.fn-arrow{width:48px;height:48px;flex:0 0 48px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.04);border:1px solid rgba(var(--accent-rgb),.35);color:var(--gold2);cursor:pointer;transition:transform .15s,background .15s}
.fn-arrow svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.fn-arrow:hover{background:rgba(var(--accent-rgb),.16)}.fn-arrow:active{transform:scale(.92)}
.fn-title{flex:1;min-width:0;text-align:center}
.fn-count{font-size:10px;letter-spacing:.08em;color:var(--parch2);font-variant-numeric:tabular-nums}
.fn-name{font-size:20px;letter-spacing:.02em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fn-dots{position:relative;display:flex;align-items:center;justify-content:center;gap:0;height:16px;flex:0 0 auto;margin:-2px 0 2px}
.fn-dots:before{content:"";position:absolute;left:calc(50% - var(--fn-w,60px));right:calc(50% - var(--fn-w,60px));top:50%;height:1px;background:rgba(var(--accent-rgb),.35);transform:translateY(-.5px)}
.fn-dot{position:relative;width:26px;height:16px;display:grid;place-items:center;background:none;border:0;padding:0;cursor:pointer}
.fn-dot i{display:block;width:7px;height:7px;border-radius:99px;background:#2b2f3c;border:1px solid rgba(var(--accent-rgb),.55);transition:width .25s,background .25s}
.fn-dot.on i{width:22px;background:var(--gold);border-color:var(--gold)}
.fn-dot.tiny i{width:4px;height:4px;opacity:.7}
.floor-swipe{display:flex;flex-direction:column;gap:12px;flex:1 1 auto;min-height:0;touch-action:pan-y}
.floor-swipe.slide-in-r,.fn-title.slide-in-r{animation:fnInR .34s cubic-bezier(.2,.8,.2,1)}
.floor-swipe.slide-in-l,.fn-title.slide-in-l{animation:fnInL .34s cubic-bezier(.2,.8,.2,1)}
.floor-swipe.slide-out-l,.fn-title.slide-out-l{animation:fnOutL .15s ease-in forwards}
.floor-swipe.slide-out-r,.fn-title.slide-out-r{animation:fnOutR .15s ease-in forwards}
@keyframes fnInR{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes fnInL{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
@keyframes fnOutL{to{opacity:0;transform:translateX(-36px)}}
@keyframes fnOutR{to{opacity:0;transform:translateX(36px)}}
@media (max-width:860px){ .fn-arrow{width:48px;height:48px} .fn-name{font-size:17px} }
.ticket-chip{display:flex;align-items:center;justify-content:center;gap:6px;margin:12px auto 0;width:max-content;padding:5px 14px;border-radius:999px;background:rgba(8,10,18,.55);border:1px solid rgba(var(--accent-rgb),.4);color:var(--gold2);font-size:12px}
.ticket-chip b{font-family:var(--display);font-size:15px;color:var(--parch)}

.die{position:relative}
.die.keeps svg rect:first-of-type{stroke:#9fd0ff;filter:drop-shadow(0 0 7px rgba(140,200,255,.85))}
.die.reused svg{filter:drop-shadow(0 0 6px rgba(140,200,255,.55))}
.reuse-tag{position:absolute;left:50%;top:-8px;transform:translateX(-50%);padding:1px 8px;border-radius:999px;background:rgba(40,80,120,.9);border:1px solid #9fd0ff;color:#dff0ff;font-size:10px;font-weight:700;letter-spacing:0;white-space:nowrap;pointer-events:none;animation:reuseTag .5s ease-out}
@keyframes reuseTag{from{opacity:0;transform:translate(-50%,6px) scale(.8)}to{opacity:1;transform:translate(-50%,0) scale(1)}}

.qn-small{font-family:var(--body,inherit);font-size:11px;font-weight:600;color:var(--parch2);opacity:.75;letter-spacing:0;margin-left:4px;vertical-align:middle}
.sheet-top{position:relative}
.sheet-books{position:absolute;right:0;bottom:0;display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:rgba(8,10,18,.68);border:1px solid rgba(var(--accent-rgb),.4);color:var(--gold2);font-size:12px;pointer-events:none}
.sheet-books b{font-family:var(--display);font-size:14px;font-weight:700;color:var(--parch);font-variant-numeric:tabular-nums}

#scene-title .credits-link{position:absolute;right:max(10px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));min-width:56px;min-height:44px;padding:0 10px;display:flex;align-items:center;justify-content:flex-end;background:none;border:0;box-shadow:none;border-radius:0;color:var(--parch2);opacity:.6;font:inherit;font-size:11px;letter-spacing:.02em;text-decoration:underline;text-underline-offset:3px;cursor:pointer;-webkit-tap-highlight-color:transparent}
#scene-title .credits-link:hover,#scene-title .credits-link:focus-visible{opacity:.95}

.burn-ov{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.96);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .18s ease;padding:max(24px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));overflow-y:auto;cursor:pointer}
.burn-ov.on{opacity:1}
.burn-x{position:absolute;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.burn-in{width:100%;max-width:420px;margin:auto;text-align:center}
.burn-sub{color:var(--parch2);font-size:12px;letter-spacing:.04em;margin-bottom:6px}
.burn-title{font-family:var(--display);font-size:28px;font-weight:700;color:var(--gold2,#e9c46a);margin:0 0 22px;text-shadow:0 0 18px rgba(233,196,106,.45);animation:burnTitle .4s ease-out both}
.burn-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;justify-items:stretch}
.burn-card{position:relative;padding:26px 12px 14px;border-radius:14px;background:#14161f;border:1.5px solid #3a4054;text-align:center;opacity:0;animation:burnCard .42s cubic-bezier(.2,.9,.3,1.2) calc(.25s + var(--i)*.14s) both}
.burn-card .bk-tag{position:absolute;top:9px;left:10px;font-size:10px}
.burn-card.r-R{border-color:#4a7fc0}.burn-card.r-SR{border-color:#9a63c8;box-shadow:0 0 14px rgba(154,99,200,.3)}
.burn-card.r-SSR{border-color:#e0a82a;box-shadow:0 0 18px rgba(224,168,42,.45)}
.burn-card.r-key{border-color:#e35a70;box-shadow:0 0 20px rgba(227,90,112,.5);background:linear-gradient(180deg,#2a1219,#14161f)}
.burn-new,.burn-dup{position:absolute;top:8px;right:10px;font:700 10px/1 "Space Grotesk",system-ui;padding:3px 7px;border-radius:99px}
.burn-new{background:#e9c46a;color:#1a1204;box-shadow:0 0 10px rgba(233,196,106,.7);animation:burnNew 1.1s ease-in-out infinite}
.burn-dup{background:#2a2f40;color:#aab}

/* ===== Library-of-Ruina-style combat engine (pure functions, no DOM) =====
   · HP + 흐트러짐 저항 gauge on BOTH sides; the gauge DEPLETES, 0 => staggered
   · 3 attack types 참격/관통/타격, per-type HP resist and stagger resist (tiers below)
   · clash = both roll real page dice; higher wins; tie = nothing; loser takes the winner's die
   · the quiz result is only a modifier on dice (correct: me +, guest -; wrong: me -)            */
const TIER={치명:2,취약:1.5,보통:1,견딤:.5,내성:.25,면역:0};
const TIER_ORDER=["치명","취약","보통","견딤","내성","면역"];
const ATK_TYPES=["참격","관통","타격"];
const isAttack=t=>ATK_TYPES.includes(t);
const FLAT_RESIST={hp:{참격:"보통",관통:"보통",타격:"보통"},st:{참격:"보통",관통:"보통",타격:"보통"}};
function mkUnit(hp,st,resist){ return {hp,hpMax:hp,st,stMax:st,stag:0,resist:resist||FLAT_RESIST}; }
/* stag: 0 normal · 2 staggered mid-scene (rest of this scene) · 1 staggered for the whole next scene; all resists = 치명 while >0 */
function resTier(u,kind,type){ return u.stag>0?"치명":((u.resist&&u.resist[kind]&&u.resist[kind][type])||"보통"); }
function hitUnit(u,type,value,m){

  const hp=value>0&&rh>0?Math.max(1,Math.floor(value*rh*(m.hp||1))):0;
  let st=value>0&&rs>0?Math.max(1,Math.floor(value*rs*(m.st||1))):0;
  if(u.stag>0) st=0;
  u.hp=Math.max(0,u.hp-hp);
  let newStag=false;
  if(u.stag===0&&st>0){ u.st=Math.max(0,u.st-st); if(u.st===0){ u.stag=2; newStag=true; } }
  return {kind:"hit",type,hp,st,tagHp:th,tagSt:ts,newStag};
}

  if(v<=0||u.stag>0) return {kind:"stag",hp:0,st:0,newStag:false,tagHp:"보통",tagSt:"보통"};
  const st=Math.max(1,Math.floor(v*(mul||1))); u.st=Math.max(0,u.st-st);
  let newStag=false; if(u.st===0){ u.stag=2; newStag=true; }
  return {kind:"stag",hp:0,st,newStag,tagHp:"보통",tagSt:"보통"};

function playerDieRange(d,correct,isKey,emotion,dieMin){

    if(keepP&&keepG){ heldP=heldG=false; i++; j++; }
