  #lineup{gap:1vw;padding:8% 2% 10%;align-items:flex-end}
  #lineup .lu-name{font-size:11px}
}


/* =====================================================================
   TREND THEME v2 — Pretendard + Space Grotesk, glass panels, amber accent
   (visual-only layer; layout/sizing stays in the rules above)
   ===================================================================== */
:root{
  --n0:#06070d;--n1:#0a0d17;--n2:#10141f;--n3:#171c2a;--n4:#232a3d;
  --gold:#ecba68;--gold2:#f6dcab;--gold3:rgba(255,255,255,.14);--gold4:#fff2d6;
  --parch:#e9ebf4;--parch2:#9ea6bb;--ink:#14100a;--blood:#ff7a68;
  --hp:#5fd3a2;--stag:#ffc857;--mute:#8aa8ff;--shadow:rgba(2,3,10,.55);
  --accent:#ecba68;--accent-rgb:236,186,104;--violet:#8e8bff;
  --glass:rgba(16,20,33,.58);--glass-hi:rgba(26,31,48,.66);
  --line:rgba(255,255,255,.09);--line-hi:rgba(255,255,255,.18);
  --r-sm:10px;--r-md:14px;--r-lg:20px;
  --ease:cubic-bezier(.22,.9,.24,1);
}
html,body{font-family:var(--sans);font-weight:450;letter-spacing:-.012em;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;
  word-break:keep-all;overflow-wrap:break-word}
h1,h2,h3,h4,.sec-head{font-family:var(--display);font-weight:800;letter-spacing:-.03em}
b,strong{font-weight:700}
#vignette{background:
  radial-gradient(900px 520px at 12% -8%,rgba(142,139,255,.16),transparent 60%),
  radial-gradient(760px 520px at 100% 108%,rgba(var(--accent-rgb),.12),transparent 60%),
  radial-gradient(ellipse at center,transparent 44%,rgba(2,3,10,.62) 100%)}
#grain{opacity:.035}

/* type */
.gold-title{font-weight:800;letter-spacing:-.035em;color:#fff;
  background:linear-gradient(180deg,#ffffff 0%,#fbe8c4 55%,#ecba68 130%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 6px 24px rgba(var(--accent-rgb),.28))}
.topbar .brand{font-family:var(--display);font-weight:700;letter-spacing:-.02em;font-size:14px;
  color:#fff;filter:none}
.hudstat{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:0;color:var(--parch);
  padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.hudstat .ico{color:var(--accent)}
.gmeta{color:var(--parch2);letter-spacing:-.01em}
.sec-head{font-size:15px;color:var(--parch);letter-spacing:-.02em}
.sec-head:before{content:"";display:inline-block;width:6px;height:6px;border-radius:2px;background:var(--accent);margin-right:8px;vertical-align:2px;box-shadow:0 0 10px rgba(var(--accent-rgb),.7)}
.filigree{opacity:.6}
.filigree:before,.filigree:after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent)}

/* glass panels */
.frame{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.015)),var(--glass);
  border:1px solid var(--line);border-radius:var(--r-md);
  -webkit-backdrop-filter:blur(16px) saturate(1.25);backdrop-filter:blur(16px) saturate(1.25);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 12px 32px var(--shadow)}
.frame:before,.frame:after,.frame .cbl,.frame .cbr{display:none!important}
.empty-state{border-style:solid}

/* buttons */
.btn{font-family:var(--sans);font-weight:650;letter-spacing:-.01em;color:var(--parch);text-shadow:none;
  border:1px solid var(--line-hi);border-radius:var(--r-sm);
  background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.035));
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 6px 18px rgba(0,0,0,.28);
  transition:transform .22s var(--ease),box-shadow .22s var(--ease),background .22s,border-color .22s}
.btn:after{display:none}
.btn:hover{filter:none;transform:translateY(-1px);border-color:rgba(var(--accent-rgb),.55);
  background:linear-gradient(180deg,rgba(var(--accent-rgb),.18),rgba(255,255,255,.04));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 8px 24px rgba(var(--accent-rgb),.16)}
.btn:active{transform:scale(.97);filter:none}
.btn.primary{color:#1b1306;border:1px solid rgba(255,255,255,.35);font-weight:750;
  background:linear-gradient(180deg,#ffdca0 0%,#ecba68 55%,#d9964a 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 10px 28px rgba(var(--accent-rgb),.32)}
.btn.primary:hover{background:linear-gradient(180deg,#ffe6b8,#f2c479 55%,#e0a053);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 12px 32px rgba(var(--accent-rgb),.42)}
.btn[disabled]{opacity:.38}
.pill{font-weight:600;letter-spacing:0;color:var(--accent);border-radius:999px;
  border:1px solid rgba(var(--accent-rgb),.35);background:rgba(var(--accent-rgb),.1);box-shadow:none}
.icon-btn{border-radius:12px!important}
.icon-btn.off{opacity:.55;filter:none}
/* shared close (X) button — 48x48 hit area, icon drawn in a 32px disc */
.x-btn{position:relative;flex:0 0 auto;width:48px;height:48px;min-width:48px;padding:0;margin:0;border:0;background:none;display:inline-flex;align-items:center;justify-content:center;color:var(--parch);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;z-index:7}
.x-btn .x-ico{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);border:1px solid var(--line-hi);transition:background .15s,transform .15s;pointer-events:none}
.x-btn svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;pointer-events:none}
.x-btn:hover .x-ico,.x-btn:focus-visible .x-ico{background:rgba(255,255,255,.2)}
.x-btn:active .x-ico{transform:scale(.9);background:rgba(255,255,255,.28)}
.x-btn:focus-visible{outline:2px solid var(--accent,#e9c46a);outline-offset:-4px;border-radius:50%}
.sheet-head{position:sticky;top:0;z-index:6;display:flex;align-items:center;justify-content:center;height:52px;margin:0 -16px 2px;padding:0 16px;
  background:linear-gradient(180deg,rgba(22,26,38,1) 70%,rgba(22,26,38,0));touch-action:none;cursor:grab}
.sheet-head .sheet-handle{margin:0;width:44px;height:5px;border-radius:3px;background:var(--gold3);opacity:.9}
.sheet-head .x-btn{position:absolute;top:2px;right:6px}
.rp-card{position:relative}.rp-card .x-btn{position:absolute;top:2px;right:2px}.rp-card h3{margin-right:46px}

/* title */
#scene-title h1{font-size:clamp(44px,9vw,92px);letter-spacing:-.05em;line-height:1.05;margin:6px 0 10px}
#scene-title .sub{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.42em;color:var(--accent);
  padding:5px 12px 5px 16px;border:1px solid rgba(var(--accent-rgb),.3);border-radius:999px;background:rgba(var(--accent-rgb),.08);margin-bottom:6px}
#scene-title .tag{font-weight:500;letter-spacing:-.01em;color:var(--parch2);font-size:14px;opacity:1}
#scene-title .enter{font-size:16px;padding:15px 52px;border-radius:14px}
#scene-title .emblem{filter:drop-shadow(0 0 22px rgba(var(--accent-rgb),.45))}

/* lobby */
#scene-lobby,.panel-scene{background:linear-gradient(180deg,rgba(6,7,13,.5) 0%,rgba(6,7,13,.74) 42%,rgba(6,7,13,.9) 100%)}
.floors{gap:6px}
.floor-btn{border-radius:999px;border:1px solid var(--line);font-weight:600;letter-spacing:-.01em;color:var(--parch2);
  background:rgba(255,255,255,.05);box-shadow:none}
.floor-btn:hover{color:var(--parch);border-color:var(--line-hi);transform:none}
.floor-btn.on{color:#1b1306;border-color:transparent;background:linear-gradient(180deg,#ffdca0,#ecba68);
  box-shadow:0 6px 20px rgba(var(--accent-rgb),.3)}
.floor-hero{border-radius:var(--r-md)}
.floor-hero .cap{background:linear-gradient(90deg,rgba(6,7,13,.94) 0%,rgba(6,7,13,.7) 62%,rgba(6,7,13,0) 100%)}
.floor-hero h2{letter-spacing:-.03em;font-weight:800}
.guest-card{border-radius:var(--r-md)}
.guest-card:hover,.guest-card.on{border-color:rgba(var(--accent-rgb),.6);transform:translateY(-1px);
  background:linear-gradient(90deg,rgba(var(--accent-rgb),.12),rgba(16,20,33,.6));
  box-shadow:0 12px 30px rgba(0,0,0,.4),0 0 0 1px rgba(var(--accent-rgb),.25)}
.guest-card .bust{border-radius:12px;background:radial-gradient(ellipse at 50% 20%,rgba(142,139,255,.2),#0a0d17 72%);
  box-shadow:inset 0 0 0 1px var(--line)}
.guest-card .chev{color:var(--accent);opacity:.8}
.guest-card h3,.guest-card .ginfo b{font-weight:750;letter-spacing:-.02em}
.detail h3,.guest-sheet h3{letter-spacing:-.03em;color:#fff}
.pf-ring{clip-path:none;border-radius:var(--r-lg);
  background:radial-gradient(ellipse at 50% 16%,rgba(142,139,255,.2),#0a0d17 64%);
  box-shadow:inset 0 0 0 1px var(--line-hi),0 20px 50px rgba(0,0,0,.45)}
.pf-plate{background:transparent;border:none;border-top:1px solid var(--line)}
.pname{letter-spacing:-.01em;font-weight:700}

/* bottom nav + sheet */
.botnav{gap:6px;justify-content:center;
  background:linear-gradient(180deg,transparent 0%,rgba(6,7,13,.82) 45%,rgba(6,7,13,.95) 100%)}
.botnav{gap:10px}
.botnav .btn{border-radius:14px;flex:1 1 0;max-width:200px;min-width:0;background:rgba(255,255,255,.06)}
.botnav .btn.primary{background:linear-gradient(180deg,#ffdca0,#ecba68)}
.guest-sheet{border-top:1px solid var(--line-hi);border-radius:var(--r-lg) var(--r-lg) 0 0;
  background:linear-gradient(180deg,rgba(255,255,255,.06),transparent 22%),rgba(12,15,26,.9);
  -webkit-backdrop-filter:blur(22px) saturate(1.3);backdrop-filter:blur(22px) saturate(1.3);
  box-shadow:0 -24px 60px rgba(0,0,0,.6)}
.sheet-handle{background:rgba(255,255,255,.25);width:40px}
@media (min-width:861px){.guest-sheet{border:1px solid var(--line-hi);border-radius:var(--r-lg)}}
.bonus-sum{border-radius:var(--r-md);border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--parch2)}
.gift-cell{border-radius:var(--r-md)}
.tabs{gap:6px}

/* battle */
.char-plate{font-weight:650;letter-spacing:-.01em;color:#fff;border:1px solid var(--line-hi);border-radius:999px;
  background:rgba(10,13,23,.72);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 6px 16px rgba(0,0,0,.45)}
.bars{border-radius:var(--r-md)}
.bar{height:10px;border-radius:999px;border:none;background:rgba(255,255,255,.1);box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
.bar .fill,.bar .ghost{border-radius:999px}
.bar .segs{display:none}
.bar.hp .fill{background:linear-gradient(90deg,#3ab88a,#7ff0bd)}
.bar.stag .fill{background:linear-gradient(90deg,#ffb23a,#ffe08a)}
.bar-lab{font-weight:650;letter-spacing:-.01em;color:var(--parch2)}
.bar-lab span:last-child,.bar-lab b{font-family:var(--display);color:var(--parch)}
.orb{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08)}
.orb.on{background:radial-gradient(circle at 35% 35%,#fff,var(--accent));box-shadow:0 0 10px rgba(var(--accent-rgb),.8);border-color:transparent}
.pip{border-bottom-color:rgba(255,255,255,.14)}
.turnchip{font-family:var(--display);font-weight:700;letter-spacing:.04em;color:var(--parch);
  padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.clash-ring{border:1px solid rgba(255,255,255,.12);box-shadow:0 0 36px rgba(var(--accent-rgb),.12),inset 0 0 36px rgba(0,0,0,.35)}
.clash .vs{color:#fff;font-weight:700;text-shadow:0 0 22px rgba(var(--accent-rgb),.9)}
.dmg{font-weight:700;letter-spacing:-.02em;color:#fff3d8;
  text-shadow:0 2px 0 rgba(0,0,0,.55),0 0 14px rgba(var(--accent-rgb),.85),0 0 28px rgba(255,100,70,.55)}
.dmg.hurt{color:#ff9d8f}
.dmg.stag{font-weight:700;letter-spacing:.02em}
.qpanel h4{font-family:var(--display);font-weight:700;letter-spacing:.14em;color:var(--accent);font-size:11px}
.qpanel .prompt{font-weight:600;letter-spacing:-.015em;line-height:1.6}
.qopts button{border-radius:var(--r-sm);border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--parch);
  font-weight:500;transition:transform .18s var(--ease),border-color .18s,background .18s}
.qopts button:hover{border-color:rgba(var(--accent-rgb),.6);background:rgba(var(--accent-rgb),.12);transform:translateY(-1px)}
.qopts button:active{transform:scale(.98)}
.result-banner .big{font-family:var(--display);font-weight:800;letter-spacing:-.02em;color:#fff}
.expl{border-radius:var(--r-sm);border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--parch2)}
.logbox{border-radius:10px;border-left:2px solid rgba(var(--accent-rgb),.5);background:rgba(8,10,18,.6)}
.learn-toast{border-radius:var(--r-md)}

/* paper combat pages (keep the paper, modernize the type) */
.card.paper,.ci-card.paper,.dpage.paper{border-radius:8px;border:1px solid rgba(90,62,30,.55)}
.card.paper .nm,.ci-card.paper .ci-name,.dpage.paper .nm{font-family:var(--sans);font-weight:800;letter-spacing:-.03em;color:#1c130a}
.card.paper .tx,.ci-card.paper .ci-text{font-weight:500;letter-spacing:-.01em}
.card.paper .dice,.card.paper .emo{font-family:var(--display);font-weight:700;letter-spacing:0}
.card .flavor,.ci-flavor,.dpage .flavor{font-style:normal;font-weight:500;letter-spacing:-.01em;color:#6a4a28}
.card .flavor:before,.ci-flavor:before{content:"“";font-family:var(--display)}
.card .flavor:after,.ci-flavor:after{content:"”";font-family:var(--display)}
.card .wax,.dpage .wax,.ci-card .wax{font-family:var(--display);font-weight:700}
.dpage.in:after{font-family:var(--sans);font-weight:700;letter-spacing:0;border-radius:4px;color:#1b1306;background:var(--accent)}
.dpage.in .card,.deck-slot:not(.empty) .card{box-shadow:0 0 0 2px var(--accent),0 10px 24px rgba(var(--accent-rgb),.3),1px 3px 8px rgba(0,0,0,.38)}
.ci-die{border-radius:8px}
.ci-card.paper .ci-meta .pill{border-radius:999px}
.ci-hint{letter-spacing:.02em}

/* deck / shelf / collection */
.deck-slot.empty{border:1.5px dashed rgba(255,255,255,.2);border-radius:8px;background:rgba(255,255,255,.04);color:var(--parch2);letter-spacing:0}
.deck-search,.deck-filters select{border-radius:var(--r-sm);border:1px solid var(--line-hi);background:rgba(255,255,255,.06);color:var(--parch);letter-spacing:-.01em}
.deck-search:focus,.deck-filters select:focus{outline:none;border-color:rgba(var(--accent-rgb),.7);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.15)}
.cost-curve .cc-track{border:none;border-radius:999px;background:rgba(255,255,255,.1)}
.cost-curve .cc-track i{border-radius:999px;background:linear-gradient(90deg,#d9964a,#ffdca0)}
.al-cell{border-radius:var(--r-sm);border:1px solid var(--line);background:rgba(255,255,255,.04)}
.al-cell.own{border-color:var(--line-hi);background:rgba(255,255,255,.07)}
.al-cell.eq{border-color:rgba(var(--accent-rgb),.7);box-shadow:0 0 18px rgba(var(--accent-rgb),.25)}
.credits-list a{color:var(--accent);text-underline-offset:3px}
.credits-list b{color:#fff}

/* subtle motion */
@keyframes trendRise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.scene.on .guest-card,.scene.on .book-item,.scene.on .key-item,.scene.on .gift-cell,.scene.on .al-cell,.scene.on .empty-state{
  animation:trendRise .38s var(--ease) both}
.scene.on .guest-card:nth-child(2),.scene.on .book-item:nth-child(2){animation-delay:.04s}
.scene.on .guest-card:nth-child(3),.scene.on .book-item:nth-child(3){animation-delay:.08s}
.scene.on .guest-card:nth-child(n+4),.scene.on .book-item:nth-child(n+4){animation-delay:.12s}
@media (prefers-reduced-motion:reduce){.scene.on *{animation-duration:.01ms!important}}
::selection{background:rgba(var(--accent-rgb),.3)}


/* ===== whole-stage battle framing: moderate characters standing on a stage ===== */
#scene-battle{--fig-h:clamp(90px,12.3vh,124px);--feet:clamp(214px,29vh,280px);--plate-h:26px}
.fighter{top:auto;bottom:calc(var(--feet) - var(--plate-h));height:calc(var(--fig-h) + var(--plate-h));
  width:calc(var(--fig-h) * .66);max-height:none}
.fighter.librarian{left:6%;right:auto}
.fighter.guest{right:6%;left:auto}
.fighter .char{flex:0 0 var(--fig-h);height:var(--fig-h);width:100%;min-height:0}
.fighter .char svg{height:100%;width:auto;max-width:100%}
.fighter:after{bottom:calc(var(--plate-h) - 12px);height:24px;width:92%}
.char-plate{min-width:0;width:100%;margin-top:0;height:var(--plate-h);line-height:calc(var(--plate-h) - 10px);padding:3px 10px;font-size:11px}
.clash,.clash-zone{top:calc(100% - var(--feet) - var(--fig-h) * .56)}
.clash-zone{width:min(34vw,170px);height:min(34vw,170px);opacity:.75}
@media (min-width:861px){
  #scene-battle{--fig-h:clamp(110px,15vh,170px);--feet:clamp(240px,29vh,300px)}
  .fighter.librarian{left:calc(50% - var(--fig-h) * .66 - 90px)}
  .fighter.guest{right:calc(50% - var(--fig-h) * .66 - 90px)}
}
@media (max-width:860px){
  .fighter.librarian{left:5%}.fighter.guest{right:5%}
  .char-plate{font-size:10px}
}
@media (max-height:780px) and (max-width:860px){#scene-battle{--fig-h:clamp(86px,12.3vh,112px);--feet:clamp(200px,28vh,232px)}}

/* curator stamp (TAK!) */
.tak-stamp{position:absolute;z-index:18;pointer-events:none;width:112px;height:112px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.02em;color:#fff3d8;
  border:3px solid rgba(255,236,200,.92);background:radial-gradient(circle,rgba(236,186,104,.28),rgba(236,186,104,.04) 70%);
  box-shadow:0 0 28px rgba(236,186,104,.75),inset 0 0 20px rgba(236,186,104,.45);
  text-shadow:0 0 14px rgba(236,186,104,.9);transform:translate(-50%,-50%);
  animation:takStamp .46s cubic-bezier(.2,.9,.2,1) forwards}
.tak-stamp:after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid rgba(255,236,200,.7);animation:takRing .46s ease-out forwards}
@keyframes takStamp{0%{opacity:0;transform:translate(-50%,-50%) scale(2)}20%{opacity:1;transform:translate(-50%,-50%) scale(.92)}36%{transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.06)}}
@keyframes takRing{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}

/* ===== result screen: full-screen scrim + centered glass card ===== */
.battle-stage.result-on .hud-top,.battle-stage.result-on .hand,.battle-stage.result-on .fighter,
.battle-stage.result-on .clash,.battle-stage.result-on .clash-zone,.battle-stage.result-on .logbox,
.battle-stage.result-on .pass-btn,.battle-stage.result-on .qpanel{opacity:0!important;visibility:hidden!important;pointer-events:none!important;transition:opacity .25s}

.result-banner{position:absolute;inset:0;left:0;top:0;transform:none;z-index:30;display:none;text-align:center}
.result-banner.on{display:flex;align-items:center;justify-content:center;padding:calc(var(--audio-top,10px) + var(--audio-btn,36px) + 8px) 14px 16px;
  background:rgba(6,8,16,.8);-webkit-backdrop-filter:blur(16px) saturate(1.1);backdrop-filter:blur(16px) saturate(1.1);
  animation:rbFade .3s ease both}
@keyframes rbFade{from{opacity:0}to{opacity:1}}
.rb-card{width:min(92vw,420px);max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:22px 20px 20px;border-radius:var(--r-lg);
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.015)),rgba(14,18,32,.86);
  border:1px solid var(--line-hi);box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.1);
  animation:rbPop .42s var(--ease) both}
@keyframes rbPop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.rb-eyebrow{display:inline-block;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.16em;color:var(--accent);
  padding:4px 12px;border-radius:999px;border:1px solid rgba(var(--accent-rgb),.35);background:rgba(var(--accent-rgb),.1)}
.rb-book{display:flex;justify-content:center;margin:14px 0 4px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.55)) drop-shadow(0 0 16px rgba(var(--accent-rgb),.35))}
.rb-book .bk-cover{width:76px;height:auto;display:block}.rb-book .bk-label{display:none}
.rb-title{font-size:26px;color:#fff;margin:6px 0 8px;letter-spacing:-.03em;line-height:1.2;word-break:keep-all}
.rb-msg{font-size:14px;line-height:1.65;color:var(--parch2);margin:0 auto;max-width:34em;word-break:keep-all;overflow-wrap:break-word;text-wrap:balance}
.rb-levelup{margin-top:10px;font-size:13px;font-weight:650;color:var(--hp)}
.rb-gift{display:flex;gap:12px;align-items:center;text-align:left;margin-top:16px;padding:12px 14px;border-radius:var(--r-md);
  background:rgba(var(--accent-rgb),.09);border:1px solid rgba(var(--accent-rgb),.32)}
.rb-gift.none{background:rgba(255,255,255,.04);border-color:var(--line)}
.rb-gift-ico{flex:0 0 auto;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  color:#1b1306;background:linear-gradient(180deg,#ffdca0,#ecba68);box-shadow:0 6px 16px rgba(var(--accent-rgb),.3)}
.rb-gift.none .rb-gift-ico{color:var(--parch2);background:rgba(255,255,255,.08);box-shadow:none}
.rb-gift-ico .ico{width:22px;height:22px}
.rb-gift-tx{min-width:0;display:flex;flex-direction:column;gap:2px}
.rb-gift-lab{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.02em}
.rb-gift-tx b{font-size:15px;color:#fff;font-weight:750;letter-spacing:-.02em;word-break:keep-all}
.rb-gift-tx small{font-size:12px;line-height:1.5;color:var(--parch2);word-break:keep-all}
.rb-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.rb-actions .btn{padding:13px 10px;font-size:14px;letter-spacing:-.01em}
.rb-actions .btn.primary{grid-column:1/-1;padding:15px 10px;font-size:15px}
.rb-actions.two .btn.primary{grid-column:auto}
.rb-card .expl{margin-top:12px;text-align:left}

/* ===== combat rework UI: stagger gauges, intent preview, resist table, floating numbers ===== */
.dmg{display:flex;flex-direction:column;align-items:center;gap:1px;transform:translateX(-50%);line-height:1}
.dmg span{display:block}
.dmg .dtag{font-style:normal;font-family:var(--sans);font-weight:800;font-size:10px;letter-spacing:0;padding:1px 6px;border-radius:999px;
  color:#1b1306;background:#ffd98a;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.dmg.hp{color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 14px rgba(255,255,255,.55)}
.dmg.hurt{color:#ff7a68;text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 14px rgba(255,80,60,.7)}
.dmg.stag{color:#ffd23f;font-size:24px;text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 12px rgba(255,200,40,.75)}
.dmg.stag .dtag{background:#ffd23f}
.dmg.rec{color:#7ff0bd;font-size:24px;text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 12px rgba(80,230,170,.7)}
.dmg.rec .dtag{background:#7ff0bd}
.dmg.hurt .dtag{background:#ff9d8f}
.bars.is-stag{border-color:rgba(255,200,64,.7)!important;box-shadow:0 0 0 1px rgba(255,200,64,.35),0 0 22px rgba(255,200,64,.28),0 12px 32px var(--shadow)}
.bars.is-stag #lab-pst,.bars.is-stag #lab-gst{color:#ffd23f;font-weight:800}
.bar.stag .fill{transition:width .3s ease-out}
.stag-badge{position:absolute;left:50%;top:-2px;transform:translate(-50%,-100%);z-index:5;white-space:nowrap;font-size:10px;font-weight:800;letter-spacing:0;
  color:#1b1306;background:linear-gradient(180deg,#ffe38a,#ffc43a);padding:3px 9px;border-radius:999px;opacity:0;visibility:hidden;box-shadow:0 4px 14px rgba(255,196,58,.45);transition:opacity .2s}
.stag-badge.on{opacity:1;visibility:visible}
.fighter.guest:has(.intent) .stag-badge{top:auto;bottom:calc(var(--plate-h) + 4px);transform:translate(-50%,0)}
.fighter.librarian .stag-badge{top:auto;bottom:calc(var(--plate-h) + 4px);transform:translate(-50%,0)}
.fighter.guest .char,.fighter.guest .char-plate{pointer-events:auto;cursor:pointer}
.state-note{position:absolute;left:50%;top:calc(100% - var(--feet) - var(--fig-h) - 28px);transform:translateX(-50%);z-index:9;
  padding:7px 16px;border-radius:999px;font-weight:750;font-size:13px;color:#1b1306;background:linear-gradient(180deg,#ffe38a,#ffc43a);box-shadow:0 8px 24px rgba(255,196,58,.4);pointer-events:none;white-space:nowrap}
/* intent preview above the guest */
.intent{position:absolute;right:0;bottom:calc(100% + 2px);width:max-content;max-width:min(62vw,240px);z-index:6;pointer-events:none;
  display:flex;flex-wrap:wrap;align-items:center;gap:3px 6px;
  padding:5px 8px;border-radius:10px;background:rgba(10,13,24,.82);border:1px solid var(--line-hi);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 10px 26px rgba(0,0,0,.5);text-align:left;transition:opacity .2s}
.intent .in-head{display:flex;align-items:center;gap:6px;min-width:0}
.intent .in-head b{font-size:13px;font-weight:800;letter-spacing:-.02em;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.intent .in-lab{font-size:9px;font-weight:800;letter-spacing:.08em;color:var(--accent);padding:1px 6px;border-radius:999px;border:1px solid rgba(var(--accent-rgb),.4);flex:0 0 auto}
.intent .in-star{font-size:10px;font-weight:800;color:#fff;padding:1px 7px;border-radius:999px;background:linear-gradient(180deg,#ff6a55,#c8321f);flex:0 0 auto;box-shadow:0 0 12px rgba(255,80,60,.7)}
.intent .in-ic{display:inline-flex;color:var(--accent);flex:0 0 auto}
.intent.big .in-ic{color:#ff8a78}
.intent .in-name{font-size:12px;font-weight:800;letter-spacing:-.02em;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:100%;flex:0 1 auto}
.intent .in-dice{display:inline-flex;flex-wrap:wrap;gap:3px;margin-left:auto}
.intent.down .in-head{display:flex;align-items:center;gap:6px}
.intent .in-die{display:inline-flex;align-items:center;gap:3px;font-family:var(--display);font-weight:600;font-size:11px;color:var(--parch);padding:2px 7px;border-radius:7px;background:rgba(255,255,255,.08);white-space:nowrap}
.intent .in-die b{font-family:var(--sans);font-weight:700}
.intent .in-die.t-방어{color:#8ff0c0}.intent .in-die.t-회피{color:#9bc3ff}
.intent .in-dmg{margin-top:6px;font-size:11px;font-weight:650;color:var(--parch2);white-space:nowrap;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.intent .in-dmg .hp{color:#ff9d8f;font-family:var(--display)}
.intent .in-dmg .st{color:#ffd23f;font-family:var(--display);display:inline-flex;align-items:center;gap:2px}
.intent .in-dmg .in-if{opacity:.75}
.intent .in-sub{margin-top:4px;font-size:11px;color:var(--parch2)}
.intent.big{border-color:rgba(255,90,70,.75);background:linear-gradient(180deg,rgba(80,14,10,.55),rgba(10,13,24,.86));
  box-shadow:0 0 0 1px rgba(255,90,70,.4),0 0 26px rgba(255,70,50,.5),0 10px 26px rgba(0,0,0,.5);animation:intentPulse 1.6s ease-in-out infinite}
@keyframes intentPulse{0%,100%{box-shadow:0 0 0 1px rgba(255,90,70,.4),0 0 18px rgba(255,70,50,.35),0 10px 26px rgba(0,0,0,.5)}50%{box-shadow:0 0 0 1px rgba(255,90,70,.7),0 0 34px rgba(255,70,50,.75),0 10px 26px rgba(0,0,0,.5)}}
.intent.down{border-color:rgba(255,200,64,.6)}
.battle-stage.rolling .intent{opacity:0}
.battle-stage.result-on .intent{display:none}
@media (min-width:861px){.intent{max-width:280px}}
/* key / short-answer question panel */
.qpanel.key{border-color:rgba(255,90,70,.7)!important;box-shadow:0 0 0 1px rgba(255,90,70,.35),0 0 32px rgba(255,70,50,.4),0 16px 40px rgba(0,0,0,.55)}
.q-key{display:inline-block;margin-left:6px;font-size:10px;font-weight:800;letter-spacing:0;color:#fff;padding:1px 8px;border-radius:999px;background:linear-gradient(180deg,#ff6a55,#c8321f)}
.qpanel.short{bottom:auto;top:calc(var(--audio-top,10px) + var(--audio-btn,36px) + 8px);max-height:calc(100% - 20px);overflow-y:auto;transform:translate(-50%,var(--vvy,0px));z-index:26;animation:none}
.qpanel.short .prompt{font-size:15px}
.short-form{display:flex;gap:8px;margin-top:2px}
.short-form input{flex:1;min-width:0;font:inherit;font-size:16px;font-weight:600;color:#fff;padding:12px 14px;border-radius:12px;
  border:1px solid var(--line-hi);background:rgba(255,255,255,.07);outline:none;letter-spacing:-.01em}
.short-form input::placeholder{color:var(--parch2);font-weight:450}
.short-form input:focus{border-color:rgba(var(--accent-rgb),.8);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.18)}
.short-form .btn{padding:12px 18px;flex:0 0 auto}
.q-hint{margin-top:8px}
.lt-you{display:block;font-size:11px;color:#ff9d8f;margin-bottom:3px;font-weight:600}
/* resist table */
.rgrid{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 8px;align-items:center;margin-top:8px}
.rg-h{font-size:10px;font-weight:800;color:var(--parch2);text-align:center;letter-spacing:.04em}
.rg-t{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--parch)}
.tier{display:flex;align-items:baseline;justify-content:center;gap:4px;padding:5px 6px;border-radius:9px;font-size:12px;font-weight:800;letter-spacing:-.01em;border:1px solid transparent;white-space:nowrap}
.tier i{font-style:normal;font-family:var(--display);font-weight:600;font-size:10px;opacity:.8}
.tier[data-t="치명"]{color:#fff;background:linear-gradient(180deg,#ff6a55,#c8321f)}
.tier[data-t="취약"]{color:#1b1306;background:linear-gradient(180deg,#ffd98a,#f0a93c)}
.tier[data-t="보통"]{color:var(--parch2);background:rgba(255,255,255,.06);border-color:var(--line)}
.tier[data-t="견딤"]{color:#bcd6ff;background:rgba(90,140,255,.16);border-color:rgba(120,160,255,.35)}
.tier[data-t="내성"]{color:#a9b8ff;background:rgba(110,100,255,.2);border-color:rgba(140,130,255,.45)}
.tier[data-t="면역"]{color:#d9c8ff;background:rgba(40,30,70,.7);border-color:rgba(190,160,255,.5)}
.resist-pop{position:absolute;inset:0;z-index:27;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(6,8,16,.55);
  opacity:0;visibility:hidden;transition:opacity .16s}
.resist-pop.on{opacity:1;visibility:visible}
.rp-card{width:min(92vw,360px);padding:16px 16px 14px;border-radius:var(--r-lg);background:rgba(14,18,32,.92)!important}
.rp-card h3{font-size:16px;color:#fff;margin-bottom:2px}
.sheet-resist{margin:10px 0 6px;padding:10px 12px 10px;border-radius:var(--r-md);background:rgba(255,255,255,.04);border:1px solid var(--line)}
.sr-title{font-weight:800;font-size:13px;color:#fff;letter-spacing:-.02em}
.sr-title small{font-weight:500;color:var(--parch2);margin-left:6px;font-size:11px}

/* ===== battle HUD v2: right-aligned guest panel, per-unit emotion pips, light chip above hand ===== */
.bars{position:relative}
.bars.left{box-shadow:inset 3px 0 0 rgba(var(--accent-rgb),.6),0 10px 28px var(--shadow)}
.bars.right{text-align:right;box-shadow:inset -3px 0 0 rgba(var(--accent-rgb),.6),0 10px 28px var(--shadow)}
.bars.right .bar-lab{flex-direction:row-reverse}
.bars.right .bar .ghost,.bars.right .bar .fill{left:auto;right:0}
.bars.right .bar-lab span:first-child{display:inline-flex;flex-direction:row-reverse;align-items:center;gap:4px}
.bars .bar-lab:first-child{font-size:12px;font-weight:700;color:var(--parch)}
.bars.left .bar-lab span:first-child{display:inline-flex;align-items:center;gap:4px}
.bars.left .bar-lab span:last-child,.bars.right .bar-lab span:last-child{font-variant-numeric:tabular-nums}
.bars .bar-lab{align-items:center;gap:8px}
.bars .bar{height:11px}
.emo-chip{position:absolute;top:-26px;left:50%;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:4px;padding:3px 9px 3px 8px;border-radius:999px;
  background:rgba(8,10,18,.62);border:1px solid rgba(var(--accent-rgb),.38);backdrop-filter:blur(4px);white-space:nowrap;pointer-events:none}
.emo-chip .pip{border-left-width:5px;border-right-width:5px;border-bottom-width:9px;transition:border-bottom-color .3s,filter .3s}
.emo-chip .pip.gain{animation:pipGain .95s ease-out}
.emo-chip small{font-size:10px;font-weight:700;color:var(--parch2);margin-left:2px}
@keyframes pipGain{0%{transform:scale(.3) translateY(4px);filter:brightness(3) drop-shadow(0 0 8px var(--gold))}55%{transform:scale(1.6) translateY(-2px)}100%{transform:scale(1) translateY(0)}}
.lightchip{position:absolute;left:12px;bottom:170px;z-index:8;display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;
  background:rgba(8,10,18,.68);border:1px solid rgba(var(--accent-rgb),.4);color:var(--gold2);font-size:12px;pointer-events:none;backdrop-filter:blur(4px)}
.lightchip b{font-family:var(--display);font-size:14px;font-weight:700;color:var(--parch);font-variant-numeric:tabular-nums}
.lightchip small{font-size:10px;color:var(--parch2)}
.lightchip.gain{animation:lightGain .9s ease-out}
.lightchip.spend{animation:lightSpend .6s ease-out}
@keyframes lightGain{0%{box-shadow:0 0 0 0 rgba(255,236,170,.9)}60%{box-shadow:0 0 0 9px rgba(255,236,170,0);transform:scale(1.08)}100%{box-shadow:0 0 0 0 transparent;transform:scale(1)}}
@keyframes lightSpend{0%{opacity:.5}100%{opacity:1}}
.battle-stage:has(.qpanel.on) .lightchip{opacity:0;visibility:hidden}
.battle-stage.result-on .lightchip{opacity:0!important;visibility:hidden!important}
@media (max-width:860px){ .lightchip{bottom:148px;left:8px} .emo-chip{padding:3px 7px} }

/* ===== floor carousel header ===== */
.floor-nav{display:flex;align-items:center;justify-content:space-between;gap:6px;flex:0 0 auto}
.fn-arrow{width:48px;height:48px;flex:0 0 48px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.04);border:1px solid rgba(var(--accent-rgb),.35);color:var(--gold2);cursor:pointer;transition:transform .15s,background .15s}
.fn-arrow svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.fn-arrow:hover{background:rgba(var(--accent-rgb),.16)}.fn-arrow:active{transform:scale(.92)}
.fn-title{flex:1;min-width:0;text-align:center}
.fn-count{font-size:10px;letter-spacing:.08em;color:var(--parch2);font-variant-numeric:tabular-nums}
.fn-name{font-size:20px;letter-spacing:.02em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fn-dots{position:relative;display:flex;align-items:center;justify-content:center;gap:0;height:16px;flex:0 0 auto;margin:-2px 0 2px}
.fn-dots:before{content:"";position:absolute;left:calc(50% - var(--fn-w,60px));right:calc(50% - var(--fn-w,60px));top:50%;height:1px;background:rgba(var(--accent-rgb),.35);transform:translateY(-.5px)}
.fn-dot{position:relative;width:26px;height:16px;display:grid;place-items:center;background:none;border:0;padding:0;cursor:pointer}
.fn-dot i{display:block;width:7px;height:7px;border-radius:99px;background:#2b2f3c;border:1px solid rgba(var(--accent-rgb),.55);transition:width .25s,background .25s}
.fn-dot.on i{width:22px;background:var(--gold);border-color:var(--gold)}
.fn-dot.tiny i{width:4px;height:4px;opacity:.7}
.floor-swipe{display:flex;flex-direction:column;gap:12px;flex:1 1 auto;min-height:0;touch-action:pan-y}
.floor-swipe.slide-in-r,.fn-title.slide-in-r{animation:fnInR .34s cubic-bezier(.2,.8,.2,1)}
.floor-swipe.slide-in-l,.fn-title.slide-in-l{animation:fnInL .34s cubic-bezier(.2,.8,.2,1)}
.floor-swipe.slide-out-l,.fn-title.slide-out-l{animation:fnOutL .15s ease-in forwards}
.floor-swipe.slide-out-r,.fn-title.slide-out-r{animation:fnOutR .15s ease-in forwards}
@keyframes fnInR{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes fnInL{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
@keyframes fnOutL{to{opacity:0;transform:translateX(-36px)}}
@keyframes fnOutR{to{opacity:0;transform:translateX(36px)}}
@media (max-width:860px){ .fn-arrow{width:48px;height:48px} .fn-name{font-size:17px} }

.die{position:relative}
.die.keeps svg rect:first-of-type{stroke:#9fd0ff;filter:drop-shadow(0 0 7px rgba(140,200,255,.85))}
.die.reused svg{filter:drop-shadow(0 0 6px rgba(140,200,255,.55))}
.reuse-tag{position:absolute;left:50%;top:-8px;transform:translateX(-50%);padding:1px 8px;border-radius:999px;background:rgba(40,80,120,.9);border:1px solid #9fd0ff;color:#dff0ff;font-size:10px;font-weight:700;letter-spacing:0;white-space:nowrap;pointer-events:none;animation:reuseTag .5s ease-out}
@keyframes reuseTag{from{opacity:0;transform:translate(-50%,6px) scale(.8)}to{opacity:1;transform:translate(-50%,0) scale(1)}}

.qn-small{font-family:var(--body,inherit);font-size:11px;font-weight:600;color:var(--parch2);opacity:.75;letter-spacing:0;margin-left:4px;vertical-align:middle}
.sheet-top{position:relative}
.sheet-books{position:absolute;right:0;bottom:0;display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:rgba(8,10,18,.68);border:1px solid rgba(var(--accent-rgb),.4);color:var(--gold2);font-size:12px;pointer-events:none}
.sheet-books b{font-family:var(--display);font-size:14px;font-weight:700;color:var(--parch);font-variant-numeric:tabular-nums}

#scene-title .credits-link{position:absolute;right:max(10px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));min-width:56px;min-height:44px;padding:0 10px;display:flex;align-items:center;justify-content:flex-end;background:none;border:0;box-shadow:none;border-radius:0;color:var(--parch2);opacity:.6;font:inherit;font-size:11px;letter-spacing:.02em;text-decoration:underline;text-underline-offset:3px;cursor:pointer;-webkit-tap-highlight-color:transparent}
#scene-title .credits-link:hover,#scene-title .credits-link:focus-visible{opacity:.95}

.burn-ov{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.96);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .18s ease;padding:max(24px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));overflow-y:auto;cursor:pointer}
.burn-ov.on{opacity:1}
.burn-x{position:absolute;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.burn-in{width:100%;max-width:420px;margin:auto;text-align:center}
.burn-sub{color:var(--parch2);font-size:12px;letter-spacing:.04em;margin-bottom:6px}
.burn-title{font-family:var(--display);font-size:28px;font-weight:700;color:var(--gold2,#e9c46a);margin:0 0 22px;text-shadow:0 0 18px rgba(233,196,106,.45);animation:burnTitle .4s ease-out both}
.burn-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;justify-items:stretch}
.burn-card{position:relative;padding:26px 12px 14px;border-radius:14px;background:#14161f;border:1.5px solid #3a4054;text-align:center;opacity:0;animation:burnCard .42s cubic-bezier(.2,.9,.3,1.2) calc(.25s + var(--i)*.14s) both}
.burn-card .bk-tag{position:absolute;top:9px;left:10px;font-size:10px}
.burn-card.r-R{border-color:#4a7fc0}.burn-card.r-SR{border-color:#9a63c8;box-shadow:0 0 14px rgba(154,99,200,.3)}
.burn-card.r-SSR{border-color:#e0a82a;box-shadow:0 0 18px rgba(224,168,42,.45)}
.burn-card.r-key{border-color:#e35a70;box-shadow:0 0 20px rgba(227,90,112,.5);background:linear-gradient(180deg,#2a1219,#14161f)}
.burn-new,.burn-dup{position:absolute;top:8px;right:10px;font:700 10px/1 "Space Grotesk",system-ui;padding:3px 7px;border-radius:99px}
.burn-new{background:#e9c46a;color:#1a1204;box-shadow:0 0 10px rgba(233,196,106,.7);animation:burnNew 1.1s ease-in-out infinite}
.burn-dup{background:#2a2f40;color:#aab}
.burn-nm{font-size:15px;font-weight:700;color:#fff;line-height:1.3;word-break:keep-all;margin-top:4px}
.burn-meta{margin-top:8px;font-size:11px;color:var(--parch2)}
.burn-n{font-family:var(--display);font-size:15px;color:#e9c46a}
.burn-hint{margin-top:22px;font-size:11px;color:rgba(255,255,255,.45)}
.burn-book{position:relative;width:96px;margin:0 auto 10px;display:flex;justify-content:center}
.burn-book .bk-cover{width:88px;height:auto;display:block;animation:burnBook .95s ease forwards}
.burn-book .bk-label{display:none}
.burn-book:after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:4px;background:linear-gradient(180deg,transparent 25%,rgba(255,130,40,.28) 65%,rgba(40,8,0,.72));mix-blend-mode:multiply;animation:burnMask .95s ease forwards}
@keyframes burnBook{0%{filter:none;opacity:1}55%{filter:brightness(1.18) sepia(.4) saturate(1.45) hue-rotate(-12deg)}100%{filter:brightness(.42) sepia(.75) saturate(.95) hue-rotate(-18deg);opacity:.62}}
@keyframes burnMask{0%{opacity:0}100%{opacity:1}}
@keyframes burnCard{0%{opacity:0;transform:translateY(18px) scale(.8) rotate(-3deg)}100%{opacity:1;transform:none}}
@keyframes burnTitle{0%{opacity:0;transform:scale(1.25)}100%{opacity:1;transform:none}}
@keyframes burnNew{50%{box-shadow:0 0 16px rgba(233,196,106,1)}}
@media (prefers-reduced-motion:reduce){.burn-card,.burn-title,.burn-new,.burn-book .bk-cover,.burn-book:after{animation:none;opacity:1}}

/* 신규 손님 아트 (사제/기사/기계) */
.gx .e0,.gx .e1,.gx .e2{display:none}
.gx[data-ex="e0"] .e0,.gx[data-ex="e1"] .e1,.gx[data-ex="e2"] .e2{display:inline}
.gx .g-circle{animation:gxPulse 3s ease-in-out infinite}
.gx .g-pp{animation:gxFloat 3.4s ease-in-out infinite}.gx .g-pp.g-fl{animation:gxFloat 2.2s ease-in-out infinite,gxFlick 1.7s steps(2) infinite}
.gx .g-pp:nth-child(2n){animation-duration:4.1s}.gx .g-pp:nth-child(3n){animation-duration:2.9s}
.gx .g-spark{animation:gxTw 2.4s ease-in-out infinite}
.gx .g-orb{animation:gxPulse 2.2s ease-in-out infinite}
.gx .g-halo{transform-origin:140px 90px;animation:gxPulse 3.4s ease-in-out infinite}
.gx .g-lean{transform-origin:140px 410px;animation:gxSway 2.6s ease-in-out infinite}
.gx .g-flail{animation:gxFlailR 1.4s ease-in-out infinite}.gx .g-flailL{animation:gxFlailL 1.7s ease-in-out infinite}
.gx .g-glitch{animation:gxGlitch 1.8s steps(1) infinite;opacity:0}
.gx .g-trail{opacity:0}
.gx-priest .g-arm{transform-origin:170px 184px}
@keyframes gxFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes gxFlick{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes gxPulse{0%,100%{opacity:1}50%{opacity:.62}}
@keyframes gxTw{0%,100%{opacity:.25;transform:scale(.6)}50%{opacity:1;transform:scale(1.15)}}
@keyframes gxSway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
@keyframes gxFlailR{0%,100%{transform:rotate(120deg)}50%{transform:rotate(150deg)}}
@keyframes gxFlailL{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(-62deg)}}
@keyframes gxGlitch{0%,100%{opacity:0}20%{opacity:.8;transform:translateX(6px)}40%{opacity:0}70%{opacity:.7;transform:translateX(-5px)}}
/* 공격 모션 */
.fighter.guest.atk .gx-priest .g-arm{animation:gxCast .6s ease-out}
.fighter.guest.atk.big .gx-priest .g-arm{animation:gxRaise .75s ease-out}
.fighter.guest.atk .gx-priest .g-act{animation:gxBook .6s ease-out}
.fighter.guest.atk .gx-priest .g-papers{animation:gxFly .6s ease-out}
.fighter.guest.atk .gx-knight .g-wpn{animation:gxSlash .6s ease-in-out}
.fighter.guest.atk .gx-knight .g-trail,.fighter.guest.atk .gx-machine .g-trail{animation:gxTrail .6s ease-out}
.fighter.guest.atk.big .gx-knight .g-wpn{animation:gxStab .7s ease-in-out}
.fighter.guest.atk.big .gx-knight .g-lunge,.fighter.guest.atk.big .gx-machine .g-lunge{animation:gxLunge .7s ease-in-out}
.fighter.guest.atk .gx-machine .g-wpn{animation:gxSlash .6s ease-in-out}
.fighter.guest.atk.big .gx-machine .g-wpn{animation:gxStab .7s ease-in-out}
/* 피격 이펙트: 후광 번쩍임, 책장 폭발 */
.fighter.guest.hit .gx .g-halo{animation:gxHalo .45s ease-out}
.fighter.guest.hit .gx .g-papers{animation:gxBurst .5s ease-out}
@keyframes gxCast{0%{transform:rotate(0)}35%{transform:rotate(80deg)}100%{transform:rotate(0)}}
@keyframes gxRaise{0%{transform:rotate(0)}40%{transform:rotate(155deg)}70%{transform:rotate(155deg)}100%{transform:rotate(0)}}
@keyframes gxBook{0%{transform:translateY(0)}40%{transform:translateY(-14px)}100%{transform:translateY(0)}}
@keyframes gxFly{0%{transform:translateX(0)}40%{transform:translateX(-46px)}100%{transform:translateX(0)}}
@keyframes gxSlash{0%{transform:rotate(0)}25%{transform:rotate(28deg)}60%{transform:rotate(-112deg)}100%{transform:rotate(0)}}
@keyframes gxStab{0%{transform:rotate(0)}30%{transform:rotate(-84deg)}60%{transform:rotate(-84deg) translateX(-34px)}100%{transform:rotate(0)}}
@keyframes gxLunge{0%{transform:translateX(0)}50%{transform:translateX(-26px)}100%{transform:translateX(0)}}
@keyframes gxTrail{0%{opacity:0}35%{opacity:.9}100%{opacity:0}}
@keyframes gxHalo{0%{transform:scale(1);opacity:1}40%{transform:scale(1.55);opacity:.9;filter:brightness(2)}100%{transform:scale(1);opacity:1}}
@keyframes gxBurst{0%{transform:scale(1)}40%{transform:scale(1.35) rotate(6deg);opacity:.7}100%{transform:scale(1)}}
/* 다대다 적 아트 (인간형/기계인간형/꼭두각시형): 표정 4개, 맞으면 휘청, 흐트러지면 무너짐, 꼭두각시는 줄에 매달려 흔들림 */
.gx[data-ex="e3"] .e3{display:inline}.gx .e3{display:none}
.gxn .g-flare,.gxn .g-arc,.gxn .g-thrust{opacity:0}
.gxn .g-hang{transform-origin:140px -300px;animation:gxnHang 3.2s ease-in-out infinite}
.gxn .g-lead{animation:gxPulse 3.6s ease-in-out infinite}
.gxn .g-body{transition:transform .3s}
.gxn.down .g-body{transform:translate(58px,6px) rotate(-70deg) scale(.5)}
.gxn.down .g-hang{animation:none}
.gx-puppet.down .g-strings{opacity:0}
.gxn.down .g-halo,.gxn.down .g-lead,.gxn.down .g-flare{visibility:hidden}
.gxn.down .g-sway{animation:none}
@keyframes gxnHang{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
@keyframes gxnBend{0%{transform:none}30%{transform:rotate(9deg) skewX(-6deg) scaleY(.94)}65%{transform:rotate(-4deg)}100%{transform:none}}
@keyframes gxnDown{0%{transform:none}35%{transform:rotate(10deg) scaleY(.9)}100%{transform:translate(58px,6px) rotate(-70deg) scale(.5)}}
@keyframes gxnSnap{0%{opacity:1;transform:none}40%{opacity:1;transform:translateY(-30px) scaleY(.6)}100%{opacity:0;transform:translateY(-80px) scaleY(.2)}}
@keyframes gxnFade{to{opacity:0}}
@keyframes gxnSwing{0%{transform:rotate(0)}25%{transform:rotate(-40deg)}60%{transform:rotate(70deg)}100%{transform:rotate(0)}}
@keyframes gxnThrust{0%{transform:none}30%{transform:rotate(58deg) translate(4px,0)}55%{transform:rotate(58deg) translate(0,46px)}100%{transform:none}}
@keyframes gxnSmash{0%{transform:rotate(0)}35%{transform:rotate(150deg)}55%{transform:rotate(-20deg)}100%{transform:rotate(0)}}
@keyframes gxnRaise{0%{transform:none}35%{transform:translate(-22px,-26px) scale(1.15)}75%{transform:translate(-22px,-26px) scale(1.15)}100%{transform:none}}
@keyframes gxnBrace{0%,100%{transform:none}35%,75%{transform:translateX(8px) skewX(4deg)}}
@keyframes gxnCast{0%{transform:none;opacity:1}45%{transform:translate(-60px,-14px) rotate(-8deg);opacity:1}100%{transform:none;opacity:1}}
@keyframes gxnFloat{0%{transform:none}45%{transform:translateY(-34px) scale(1.12)}100%{transform:none}}
@keyframes gxnFlare{0%{opacity:0;transform:scale(.6)}35%{opacity:1;transform:scale(1.25)}100%{opacity:0;transform:scale(1.5)}}
@keyframes gxnLine{0%{opacity:0}30%{opacity:.95}100%{opacity:0}}
/* 다대다 무대: 주사위 종류별 동작 (BattleStage.clash 가 .bs-unit 에 m-* 를 붙임) */
.bs-unit.m-slash .gxn .g-wpn{animation:gxnSwing .55s ease-in-out}
.bs-unit.m-slash .gxn .g-trail{animation:gxnLine .55s ease-out}
.bs-unit.m-pierce .gxn .g-wpn{animation:gxnThrust .55s ease-in-out}
.bs-unit.m-pierce .gxn .g-thrust{animation:gxnLine .5s ease-out .12s}
.bs-unit.m-blunt .gxn .g-wpn{animation:gxnSmash .6s ease-in-out}
.bs-unit.m-blunt .gxn .g-arc{animation:gxnLine .6s ease-out .15s}
.bs-unit.m-blunt .gx-automaton .g-flare{animation:gxnFlare .6s ease-out}
.bs-unit.m-slash .gxn.v-knowledge .g-act,.bs-unit.m-pierce .gxn.v-knowledge .g-act,.bs-unit.m-blunt .gxn.v-knowledge .g-act{animation:gxBook .55s ease-out}
.bs-unit.m-slash .gxn.v-knowledge .g-papers,.bs-unit.m-pierce .gxn.v-knowledge .g-papers,.bs-unit.m-blunt .gxn.v-knowledge .g-papers,
.bs-unit.m-slash .gx-automaton .g-papers,.bs-unit.m-pierce .gx-automaton .g-papers{animation:gxnCast .55s ease-out}
.bs-unit.m-slash .gx-puppet .g-arm,.bs-unit.m-pierce .gx-puppet .g-arm{animation:gxnSwing .55s ease-in-out}
.bs-unit.m-blunt .gx-puppet .g-armL{animation:gxnSmash .6s ease-in-out}
.bs-unit.m-guard .gxn .g-body,.bs-unit.m-evade .gxn .g-body{animation:gxnBrace .55s ease-out}
.bs-unit.m-guard .gxn .g-act,.bs-unit.m-guard .gxn .g-wpn{animation:gxnRaise .55s ease-out}
.bs-unit.m-guard .gxn .g-papers,.bs-unit.m-evade .gxn .g-papers{animation:gxnCast .55s ease-out}
.bs-unit.m-page .gxn .g-papers,.bs-unit.m-page .gxn .g-act{animation:gxnFloat .6s ease-out}
.bs-unit.m-page .gxn .g-halo{animation:gxHalo .6s ease-out}
.bs-unit.lose .gxn .g-body,.bs-unit.flinch .gxn .g-body{animation:gxnBend .45s ease-out}
.bs-unit.lose .gxn .g-papers,.bs-unit.flinch .gxn .g-papers{animation:gxBurst .5s ease-out}
.bs-unit.falling .gxn.down .g-body{animation:gxnDown .55s ease-in .3s backwards}
.bs-unit.falling .gx-puppet.down .g-strings{animation:gxnSnap .4s ease-out .25s backwards;opacity:0}
.bs-unit.dying .gxn .g-body{animation:gxnDown .55s ease-in .3s forwards}
.bs-unit.dying .gx-puppet .g-strings{animation:gxnSnap .4s ease-out .25s forwards}
/* 한 명씩 싸우는 화면(.fighter.guest)에서도 같은 동작 */
.fighter.guest.atk .gxn .g-wpn{animation:gxnSwing .6s ease-in-out}
.fighter.guest.atk .gxn .g-trail{animation:gxnLine .6s ease-out}
.fighter.guest.atk.big .gxn .g-wpn{animation:gxnSmash .7s ease-in-out}
.fighter.guest.atk.big .gxn .g-arc{animation:gxnLine .7s ease-out .15s}
.fighter.guest.atk.big .gx-automaton .g-flare{animation:gxnFlare .7s ease-out}
.fighter.guest.atk .gxn.v-knowledge .g-act{animation:gxBook .6s ease-out}
.fighter.guest.atk .gxn.v-knowledge .g-papers,.fighter.guest.atk .gx-automaton .g-papers{animation:gxnCast .6s ease-out}
.fighter.guest.atk .gx-puppet .g-arm{animation:gxnSwing .6s ease-in-out}
.fighter.guest.hit .gxn .g-body{animation:gxnBend .45s ease-out}
@media (prefers-reduced-motion:reduce){.gxn .g-body{transition:none}}
@media (prefers-reduced-motion:reduce){.gx *{animation:none!important}}

/* 전투 HUD 정렬: 사서 = 왼쪽 정렬(채움 왼→오), 손님 = 오른쪽 정렬(채움 오→왼, 텍스트·숫자 미러) */

.bk-btns-c{justify-content:center;display:flex;gap:8px;flex-wrap:wrap}
.bk-empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:34px 18px 28px;text-align:center}
.bk-empty-ico{opacity:.32}.bk-empty-ico svg{width:64px;height:64px;fill:none;stroke:var(--parch2);stroke-width:1.2}
.bk-empty-t{font-size:16px;font-weight:700;color:var(--parch)}
.bk-empty-s{font-size:12px;color:var(--parch2);opacity:.8;margin-bottom:6px}
/* 손님 정보: 책장 수집 현황 */
.gcoll{display:flex;align-items:center;flex-wrap:wrap;gap:3px 8px;margin:4px 0 0;font-size:11px;color:var(--parch2);white-space:nowrap}
.gcoll b{font-family:var(--display);color:var(--parch);font-variant-numeric:tabular-nums}.gcoll b.ok{color:#7ee2a8}
.gc-pips{display:inline-flex;gap:3px}.gc-pips i{width:7px;height:7px;border-radius:2px;border:1px solid rgba(var(--accent-rgb),.45);opacity:.6}
.gc-pips i.on{opacity:1;background:linear-gradient(180deg,#ffd98a,#f0a93c);border-color:transparent}.gc-pips i.on.k{background:linear-gradient(180deg,#ff9aa8,#d9455c)}
.sheet-coll{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;margin:2px 0 0;font-size:12px;color:var(--parch2)}
.sheet-coll b{font-family:var(--display);color:var(--parch);font-variant-numeric:tabular-nums}.sheet-coll b.ok{color:#7ee2a8}
.sc-cells{display:inline-flex;gap:4px}
.cc-cell{font-style:normal;min-width:22px;height:18px;padding:0 4px;display:inline-grid;place-items:center;border-radius:5px;font:700 9px/1 "Space Grotesk",system-ui;border:1px solid rgba(var(--accent-rgb),.3);color:var(--parch2);opacity:.55}
.cc-cell.on{opacity:1;color:#1b1306;background:linear-gradient(180deg,#ffd98a,#f0a93c);border-color:transparent}
.cc-cell.k.on{background:linear-gradient(180deg,#ff9aa8,#d9455c);color:#fff}
.ci-prev-r{flex:0 0 auto;margin-left:auto}
.ci-vsrow .ci-first{margin-left:auto}
.ci-die{flex-wrap:nowrap}
.dprev{margin-left:0}
.card.mini .dice .dprev{flex-direction:column;gap:0;line-height:1.15;font-size:9px}

/* 장서복/기프트: 좌우 카드 정렬 + 6개 단위 세로 스크롤 */
.dress-top{align-items:stretch;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.dress-char{display:flex;flex-direction:column;padding:12px 10px 10px}
.dress-char .dc-head{margin:0 2px 8px;flex:0 0 auto}
.dc-stage{flex:1 1 auto;min-height:190px;aspect-ratio:auto}
.dc-name{flex:0 0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dress-side{display:flex;flex-direction:column;padding:12px 10px 10px;border-radius:var(--r-lg);background:rgba(8,10,18,.55);position:relative;min-width:0}
.dress-side .dress-head{margin:0 2px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dress-gridwrap{box-sizing:border-box;padding:6px;scroll-padding:6px;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-y;flex:0 0 auto}
.dress-gridwrap::-webkit-scrollbar{display:none}
.dress-gridwrap.paged{scroll-snap-type:y mandatory}
.dress-gridwrap .dtile.snap{scroll-snap-align:start}
.dress-grid.g2{gap:10px}
.dress .dtile{touch-action:pan-y}
.dress-foot{margin-top:auto;padding-top:6px;display:flex;flex-direction:column;gap:3px}
.dress-pg{display:flex;align-items:center;justify-content:center;gap:5px;min-height:10px;font-size:10px;color:var(--parch2)}
.dress-pg i{width:6px;height:6px;border-radius:99px;background:#2b2f3c;border:1px solid rgba(var(--accent-rgb),.55)}
.dress-pg i.on{background:var(--gold,#e9c46a);width:14px}
.dress-pg span{margin-left:4px;font-variant-numeric:tabular-nums}
.dress-tip{margin-top:0;font-size:10.5px;text-align:center}
.dd-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd-head .gold-title{min-width:0}
.dress-char .dc-stage svg{max-height:100%}

/* =====================================================================
   LANDSCAPE PHONES — 가로 모드 (높이가 낮은 가로 화면). 세로 화면 규칙은 그대로.
   ===================================================================== */
:root{--safe-left:env(safe-area-inset-left, 0px);--safe-right:env(safe-area-inset-right, 0px);--rail-w:0px}
@media (orientation:landscape) and (max-height:500px){
  :root{--rail-w:68px;--audio-top:6px;--audio-btn:30px;--nav-h:0px;--panel-pad-bottom:calc(14px + var(--safe-bottom));
        --inspect-top:44px;--inspect-bottom:12px}
  #audio-toggles{top:var(--audio-top);right:calc(8px + var(--safe-right))}
  #audio-toggles .btn,#audio-toggles button{width:30px;height:30px}
  /* ---- 하단 내비 → 왼쪽 세로 레일 ---- */
  .botnav{top:0;bottom:0;left:0;right:auto;width:calc(var(--rail-w) + var(--safe-left));flex-direction:column;justify-content:center;align-items:stretch;
    gap:10px;padding:10px 8px calc(10px + var(--safe-bottom)) calc(8px + var(--safe-left));
    background:linear-gradient(90deg,rgba(7,8,13,.96) 0%,rgba(7,8,13,.9) 70%,transparent 100%)}
  .botnav .btn{flex:0 0 auto;max-width:none;width:100%;min-width:0;height:48px;padding:0 2px;font-size:12px;border-radius:12px}
  .botnav.away{transform:translateX(-120%)}
  #scene-lobby,.panel-scene{padding:6px calc(10px + var(--safe-right)) 0 calc(var(--rail-w) + var(--safe-left) + 8px)}
  #scene-lobby{padding-bottom:calc(8px + var(--safe-bottom))}
  .topbar{padding:0 84px 4px 0;min-height:calc(var(--audio-top) + var(--audio-btn));gap:4px 8px}
  .page-scroll{padding-bottom:var(--panel-pad-bottom)}
  /* ---- 로비: 왼쪽 층 정보, 오른쪽 손님 목록 ---- */
  .lobby-grid{flex:1 1 auto;min-height:0}
  .floor-nav{gap:4px}
  .fn-arrow{width:36px!important;height:36px!important;flex:0 0 36px!important}
  .fn-name{font-size:15px!important}
  .fn-count{font-size:10px}
  .fn-dots{margin:2px auto 4px}
  .floor-swipe{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:10px}
  .floor-hero{height:auto!important;min-height:0}
  .floor-hero .cap{right:auto!important;left:0;bottom:0;top:auto;max-width:100%}
  .guests{min-height:0;overflow-y:auto;gap:8px}
  .guest-card{padding:6px 8px}
  .guest-card svg{width:52px;height:64px}
  /* ---- 손님 정보 시트: 오른쪽 패널 ---- */
  .guest-sheet{left:auto;right:calc(8px + var(--safe-right));top:calc(var(--audio-top) + var(--audio-btn) + 6px);bottom:8px;width:min(560px,64vw);max-height:none;border-radius:var(--r-lg);
    border:1px solid var(--line-hi);transform:translateX(calc(100% + 24px));padding:0 14px calc(12px + var(--safe-bottom))}
  .guest-sheet.on{transform:none}
  .sheet-handle{display:none}
  /* ---- 도서관 하위 탭 ---- */
  .shelf-tabs{margin:0 0 8px;padding:3px}
  .shelf-tab{padding:7px 6px;font-size:12px}
  /* ---- 장서복 / 에고 기프트: 미리보기 · 그리드 · 상세를 가로로 ---- */
  .dress{max-width:none;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:10px;align-items:stretch}
  .dress-top{--tile:clamp(52px,calc((100dvh - 178px) / 3),92px);grid-template-columns:minmax(0,1fr) auto;gap:10px}
  .dress-side .dress-grid.g2{grid-template-columns:repeat(2,var(--tile));gap:8px;justify-content:center}
  .dress-side{padding:8px 8px 6px}
  .dress-char{padding:8px 8px 6px}
  .dress-tip{display:none}
  .dress-detail{margin-top:0;min-height:0;padding:12px 14px}
  .dd-actions{margin-top:8px}.dd-actions .btn{padding:9px 10px}
  .dd-lines{font-size:12px;gap:3px}
  /* ---- 덱 편집기: 더 넓은 그리드 ---- */
  #deck-pool.item-grid{grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:8px}
  .deck-slots{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
  /* ---- 책 소각 결과 ---- */
  .burn-ov{padding:10px calc(14px + var(--safe-right)) 10px calc(14px + var(--safe-left))}
  .burn-cards{grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:8px}
  .burn-card{padding:20px 10px 10px}
  .burn-title{font-size:24px!important;margin:2px 0 8px!important}
  .burn-hint{margin-top:8px!important}
  .burn-book{width:64px;margin:0 auto 4px}
  .burn-book .bk-cover{width:60px}
  /* ---- 결과 카드: 두 단 ---- */
  .result-banner.on{padding:8px calc(var(--audio-btn,36px) * 2 + 26px + var(--safe-right)) 8px calc(12px + var(--safe-left))}
  .rb-card{width:min(94vw,760px);padding:14px 18px;display:grid;grid-template-columns:200px minmax(0,1fr);column-gap:18px;align-items:center;text-align:center}
  .rb-card>*{grid-column:2}
  .rb-card>.rb-eyebrow,.rb-card>.rb-book,.rb-card>.rb-title{grid-column:1;justify-self:center}
  .rb-card>.rb-eyebrow{grid-row:1}.rb-card>.rb-book{grid-row:2;margin:6px 0 0}.rb-card>.rb-title{grid-row:3;font-size:21px;margin:4px 0 0}
  .rb-card.lose>.rb-title{grid-row:2}
  .rb-card>.rb-msg{grid-row:1;align-self:end;margin:0}
  .rb-card .rb-book .bk-cover{width:60px;height:auto}
  .rb-gift{margin-top:8px;padding:8px 10px}
  .rb-actions{margin-top:10px}.rb-actions .btn{padding:10px 8px}.rb-actions .btn.primary{padding:11px 8px}
  .rb-card .expl{margin-top:8px;max-height:44vh;overflow:auto}

  /* ---- 전투: 무대가 주인공. 위는 얇은 HUD, 양옆에 인물(무대 폭의 ~1/6), 가운데 아래에 손패 ---- */
  #scene-battle{--fig-h:min(calc((100vw - var(--safe-left) - var(--safe-right)) * .167 / .66), calc(100dvh - 140px));--feet:22px;--plate-h:22px}
  .hud-top{top:6px;left:calc(8px + var(--safe-left));right:calc(84px + var(--safe-right));gap:8px;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
  .turnchip{grid-column:2;order:0;margin:0!important;font-size:11px;line-height:1.25;white-space:nowrap}
  .bars{padding:5px 9px 6px}
  .bars .bar-lab{font-size:10px!important;line-height:1.2}
  .bars .bar-lab[style]{margin-top:2px!important}
  .bars .bar{height:7px}
  .fighter{width:calc(var(--fig-h) * .66)}
  .fighter.librarian{left:calc(2% + var(--safe-left))}
  .fighter.guest{right:calc(2% + var(--safe-right))}
  .char-plate{font-size:10px;line-height:12px}
  .emo-chip{top:-22px;padding:2px 7px}
  .intent{right:calc(100% + 6px);left:auto;bottom:auto;top:-4px;transform:none;max-width:min(30vw,230px);padding:4px 8px}
  .hand{left:calc(var(--fig-h) * .66 + 3% + var(--safe-left));right:calc(var(--fig-h) * .66 + 3% + var(--safe-right));bottom:calc(16px + var(--safe-bottom));height:min(40dvh,146px)}
  .hand .cc{width:84px;height:122px}
  .lightchip{left:calc(var(--fig-h) * .66 + 3% + var(--safe-left));bottom:auto;top:calc(100% - min(40dvh,146px) - 46px)}
  .pilebox{right:calc(var(--fig-h) * .66 + 3% + var(--safe-right));bottom:auto;top:calc(100% - min(40dvh,146px) - 46px)}
  .pass-btn{bottom:auto;top:calc(100% - min(40dvh,146px) - 50px)}
  .clash,.clash-zone{top:calc(50% - 20px)}
  .state-note{top:52px}
  .learn-toast{left:calc(var(--fig-h) * .66 + 4%);right:auto;width:min(380px,46vw);bottom:auto;top:56px}
  /* 문제: 무대 위 가운데, 지문 왼쪽 · 보기 2×2 오른쪽 — 스크롤 없이 */
  .qpanel{left:50%;top:50px;bottom:auto;transform:translateX(-50%);width:min(760px,calc(100% - 24px - var(--safe-left) - var(--safe-right)));
    max-height:calc(100% - 58px);overflow:auto;padding:10px 12px}
  .qpanel #qinner{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);column-gap:12px;align-items:center}
  .qpanel #qinner>h4{grid-column:1/-1;margin-bottom:6px}
  .qpanel .prompt{font-size:14px;line-height:1.5;margin:0}
  .qpanel .qopts{grid-template-columns:1fr 1fr;gap:6px}
  .qpanel .qopts button{padding:8px 10px;font-size:12.5px;line-height:1.35}
  .qpanel.short #qinner{display:block}
  .qpanel.short .prompt{margin-bottom:8px}
  .qpanel.short{top:calc(var(--audio-top) + var(--audio-btn) + 4px)}
  .card-inspect{padding:44px 8px 10px}
  .ci-card{max-height:100%;overflow:auto}

  /* 책 탭: 책 그림 왼쪽, 수량·소각 버튼 오른쪽 */
  #scene-shelf .page-scroll>h2.gold-title{display:none}
  #scene-shelf .page-scroll>p.gmeta{margin-bottom:6px!important;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bk-slide{flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px 22px;padding:12px 16px}
  .bk-art .bk-cover{width:72px;height:auto}
  .bk-note,.bk-result{flex:0 0 100%;margin-top:0}
  .fn-arrow-sp{width:36px;flex:0 0 36px}
  .burn-in{max-width:min(720px,94vw)}
  .burn-cards{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  /* 책장 자세히: 가로형 카드 */
  .ci-card,.ci-card.paper{width:min(820px,96vw);display:grid;grid-template-columns:170px minmax(0,1fr);column-gap:16px;align-items:start;padding:14px 16px!important}
  .ci-l{grid-column:1;grid-row:1;text-align:center}.ci-r{grid-column:2;grid-row:1;min-width:0;columns:2;column-gap:16px}
  .ci-r>*{break-inside:avoid}.ci-r>.ci-dies{margin-top:0}.ci-art svg,.ci-art .ico{width:44px;height:44px}.ci-hint{grid-column:1/-1;margin-top:6px}
  .ci-art{margin:0 0 4px!important}.ci-name{margin:0 0 8px!important}
  .ci-dies{margin:0 0 8px}.ci-text{margin:2px 0 6px;font-size:13px;line-height:1.55}.ci-flavor{margin:4px 0 6px;font-size:12px;line-height:1.5}
  .ci-sec{margin-top:6px;padding-top:6px}
}
/* guest list portraits: always centered in their frame */
.guest-card .bust{display:flex!important;align-items:center;justify-content:center}
.guest-card .bust>svg,.guest-card .bust>.bust-art{margin:auto;flex:0 0 auto}
/* ===== 달의 계시 ===== */
.botnav .btn.moon-lit{overflow:visible}
.botnav .btn.moon-lit:after{content:"";display:block;bottom:auto;left:auto;position:absolute;top:7px;right:9px;width:7px;height:7px;border-radius:50%;background:#cfd6ff;
  box-shadow:0 0 0 2px rgba(10,12,22,.85),0 0 10px rgba(190,200,255,.9);animation:moonDot 2.2s ease-in-out infinite;pointer-events:none}
@keyframes moonDot{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}}
#scene-moon{padding:8px calc(14px + var(--safe-right,0px)) calc(12px + var(--safe-bottom)) calc(14px + var(--safe-left,0px));gap:10px;
  background:radial-gradient(120% 70% at 50% -10%,rgba(142,139,255,.18),transparent 60%),radial-gradient(60% 50% at 50% 110%,rgba(207,214,255,.07),transparent 70%),linear-gradient(180deg,rgba(6,7,14,.86),rgba(8,9,18,.93))}
.moon-head{display:flex;align-items:center;gap:10px;flex:0 0 auto;min-height:calc(var(--audio-top) + var(--audio-btn));padding-right:96px}
.moon-head .x-btn{flex:0 0 auto}
.moon-ttl{display:flex;align-items:center;gap:8px;min-width:0;font-family:var(--display);font-size:15px;color:#e8ebff;white-space:nowrap}
.moon-ttl svg{flex:0 0 auto}
.moon-sub{font-size:12px;color:var(--parch2);font-weight:600;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.moon-sub:empty{display:none}
.moon-timer{display:flex;align-items:center;gap:10px;flex:0 0 auto;font-family:var(--display);font-size:12px;color:var(--parch2)}
.moon-tbar{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.moon-tbar i{display:block;height:100%;width:100%;transform-origin:0 50%;border-radius:99px;background:linear-gradient(90deg,#8e8bff,#cfd6ff);box-shadow:0 0 10px rgba(170,180,255,.6)}
.moon-timer.low .moon-tbar i{background:linear-gradient(90deg,#ff7a68,#ffc857);box-shadow:0 0 10px rgba(255,122,104,.6)}
.moon-tnum{min-width:38px;text-align:right}.moon-tnum b,.moon-ok b{color:#fff}
.moon-ok{color:var(--hp)}
.moon-skip{font-size:12px;padding:6px 10px;border-radius:10px;border:1px solid var(--line-hi);color:var(--parch)}
.moon-body{flex:1 1 auto;min-height:0;width:100%;max-width:980px;margin:0 auto}
.moon-quiz{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:12px}
.moon-qcard{position:relative;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;text-align:center;overflow:hidden;
  border-radius:var(--r-lg);border:1px solid rgba(207,214,255,.18);background:linear-gradient(180deg,rgba(207,214,255,.07),rgba(255,255,255,.01)),var(--glass);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 30px rgba(0,0,0,.35)}
.moon-qcard.bonk{animation:moonBonk .32s .16s ease-out both}
@keyframes moonBonk{0%,100%{transform:none}30%{transform:scale(.97,.94);border-color:rgba(255,122,104,.7)}}
.moon-pos{position:absolute;top:10px;left:12px;font-size:11px;color:var(--parch2);padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
.moon-prompt{font-family:var(--display);font-weight:700;color:#fff;line-height:1.15;max-width:100%;overflow-wrap:anywhere;letter-spacing:-.02em;text-shadow:0 0 24px rgba(170,180,255,.35)}
.moon-qcard.en .moon-prompt{font-size:clamp(30px,9vw,52px)}
.moon-qcard.ko .moon-prompt{font-size:clamp(24px,7vw,40px)}
.moon-ask{font-size:12px;color:var(--parch2)}
.moon-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.moon-opt{position:relative;min-height:64px;padding:10px 12px 10px 30px;border-radius:var(--r-md);border:1px solid var(--line-hi);background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.025)),rgba(14,17,30,.72);
  color:var(--parch);font-size:16px;font-weight:600;line-height:1.25;display:flex;align-items:center;justify-content:center;text-align:center;transition:background .12s,border-color .12s,transform .08s;min-width:0}
.moon-opts.en .moon-opt{font-family:var(--display);font-size:17px}
.moon-opt span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.moon-opt i{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-style:normal;font-size:10px;color:var(--parch2);opacity:.6;font-family:var(--display)}
.moon-opt:active{transform:scale(.97)}
@media (hover:hover){.moon-opt:hover{border-color:rgba(207,214,255,.55);background:rgba(207,214,255,.08)}}
.moon-opt.ok{border-color:var(--hp);background:rgba(95,211,162,.18);color:#fff;box-shadow:0 0 16px rgba(95,211,162,.35)}
.moon-opt.bad{border-color:var(--blood);background:rgba(255,122,104,.18);color:#fff}
.moon-opt:disabled{cursor:default}
.moon-intro,.moon-bridge,.moon-result{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.moon-hero{position:relative;display:flex;align-items:center;justify-content:center}
.moon-hero:before{content:"";position:absolute;inset:-30%;border-radius:50%;background:radial-gradient(circle,rgba(207,214,255,.22),transparent 65%)}
.moon-hero svg{position:relative}
.moon-art.wane{filter:brightness(.8)}
.moon-introtext{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:420px}
.moon-big{font-size:26px}

    const pd=(pDice&&i<pn&&P.stag===0)?pDice[i]:null, gd=(gDice&&j<gn&&G.stag===0)?gDice[j]:null;

    if(pd&&!gd&&heldP){ i++; heldP=false; continue; }   /* 남은 상대 주사위가 없으면 재사용 중이던 회피는 그냥 끝난다 */

      const pa=isAttack(pd.type), ga=isAttack(gd.type);

        if(cmp==="P"){ st.outcome="P"; ev("G",hitUnit(G,pd.type,pr,m)); }
        else if(cmp==="G"){ st.outcome="G"; ev("P",hitUnit(P,gd.type,gr,one)); } else st.outcome="tie";
      } else if(pa){
        if(gd.type==="방어"){
          if(cmp==="P"){ st.outcome="P"; ev("G",hitUnit(G,pd.type,pr-gr,m)); }

        } else {
          if(cmp==="G"){ st.outcome="G"; ev("G",recoverSt(G,gr)); }
          else if(cmp==="P"){ st.outcome="P"; ev("G",hitUnit(G,pd.type,pr,m)); } else st.outcome="tie";
        }
      } else if(ga){
        if(pd.type==="방어"){
          if(cmp==="P"){ st.outcome="P"; ev("G",stagOnly(G,pr-gr,m.st)); }
          else if(cmp==="G"){ st.outcome="G"; ev("P",hitUnit(P,gd.type,gr-pr,one)); } else st.outcome="tie";
        } else {
          if(cmp==="P"){ st.outcome="P"; ev("P",recoverSt(P,pr)); }
          else if(cmp==="G"){ st.outcome="G"; ev("P",hitUnit(P,gd.type,gr,one)); } else st.outcome="tie";
        }
      }

    else if(gd){ if(isAttack(gd.type)){ st.outcome="G"; ev("P",hitUnit(P,gd.type,gr,one)); } }
    /* 회피 주사위 재사용: 공격 주사위를 상대로 이긴 회피는 남는다 */
    const keepP=!!(pd&&gd&&pd.type==="회피"&&isAttack(gd.type)&&st.outcome==="P");
    const keepG=!!(pd&&gd&&gd.type==="회피"&&isAttack(pd.type)&&st.outcome==="G");
    if(st.pd) st.pd.keeps=keepP; if(st.gd) st.gd.keeps=keepG;

    steps.push(st);
    if(keepP) heldP=true; else { heldP=false; i++; }
    if(keepG) heldG=true; else { heldG=false; j++; }
    if(keepP&&keepG){ heldP=heldG=false; i++; j++; }

}

function gxnBits(n){
  const B="#15111d",P="#261d35";
  return {B,P,st:`stroke="${n}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"`,thin:`stroke="${n}" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"`,
    diam:(x,y,s,f=.2)=>`<path d="M${x} ${y-s}L${x+s*.7} ${y}L${x} ${y+s}L${x-s*.7} ${y}Z" fill="${n}" fill-opacity="${f}" stroke="${n}" stroke-width="1.1" stroke-linejoin="round"/>`,
    hem:(x0,x1,y,step=7)=>{ let p=`M${x0} ${y}`; for(let x=x0,i=0;x<x1;x+=step,i++) p+=` L${x+step/2} ${i%2?y:y+9} L${x+step} ${y}`; return `<path d="${p}" fill="none" stroke="${n}" stroke-width="1" opacity=".85"/>`; },
    tx:(x,y,s,t)=>`<text x="${x}" y="${y}" fill="${n}" font-size="${s}" font-weight="800" font-family="Pretendard Variable,Pretendard,sans-serif">${t}</text>`};

/* ---------- 책/책장 획득 (Ruina식: 책이 쌓이고, 소각하면 그 손님의 책장 풀에서 나온다) ---------- */
function ownedCount(s,id){
  const p=PAGE_BY[id]; if(!p) return 0;
  if(p.starter) return DECK_MAX_COPIES;

function bookMaxed(s,gid){ const l=BOOK_POOLS[gid]; return !!l&&l.every(e=>{ const o=entryOwned(s,e); return o.count>=o.cap; }); }
function shownBookCount(s,gid){ return bookMaxed(s,gid)?0:bookCount(s,gid); }

function rollRecallBooks(rng){ return (rng||Math.random)()<BOOK_RULES.recallOne?1:2; }
function entryName(e){ return e.k==="page"?(PAGE_BY[e.id]||{}).name:(KEY_BY[e.id]||{}).name; }
function entryOwned(s,e){
  return e.k==="page"?{count:ownedCount(s,e.id),cap:DECK_MAX_COPIES}:{count:(s.unlockedKeyIds||[]).includes(e.id)?1:0,cap:1};
}
/* 가중치: 미보유 ×3 (연속으로 새 책장을 못 얻을수록 추가 가산), 보유 1장이면 ×0.5, 상한이면 제외.
   pityGuarantee번 연속 중복이면 미보유 책장만 나온다. */
function poolEntries(s,gid){
  const pity=((s.bookPity||{})[gid])||0;
  const list=(BOOK_POOLS[gid]||[]).map(e=>{
    const o=entryOwned(s,e); let w=0;
    if(o.count<o.cap) w=e.w*(o.count===0?BOOK_RULES.newMul*(1+pity*.8):BOOK_RULES.dupMul);
    return {...e,count:o.count,cap:o.cap,w};
  });
  if(pity>=BOOK_RULES.pityGuarantee && list.some(e=>e.count===0)) list.forEach(e=>{ if(e.count>0) e.w=0; });

function grantEntry(s,e){

    if(!s.unlockedPageIds.includes(e.id)) s.unlockedPageIds=[...s.unlockedPageIds,e.id];

function burnBookOnce(s,gid,rng){
  if(bookCount(s,gid)<1) return {ok:false,why:"책이 없다"};
  const list=poolEntries(s,gid);
  if(!list.some(e=>e.w>0)) return {ok:false,why:"이 책의 책장을 모두 모았다"};
  let r=(rng||Math.random)()*list.reduce((a,e)=>a+e.w,0), pick=list.find(e=>e.w>0);
  for(const e of list){ if(e.w<=0) continue; if(r<e.w){ pick=e; break; } r-=e.w; }
  const isNew=pick.count===0;
  grantEntry(s,pick);
  s.bookCounts={...s.bookCounts,[gid]:bookCount(s,gid)-1};
  s.bookPity={...(s.bookPity||{}),[gid]:isNew?0:(((s.bookPity||{})[gid])||0)+1};

}

function sourcesOf(kind,id){

function acqAudit(){

  COMBAT_PAGES.forEach(p=>{ if(!p.starter&&!sourcesOf("page",p.id).length) orphans.push("page:"+p.id); });
  KEY_PAGES.forEach(k=>{ if(k.id!=="novice"&&!sourcesOf("key",k.id).length) orphans.push("key:"+k.id); });
  const bad=[];
  Object.entries(BOOK_POOLS).forEach(([gid,l])=>{ if(!GUEST_BY[gid]) bad.push("guest:"+gid); l.forEach(e=>{ if(!(e.k==="page"?PAGE_BY[e.id]:KEY_BY[e.id])) bad.push(gid+":"+e.id); }); });

function openDeckEditor(ret){
  deckReturn=ret||{to:"shelf"};
  const go=()=>{ showScene("deck"); renderDeckEditor(); };
  if(scene==="deck") go();
  else transit("deck", go);
}
function closeDeckEditor(){
  const ret=deckReturn||{to:"shelf"};
  deckReturn=null;
  const to=ret.to||"shelf";
  if(ret.startAfter&&ret.guestId&&isDeckReady(save)){
    transit("battle",()=>beginReception(ret.guestId));
    return;
  }
  transit(to,()=>{
    if(to==="lobby") renderLobby();
    else if(to==="shelf") renderShelf();
  });
}
function tryBeginReception(guestId){
  if(!isDeckReady(save)){
    toast(`책장을 ${DECK_MIN}장 이상 장착해야 접대할 수 있습니다`);
    openDeckEditor({to:"lobby",guestId,startAfter:true});
    return;
  }
  beginReception(guestId);
}

function renderDeckEditor(){
  ensureDecks(save);
  const deck=activeDeck(save);
  const owned=ownedPageIds(save);
  const ready=deck.pageIds.length>=DECK_MIN&&deck.pageIds.length<=DECK_MAX;
  const floors=["전체","기본",...FLOORS.map(f=>f.name)];
  const subjects=["전체",...[...new Set(owned.map(id=>PAGE_BY[id].subject||"기본"))]];
  const types=["전체","참격","관통","타격","방어","회피"];
  const f=deckFilter;
  let list=owned.map(id=>PAGE_BY[id]).filter(Boolean);
  if(f.q){
    const q=f.q.trim().toLowerCase();
    list=list.filter(p=>[p.name,p.text,p.flavor,p.subject,pageFloorName(p)].join(" ").toLowerCase().includes(q));
  }
  if(f.floor!=="전체") list=list.filter(p=>pageFloorName(p)===f.floor);
  if(f.subject!=="전체") list=list.filter(p=>(p.subject||"기본")===f.subject);
  if(f.cost!=="전체"){
    if(f.cost==="3+") list=list.filter(p=>p.cost>=3);
    else list=list.filter(p=>String(p.cost)===f.cost);
  }
  if(f.type!=="전체") list=list.filter(p=>pagePrimaryType(p)===f.type);
  if(f.rarity!=="전체") list=list.filter(p=>(p.rarity||"N")===f.rarity);
  const order={N:0,R:1,SR:2,SSR:3};
  list.sort((a,b)=>{
    if(f.sort==="name") return a.name.localeCompare(b.name,"ko");
    if(f.sort==="rarity") return (order[b.rarity||"N"]-order[a.rarity||"N"])||a.cost-b.cost;
    if(f.sort==="type") return pagePrimaryType(a).localeCompare(pagePrimaryType(b),"ko")||a.cost-b.cost;
    return a.cost-b.cost||a.name.localeCompare(b.name,"ko");
  });
  const startLabel=deckReturn&&deckReturn.guestId?(GUEST_BY[deckReturn.guestId]?((save.conqueredIds.includes(deckReturn.guestId)?"회상":"접대")+" 시작"):"접대 시작"):"";
  $("#scene-deck").innerHTML=`
    <div class="topbar">${hudStats()}</div>
    <div class="page-scroll">
      <div class="deck-head">
        <div>
          <h2 class="gold-title" style="font-size:22px;margin-bottom:6px">덱 편성</h2>
          <p class="gmeta">전투에는 장착한 책장(${DECK_MIN}~${DECK_MAX}장)만 가져갑니다. 길게 누르면 책장을 자세히 볼 수 있습니다.</p>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn" id="deck-back">돌아가기</button>
          ${deckReturn&&deckReturn.guestId?`<button class="btn primary" id="deck-start" ${ready?"":"disabled"}>${startLabel}</button>`:""}
        </div>
      </div>
      <div class="deck-presets">
        ${save.decks.map(d=>`<button class="btn ${d.id===deck.id?"primary":""}" data-preset="${d.id}">${d.name} · ${d.pageIds.length}/${DECK_MAX}</button>`).join("")}
        <button class="btn" id="deck-new" ${save.decks.length>=MAX_DECK_PRESETS?"disabled":""}>새 덱</button>
        <button class="btn" id="deck-copy">복제</button>
        <button class="btn" id="deck-rename">이름</button>
        <button class="btn" id="deck-del" ${save.decks.length<=1?"disabled":""}>삭제</button>
      </div>
      <div id="deck-rename-row" style="display:none;margin:0 0 10px">
        <input class="deck-search" id="deck-name-input" maxlength="16" value="${deck.name}">
      </div>
      <div class="gmeta" style="margin-bottom:8px">${ready?`장착 ${deck.pageIds.length}/${DECK_MAX}장 · 접대할 수 있습니다.`:`${deck.pageIds.length}/${DECK_MAX}장 · 최소 ${DECK_MIN}장을 채워야 접대할 수 있습니다.`}</div>
      <div class="deck-slots">${Array.from({length:Math.min(DECK_MAX,Math.ceil((deck.pageIds.length+1)/6)*6)},(_,i)=>{
        const id=deck.pageIds[i], p=id&&PAGE_BY[id];
        if(!p) return `<div class="deck-slot empty">${i<DECK_MIN?"빈 칸":"+"}</div>`;
        return `<button class="deck-slot" data-off="${p.id}" type="button">${paperCardHtml(p,{mini:true})}</button>`;
      }).join("")}</div>
      ${costCurveHtml(deck.pageIds)}
      <input class="deck-search" id="deck-q" type="search" placeholder="이름, 효과, 플레이버, 층으로 검색" value="${f.q||""}">
      <div class="deck-filters">
        <select data-df="floor">${floors.map(x=>`<option ${f.floor===x?"selected":""}>${x}</option>`).join("")}</select>
        <select data-df="subject">${subjects.map(x=>`<option ${f.subject===x?"selected":""}>${x}</option>`).join("")}</select>
        <select data-df="cost">${["전체","0","1","2","3+"].map(x=>`<option ${f.cost===x?"selected":""}>${x}</option>`).join("")}</select>
        <select data-df="type">${types.map(x=>`<option ${f.type===x?"selected":""}>${x}</option>`).join("")}</select>
        <select data-df="rarity">${["전체","N","R","SR","SSR"].map(x=>`<option ${f.rarity===x?"selected":""}>${x}</option>`).join("")}</select>
        <select data-df="sort">${[["cost","비용"],["name","이름"],["rarity","희귀도"],["type","유형"]].map(([v,l])=>`<option value="${v}" ${f.sort===v?"selected":""}>${l}</option>`).join("")}</select>
      </div>
      <div class="item-grid" id="deck-pool">${list.map(p=>{
        const nIn=deck.pageIds.filter(x=>x===p.id).length, inD=nIn>0, lim=deckLimit(save,p.id);
        return `<button class="dpage ${inD?"in":""}" type="button" data-page="${p.id}" aria-pressed="${inD?"true":"false"}" title="${p.name}${inD?" · 장착 중":""}">

  $("#deck-back").onclick=()=>closeDeckEditor();
  const st=$("#deck-start"); if(st) st.onclick=()=>{ if(isDeckReady(save)&&deckReturn&&deckReturn.guestId){ const id=deckReturn.guestId; deckReturn=null; transit("battle",()=>beginReception(id)); } };

    save.decks.push({id,name:"제"+(save.decks.length+1)+" 덱",pageIds:defaultDeckIds(save)});
    save.activeDeckId=id; persist(); SFX.click(); renderDeckEditor();
  };

    if(save.decks.length>=MAX_DECK_PRESETS) return;
    const src=activeDeck(save), id="deck-"+Date.now();
    save.decks.push({id,name:src.name+" 사본",pageIds:[...src.pageIds]});
    save.activeDeckId=id; persist(); SFX.click(); renderDeckEditor();
  };

    if(save.decks.length<=1) return;

  if(qel) qel.oninput=()=>{ deckFilter.q=qel.value; renderDeckEditor(); const n=$("#deck-q"); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length);} };
  $$("[data-df]").forEach(sel=>sel.onchange=()=>{ deckFilter[sel.dataset.df]=sel.value; renderDeckEditor(); });
  bindPageInspect("#deck-pool [data-page]", (pageId)=>{ toggleDeckPage(pageId); });
  bindPageInspect(".deck-slot[data-off]", (pageId)=>{ toggleDeckPage(pageId,{slot:true}); });

function toggleDeckPage(id,opts){
  ensureDecks(save);
  const d=activeDeck(save);
  const have=d.pageIds.filter(x=>x===id).length, lim=deckLimit(save,id);
  if(opts&&opts.slot){ const k=d.pageIds.lastIndexOf(id); if(k>=0) d.pageIds.splice(k,1); }
  else if(have<lim&&d.pageIds.length<DECK_MAX){ d.pageIds.push(id); }
  else if(have>0){ d.pageIds=d.pageIds.filter(x=>x!==id); }       // 한도에 닿으면 한 번 더 눌러 모두 해제
  else if(d.pageIds.length>=DECK_MAX){ toast("덱은 "+DECK_MAX+"장까지입니다"); return; }
  else return;
  persist(); SFX.click();
  /* 카드를 누르면 위쪽 칸 줄 수·문구 높이가 바뀌어 아래 목록이 통째로 밀린다 → 누른 카드(칸이면 칸 묶음)가 화면에서 있던 자리에 그대로 있도록 보정 */
  withDeckAnchor(opts&&opts.slot?".deck-slots":`#deck-pool [data-page="${id}"]`,()=>renderDeckEditor());
}
function withDeckAnchor(sel,fn){
  const el=document.querySelector("#scene-deck "+sel), t0=el?el.getBoundingClientRect().top:null;
  fn();
  if(t0==null) return;
  const fix=()=>{ const n=document.querySelector("#scene-deck "+sel), sc=document.querySelector("#scene-deck .page-scroll"); if(!n||!sc) return;
    const dy=n.getBoundingClientRect().top-t0; if(Math.abs(dy)>0.5) sc.scrollTop+=dy; };
  fix(); requestAnimationFrame(fix);   // 레이아웃이 안정된 다음 프레임에서 한 번 더
}
