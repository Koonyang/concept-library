function setSettings(open){
  const bm=$("#set-bm"), dr=$("#set-drawer"), sc=$("#set-scrim");
  if(open) try{ setDrawer(false); }catch(e){}
  dr?.classList.toggle("open",!!open); sc?.classList.toggle("on",!!open);
  dr?.setAttribute("aria-hidden",open?"false":"true"); bm?.setAttribute("aria-expanded",open?"true":"false");
}
function bindAudioToggles(){
  const s=$("#btn-sfx"), b=$("#btn-bgm");
  if(s) s.onclick=()=>{ SFX.unlock(); SFX.setSfxMuted(!SFX.sfxMuted); save.sfxMuted=SFX.sfxMuted; persist(); paintAudioButtons(); };
  if(b) b.onclick=()=>{ SFX.unlock(); SFX.setBgmMuted(!SFX.bgmMuted); save.bgmMuted=SFX.bgmMuted; persist(); paintAudioButtons(); };
  const bm=$("#set-bm"), dr=$("#set-drawer"), sc=$("#set-scrim");
  if(bm) bm.onclick=()=>{ try{SFX.click();}catch(e){} setSettings(bm.getAttribute("aria-expanded")!=="true"); };
  if(sc) sc.onclick=()=>setSettings(false);
  paintAudioButtons();
}

/* ---------- transitions / toast / shake ---------- */
function transit(next, fn){
  try{ setSettings(false); }catch(e){}
  const tr=$("#transition"); tr.classList.add("go");
  setTimeout(()=>{ fn&&fn(); showScene(next); tr.classList.remove("go"); }, 420);
}
let sceneEpoch=0;
function showScene(name){
  closeCardInspect();
  if(name!==scene) sceneEpoch++;
  scene=name; FX.setMode(name);
  SFX.setBgmMode(name==="battle"?"battle":"lobby"); if(name==="lobby") SFX.prefetchBattleBgm();
  $$(".scene").forEach(s=>{
    const on=s.id==="scene-"+name;
    if(on){ s.style.transition=""; s.style.visibility="visible"; s.classList.add("on"); }
    else { s.style.transition="none"; s.classList.remove("on"); s.style.visibility="hidden"; }
  });
}
function toast(msg, ms=1400){ const el=$("#toast"); el.textContent=msg; el.classList.add("on"); setTimeout(()=>el.classList.remove("on"),ms); }

function shake(n=8){
  const el=$("#shake"); let i=0;
  const step=()=>{ i++; el.style.transform=`translate(${(Math.random()*2-1)*n}px,${(Math.random()*2-1)*n}px)`;
    if(i<10) requestAnimationFrame(step); else el.style.transform=""; };
  step();
}

/* ---------- 가로 모드 기본: 입장 탭에서 전체 화면 + 가로 고정 (안 되면 조용히 무시) ---------- */
const Landscape=(()=>{
  let wanted=false;
  const mobile=()=>{ try{ return matchMedia("(pointer:coarse)").matches; }catch(e){ return false; } };
  const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement||null;
  function lock(){
    try{
      const o=screen.orientation;
      if(o&&typeof o.lock==="function"){ const p=o.lock("landscape"); if(p&&p.catch) p.catch(()=>{}); }
    }catch(e){}
  }
  function enter(){
    wanted=true;
    if(!mobile()) return;               // 데스크톱: 전체 화면으로 바꾸지 않는다
    try{
      const d=document.documentElement;
      if(fsEl()){ lock(); return; }
      const req=d.requestFullscreen||d.webkitRequestFullscreen;
      if(!req){ lock(); return; }        // iOS Safari 등: 그냥 넘어간다
      const p=req.call(d,{navigationUI:"hide"});
      if(p&&p.then) p.then(lock,()=>lock()); else lock();
    }catch(e){ lock(); }
  }
  const onFs=()=>{ if(wanted&&fsEl()) lock(); };
  document.addEventListener("fullscreenchange",onFs);
  document.addEventListener("webkitfullscreenchange",onFs);
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) onFs(); });
  return {enter,lock,get wanted(){return wanted;}};
})();

function floorDotsHtml(cur){
  const n=FLOORS.length, MAXD=7;
  let a=0,b=n-1;
  if(n>MAXD){ a=Math.max(0,Math.min(n-MAXD,cur-Math.floor(MAXD/2))); b=a+MAXD-1; }

function bindSheetSwipe(sheet){
  const mobile=()=>window.innerWidth<=860;
  const drag=(dy)=>{ if(dy>0) sheet.style.transform=mobile()?`translateY(${dy}px)`:`translateX(${Math.min(dy,200)}px)`; };
  const finish=(dy)=>{ sheet.style.transition=""; sheet.style.transform=""; if(dy>64) closeGuestSheet(); };
  if(sheet._swipeBound) return; sheet._swipeBound=true;
  // handle/header: pointer drag (mouse + touch + pen), delegated so it survives re-render
  let y0=null,dy=0,pid=null,headEl=null;
  sheet.addEventListener("pointerdown",e=>{
    const head=e.target.closest("#sheet-grab"); if(!head||e.target.closest(".x-btn")) return;
    headEl=head; y0=e.clientY; dy=0; pid=e.pointerId; sheet.style.transition="none";
    try{ head.setPointerCapture(pid); }catch(_){}
  });
  sheet.addEventListener("pointermove",e=>{ if(y0==null) return; dy=e.clientY-y0; drag(dy); });
  const up=()=>{ if(y0==null) return; const d=dy; y0=null; dy=0; finish(d); };
  sheet.addEventListener("pointerup",up); sheet.addEventListener("pointercancel",up);
  // body: swipe down when scrolled to the top
  let y1=null,d1=0;
  sheet.addEventListener("touchstart",e=>{ if(e.target.closest("#sheet-grab")||sheet.scrollTop>0){ y1=null; return; } y1=e.touches[0].clientY; d1=0; sheet.style.transition="none"; },{passive:true});
  sheet.addEventListener("touchmove",e=>{ if(y1==null) return; d1=e.touches[0].clientY-y1; drag(d1); },{passive:true});
  sheet.addEventListener("touchend",()=>{ if(y1==null) return; const d=d1; y1=null; d1=0; finish(d); });
}


function paintMiniFloor(cv, fid){
  if(!cv) return;
  const W=cv.clientWidth,H=cv.clientHeight; if(!W||!H) return;
  cv.width=W*devicePixelRatio; cv.height=H*devicePixelRatio;
  const c=cv.getContext("2d"); c.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  const g=c.createLinearGradient(0,0,0,H); g.addColorStop(0,"#161018"); g.addColorStop(1,"#0a080c");
  c.fillStyle=g; c.fillRect(0,0,W,H);
  const rg=c.createRadialGradient(W*.72,H*.3,6,W*.72,H*.35,W*.4);
  rg.addColorStop(0,"rgba(245,219,170,.28)"); rg.addColorStop(1,"transparent");
  c.fillStyle=rg; c.fillRect(0,0,W,H);
  const x0=W*0.48;
  c.fillStyle="#1a140c"; c.fillRect(x0,H-16,W-x0,16);
  c.fillStyle="rgba(236,186,104,.25)"; c.fillRect(x0,H-16,W-x0,1);
  const n=Math.max(6, Math.floor((W-x0)/16));
  for(let i=0;i<n;i++){
    const x=x0+8+i*16, hh=18+(i*9)%(H*0.55);
    c.fillStyle=i%5===0?"#c4a35a":(i%2?"#2a1c12":"#1a140c");
    c.fillRect(x, H-16-hh, 13, hh);
    if(i%3===0){ c.fillStyle="rgba(245,219,170,.15)"; c.fillRect(x+2, H-16-hh, 2, Math.min(10,hh)); }
  }
}

function shuffle(arr){

  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function buildQuiz(guest, recall){

    if(!recall || q.type==="ox") return {...q, options:q.options.slice()};

  });

}

function bindPageInspect(sel, onTap){
  $$(sel).forEach(c=>{
    const pageId=c.dataset.page||c.dataset.off;
    if(!pageId) return;
    c.addEventListener("contextmenu",ev=>{ ev.preventDefault(); ev.stopPropagation(); });
    c.addEventListener("selectstart",ev=>ev.preventDefault());
    c.addEventListener("pointerdown",ev=>{
      if(ev.pointerType==="mouse" && ev.button===1) return;
      if(ev.pointerType==="mouse" && ev.button===2){
        ev.preventDefault();
        if(inspectState.timer){clearTimeout(inspectState.timer);inspectState.timer=0}
        inspectState.press=true; inspectState.suppressClick=true; inspectState.reason="press";
        openCardInspect(pageId);
        try{ c.setPointerCapture(ev.pointerId); }catch(e){}
        return;
      }
      if(ev.pointerType==="mouse" && ev.button!==0) return;
      if(inspectState.timer){clearTimeout(inspectState.timer);inspectState.timer=0}
      inspectState.press=false; inspectState.suppressClick=false;
      inspectState.timer=setTimeout(()=>{
        inspectState.press=true; inspectState.suppressClick=true; inspectState.reason="press";
        openCardInspect(pageId);
        try{ c.setPointerCapture(ev.pointerId); }catch(e){}
      },300);
    });
    const endHold=()=>{
      if(inspectState.timer){clearTimeout(inspectState.timer);inspectState.timer=0}
      if(inspectState.press){
        closeCardInspect();
        setTimeout(()=>{inspectState.suppressClick=false},400);
      }
      inspectState.press=false;
    };
    c.addEventListener("pointerup",endHold);
    c.addEventListener("pointercancel",endHold);
    c.addEventListener("pointerenter",ev=>{
      if(ev.pointerType!=="mouse"||c.closest("#hand")) return;
      SFX.hover();
      if(inspectState.hoverTimer) clearTimeout(inspectState.hoverTimer);
      inspectState.hoverTimer=setTimeout(()=>{
        if(!inspectState.press){ inspectState.reason="hover"; openCardInspect(pageId); }
      },300);
    });
    c.addEventListener("pointerleave",ev=>{
      if(ev.pointerType==="mouse" && !inspectState.press){
        if(inspectState.hoverTimer){clearTimeout(inspectState.hoverTimer);inspectState.hoverTimer=0}
        if(inspectState.reason==="hover") closeCardInspect();
      }
    });
    if(onTap){
      c.addEventListener("click",ev=>{
        if(inspectState.suppressClick){
          ev.preventDefault(); ev.stopImmediatePropagation();
          inspectState.suppressClick=false;
          return;
        }
        onTap(pageId,c,ev);
      });
    }
  });
}

/* ---------- 루이나식 부채꼴 손패: 장수가 늘면 더 촘촘히 겹치고, 짚은 카드는 위로 떠올라 커진다 ---------- */
function layoutHand(){
  const hand=$("#hand"); if(!hand) return;
  const cs=[...hand.children].filter(c=>c.classList.contains("cc")); const n=cs.length; if(!n) return;
  cs.forEach(c=>{ c.style.margin="0"; c.style.transform="none"; });
  const cw=cs[0].offsetWidth, ch=cs[0].offsetHeight, W=hand.clientWidth;
  const land=matchMedia("(orientation:landscape) and (max-height:500px)").matches;   // 가로: 부채꼴을 얕게 → 카드가 화면 아래로 잘리지 않게
  const rotStep=n<2?0:Math.min(land?3.2:7,(land?20:44)/(n-1)), dip=land?.7:1.2;
  const amax=(n-1)/2*rotStep*Math.PI/180;
  const pad=Math.ceil(ch*Math.sin(amax)/2+cw*(1-Math.cos(amax))/2)+9;   // 기울어진 바깥 카드의 모서리까지 화면 안에
  const avail=W-2*pad;
  const step=n<2?0:Math.min(cw*0.67,(avail-cw)/(n-1));
  const left0=(W-(cw+step*(n-1)))/2;
  const s=Math.min(1.9,Math.max(1.12,Math.min(190,W*0.5)/cw));
  hand._geo={n,cw,ch,step,left0,W,s};
  cs.forEach((c,i)=>{
    c.style.margin=`0 ${(step-cw)/2}px`;
    const ang=(i-(n-1)/2)*rotStep;
    c._base=`rotate(${ang}deg) translateY(${Math.abs(ang)*dip}px)`;
    c.style.transform=c._base; c.style.zIndex=i; c._z=i;
    c.classList.remove("hot");
  });
  hand.classList.toggle("crowd",n>=6);
}
function handHot(hand,idx){
  const g=hand._geo; if(!g) return;
  const cs=[...hand.children].filter(c=>c.classList.contains("cc"));
  cs.forEach((c,i)=>{
    if(i===idx){
      const cx=g.left0+i*g.step+g.cw/2, half=g.cw*g.s/2;
      const dx=Math.max(6+half,Math.min(g.W-6-half,cx))-cx;
      c.classList.add("hot"); c.style.zIndex=60;
      c.style.transform=`translate(${dx}px,-${Math.round(g.ch*0.12)}px) scale(${g.s})`;
    } else if(c.classList.contains("hot")){
      c.classList.remove("hot"); c.style.zIndex=c._z; c.style.transform=c._base;
    }
  });
  hand._hot=idx;
}
function bindHandScrub(onPick){
  const hand=$("#hand"); if(!hand) return;
  let active=false, pid=null, last=-1;
  const idxAt=x=>{ const g=hand._geo, r=hand.getBoundingClientRect(); return Math.max(0,Math.min(g.n-1,Math.floor((x-r.left-g.left0)/(g.step||g.cw)))); };
  const cards=()=>[...hand.children].filter(c=>c.classList.contains("cc"));
  const release=(select)=>{
    if(!active) return; active=false;
    const i=hand._hot, cs=cards(), c=cs[i];
    handHot(hand,-1);
    if(select&&c&&!c.classList.contains("off")){ if(onPick) onPick(c); else if(reception&&reception.phase==="select"&&!busy) choosePage(c.dataset.page); }
    last=-1;
  };
  hand.addEventListener("pointerdown",ev=>{
    if(ev.pointerType==="mouse") return;
    const cc=ev.target.closest&&ev.target.closest(".cc"); if(!cc) return;
    ev.stopPropagation(); ev.preventDefault();
    active=true; pid=ev.pointerId; try{ cc.setPointerCapture(pid); }catch(e){}
    last=idxAt(ev.clientX); handHot(hand,last); try{ SFX.hover(); }catch(e){}
  },true);
  hand.addEventListener("pointermove",ev=>{
    if(!active||ev.pointerId!==pid) return;
    ev.stopPropagation();
    const i=idxAt(ev.clientX);
    if(i!==last){ last=i; handHot(hand,i); try{ SFX.hover(); }catch(e){} if(navigator.vibrate) try{navigator.vibrate(4)}catch(e){} }
  },true);
  hand.addEventListener("pointerup",ev=>{ if(!active||ev.pointerId!==pid) return; ev.stopPropagation(); release(true); },true);
  hand.addEventListener("pointercancel",ev=>{ if(!active||ev.pointerId!==pid) return; release(false); },true);
  hand.addEventListener("click",ev=>{ if(ev.pointerType&&ev.pointerType!=="mouse"){ ev.stopPropagation(); ev.preventDefault(); } },true);
  /* 마우스: 올려둔 카드가 떠오른다 */
  hand.addEventListener("pointerover",ev=>{
    if(ev.pointerType!=="mouse") return;
    const cc=ev.target.closest&&ev.target.closest(".cc"); if(!cc) return;
    handHot(hand,cards().indexOf(cc));
  });
  hand.addEventListener("pointerleave",ev=>{ if(ev.pointerType==="mouse") handHot(hand,-1); });
}

// Whole-stage framing: backdrop, spotlights and a perspective stage floor.
function paintStage(c,cv,W,H){
  let feetY=H*.64, figH=Math.min(H*.34,300);
  const fl=cv._floor;
  if(fl){ const cr=cv.getBoundingClientRect(), b=fl.yb-cr.top, f=fl.yf-cr.top; figH=Math.max(60,(f-b)/.36); feetY=b+figH*.16; }
  else try{
    const cr=cv.getBoundingClientRect(), ch=document.querySelector("#fig-lib .char");
    if(ch){ const r=ch.getBoundingClientRect(); if(r.height>20){ feetY=r.bottom-cr.top; figH=r.height; } }
  }catch(e){}
  // backdrop: deep tint toward the ceiling, stage haze near the floor
  const bgG=c.createLinearGradient(0,0,0,H);
  bgG.addColorStop(0,"rgba(6,7,16,.78)"); bgG.addColorStop(.38,"rgba(10,12,28,.12)");
  bgG.addColorStop(.7,"rgba(14,12,22,.28)"); bgG.addColorStop(1,"rgba(4,4,8,.92)");
  c.fillStyle=bgG; c.fillRect(0,0,W,H);
  // spotlights (additive)
  c.save(); c.globalCompositeOperation="screen";
  const cones=[[W*.5,"255,226,170",.2,W*.55],[W*.27,"255,214,150",.2,W*.34],[W*.73,"150,160,255",.18,W*.34]];
  for(const [cx,col,al,spread] of cones){
    const top=-10, yb=feetY+figH*.08;
    const g=c.createLinearGradient(0,top,0,yb);
    g.addColorStop(0,`rgba(${col},${al})`); g.addColorStop(.7,`rgba(${col},${al*.28})`); g.addColorStop(1,`rgba(${col},0)`);
    c.fillStyle=g; c.beginPath();
    c.moveTo(cx-W*.03,top); c.lineTo(cx+W*.03,top); c.lineTo(cx+spread*.5,yb); c.lineTo(cx-spread*.5,yb); c.closePath(); c.fill();
  }
  c.restore();
  // stage platform (perspective trapezoid)
  const yb=feetY-figH*.16, yf=feetY+figH*.2, lip=Math.max(8,figH*.05);
  const bx=W*.07, fx=-W*.04;
  c.beginPath(); c.moveTo(bx,yb); c.lineTo(W-bx,yb); c.lineTo(W-fx,yf); c.lineTo(fx,yf); c.closePath();
  const sf=c.createLinearGradient(0,yb,0,yf);
  sf.addColorStop(0,"rgba(52,58,96,.86)"); sf.addColorStop(1,"rgba(20,22,40,.94)");
  c.fillStyle=sf; c.fill();
  c.save(); c.clip();
  // plank/grid lines converge to the horizon
  c.strokeStyle="rgba(255,255,255,.055)"; c.lineWidth=1;
  for(let i=0;i<=14;i++){ const k=i/14; c.beginPath(); c.moveTo(bx+k*(W-2*bx),yb); c.lineTo(fx+k*(W-2*fx),yf); c.stroke(); }
  for(let i=1;i<6;i++){ const k=Math.pow(i/6,1.6), y=yb+(yf-yb)*k; c.beginPath(); c.moveTo(0,y); c.lineTo(W,y); c.stroke(); }
  // warm / cool pools of light under each fighter
  const pool=(cx,col)=>{ const g=c.createRadialGradient(cx,feetY,4,cx,feetY,W*.3);
    g.addColorStop(0,`rgba(${col},.42)`); g.addColorStop(1,`rgba(${col},0)`);
    c.save(); c.translate(0,feetY); c.scale(1,.26); c.translate(0,-feetY); c.fillStyle=g; c.fillRect(0,feetY-W*.4,W,W*.8); c.restore(); };
  pool(W*.27,"255,214,150"); pool(W*.73,"150,160,255");
  // centre clash ring on the floor
  c.strokeStyle="rgba(236,186,104,.28)"; c.lineWidth=1.2;
  c.beginPath(); c.ellipse(W/2,(yb+yf)/2+figH*.02,W*.3,(yf-yb)*.34,0,0,Math.PI*2); c.stroke();
  c.setLineDash([3,7]); c.strokeStyle="rgba(255,255,255,.14)";
  c.beginPath(); c.ellipse(W/2,(yb+yf)/2+figH*.02,W*.22,(yf-yb)*.24,0,0,Math.PI*2); c.stroke(); c.setLineDash([]);
  c.restore();
  // back edge rim light
  const rg=c.createLinearGradient(bx,0,W-bx,0);
  rg.addColorStop(0,"rgba(236,186,104,0)"); rg.addColorStop(.5,"rgba(255,230,180,.55)"); rg.addColorStop(1,"rgba(236,186,104,0)");
  c.strokeStyle=rg; c.lineWidth=1.4; c.beginPath(); c.moveTo(bx,yb); c.lineTo(W-bx,yb); c.stroke();
  // front lip (stage thickness) and the dark pit below
  c.fillStyle="rgba(10,11,22,.96)"; c.fillRect(0,yf,W,lip);
  c.fillStyle="rgba(236,186,104,.55)"; c.fillRect(0,yf,W,1.2);
  const pit=c.createLinearGradient(0,yf+lip,0,H);
  pit.addColorStop(0,"rgba(4,4,10,.96)"); pit.addColorStop(1,"rgba(2,2,5,.98)");
  c.fillStyle=pit; c.fillRect(0,yf+lip,W,H-yf-lip);
}

function paintBattleFloor(cv, fid){
  if(!cv) return;
  const W=cv.clientWidth,H=cv.clientHeight;
  if(!W||!H) return;
  cv.width=W*devicePixelRatio; cv.height=H*devicePixelRatio;
  const c=cv.getContext("2d"); c.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  const battle=cv.id==="arena-bg";
  const img=libraryPhoto(battle?"battle":"lobby");
  if(!img){
    const retry=()=>paintBattleFloor(cv,fid);
    if(libraryPhoto.cache){
      libraryPhoto.cache.lobby.addEventListener("load", retry, {once:true});
      libraryPhoto.cache.battle.addEventListener("load", retry, {once:true});
    }
  } else {
    const iw=img.naturalWidth, ih=img.naturalHeight, sc=Math.max(W/iw,H/ih)*1.06;
    c.drawImage(img, (W-iw*sc)/2, (H-ih*sc)/2, iw*sc, ih*sc);
    c.fillStyle=battle?"rgba(6,7,14,.58)":"rgba(7,8,13,.28)";
    c.fillRect(0,0,W,H);
    if(battle) paintStage(c,cv,W,H);
    return;
  }

  // fallback procedural shelves
    const g=c.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#0a0c12"); g.addColorStop(.45,"#101018"); g.addColorStop(1,"#07060a");
  c.fillStyle=g; c.fillRect(0,0,W,H);
  // high faint arch, well above HUD
  c.save(); c.globalAlpha=.35; c.translate(W/2, -20);
  c.beginPath(); c.moveTo(-120,110); c.lineTo(-120,20); c.quadraticCurveTo(0,-40,120,20); c.lineTo(120,110); c.closePath();
  const wg=c.createLinearGradient(0,0,0,110);
  wg.addColorStop(0,"rgba(80,100,130,.35)"); wg.addColorStop(1,"rgba(20,24,36,.1)");
  c.fillStyle=wg; c.fill();
  c.strokeStyle="rgba(236,186,104,.35)"; c.lineWidth=1.5; c.stroke();
  c.restore();
  const sl=c.createRadialGradient(W*.22,H*.7,20,W*.22,H*.7,W*.3);
  sl.addColorStop(0,"rgba(245,219,170,.2)"); sl.addColorStop(1,"transparent");
  const sr=c.createRadialGradient(W*.78,H*.7,20,W*.78,H*.7,W*.3);
  sr.addColorStop(0,"rgba(170,150,200,.12)"); sr.addColorStop(1,"transparent");
  c.fillStyle=sl; c.fillRect(0,0,W,H); c.fillStyle=sr; c.fillRect(0,0,W,H);
  for(let side=0;side<2;side++){
    for(let row=0;row<7;row++){
      const y=H*.16+row*(H*.085);
      const x0=side?W-148:10;
      c.fillStyle="#120e0a"; c.fillRect(x0,y+26,138,7);
      c.fillStyle="rgba(236,186,104,.2)"; c.fillRect(x0,y+26,138,1);
      for(let i=0;i<9;i++){
        const hh=16+(i*7+row*3)%18;
        c.fillStyle=(i+row)%5===0?"#c4a35a":(i%2?"#2a1c12":"#1a140c");
        c.fillRect(x0+6+i*14,y+26-hh,12,hh);
      }
    }
  }
  c.beginPath();
  c.moveTo(W*.1,H*.82); c.lineTo(W*.9,H*.82); c.lineTo(W,H); c.lineTo(0,H); c.closePath();
  const fg=c.createLinearGradient(0,H*.82,0,H);
  fg.addColorStop(0,"rgba(32,24,14,.9)"); fg.addColorStop(1,"rgba(8,6,4,.96)");
  c.fillStyle=fg; c.fill();
  c.strokeStyle="rgba(236,186,104,.4)"; c.lineWidth=1.6;
  c.beginPath(); c.moveTo(W*.1,H*.82); c.lineTo(W*.9,H*.82); c.stroke();
  c.strokeStyle="rgba(236,186,104,.12)"; c.lineWidth=1;
  for(let i=1;i<8;i++){
    const y=H*.82+(H*.18)*(i/8);
    c.beginPath(); c.moveTo(W*.1*(1-i/8),y); c.lineTo(W-W*.1*(1-i/8),y); c.stroke();
  }
  for(let i=0;i<=10;i++){
    const k=i/10;
    c.beginPath(); c.moveTo(W*.1+k*W*.8,H*.82); c.lineTo(k*W,H); c.stroke();
  }
}

function choosePage(pageId){
  if(!reception||reception.phase!=="select"||busy) return;
  const page=PAGE_BY[pageId]; if(!page) return;
  if(reception.light<page.cost||reception.emotion<page.emotion) return;
  SFX.tak();
  reception.chosenPageId=pageId;
  reception.light-=page.cost;
  syncResources();
  removeOne(reception.handIds,pageId);
  reception.discardIds=reception.discardIds||[];
  reception.discardIds.push(pageId);
  reception.phase="question";
  renderBattle();
  takPunch(reception.turn);
}

function currentQuestion(){
  const rec=reception, guest=GUEST_BY[rec.guestId];
  if(rec.intent&&rec.intent.big){ const bank=rec.keyQuiz; return {q:bank[rec.keyIdx%bank.length],isKey:true}; }
  const bank=rec.quiz||guest.questions;
  return {q:bank[rec.qIndex%bank.length],isKey:false};
}
let vvCleanup=null;

function answer(opt){
  if(!reception||reception.phase!=="question"||busy) return;
  const {q,isKey}=currentQuestion();

}
function answerShort(text){

function finishAnswer(correct,q,isKey,typed){
  const rec=reception, page=PAGE_BY[rec.chosenPageId];
  if(vvCleanup) vvCleanup();
  try{ document.activeElement&&document.activeElement.blur(); }catch(e){}
  if(isKey) rec.keyIdx=(rec.keyIdx||0)+1; else rec.qIndex++;
  runScene({page,correct,isKey,q,typed});
}

function runScene(o){
  const rec=reception, guest=GUEST_BY[rec.guestId], page=o.page, asked=!!o.q, correct=!!o.correct;
  const gt=withKeyMods(giftTotals(save),save);
  const gDice=rec.g.stag>0?null:(rec.intent?rec.intent.dice:null);
  const pDice=(page&&rec.p.stag===0)?page.dice:null;
  rec.lastCorrect=correct; rec.crit=asked&&o.isKey&&correct; rec.lastKey=!!o.isKey; rec.lastQ=o.q||null;
  const steps=resolveScene({P:rec.p,G:rec.g,pDice,gDice,correct,isKey:!!o.isKey,emotion:rec.emotion,mods:gt});
  rec.lastSteps=steps;

  let emotion=rec.emotion, charge=rec.emotionCharge, combo=rec.combo, emoUp=false;
  if(asked){
    combo=correct?combo+1:0;
    if(correct){ charge+=1; if(charge>=COMBAT.chargesPerEmotion && emotion<COMBAT.emotionMax){ emotion+=1; charge=0; emoUp=true; } }
    else charge=0;
  }
  const defeated=rec.g.hp<=0;
  const playerDead=rec.p.hp<=0&&!defeated;
  const firstClear=defeated && !save.conqueredIds.includes(guest.id);
  const nextQ=save.questionsAnswered+(asked?1:0);
  const nextWins=save.receptionsWon+(firstClear?1:0);

  let nextLevel=save.level,nextXp=save.xp,nextMax=save.maxHp,levelMsg="";
  if(defeated){
    nextXp+=COMBAT.xpByWeakness[guest.weakness];
    let need=xpNeeded(nextLevel); const msgs=[];
    while(nextXp>=need){ nextXp-=need; nextLevel++; nextMax+=COMBAT.hpPerLevel; need=xpNeeded(nextLevel); msgs.push(`${pick(LEVEL_UP_MESSAGES)} (Lv.${nextLevel})`); }
    if(msgs.length) levelMsg=msgs.join(" ");
  }
  steps.forEach(st=>{
    const bits=[];
    if(st.pd) bits.push(`내 ${st.pd.type} ${st.pd.roll}`);
    if(st.gd) bits.push(`손님 ${st.gd.type} ${st.gd.roll}`);
    rec.log.push(`${bits.join(" vs ")} → ${st.outcome==="P"?"내가 우세":st.outcome==="G"?"손님이 우세":st.outcome==="tie"?"무승부":"공방 없음"}`);
    st.newStag.forEach(t=>rec.log.push(t==="G"?`${guest.concept} 손님이 흐트러졌다!`:"사서가 흐트러졌다!"));
  });
  if(asked&&!correct) rec.log.push("해설 · "+guest.explanation);
  if(emoUp){
    rec.pendingDraw=(rec.pendingDraw||0)+1;
    rec.pendingLight=(rec.pendingLight||0)+1;
  }
  if(defeated) rec.log.push(firstClear?`${guest.concept} 손님이 책이 되었다.`:`재접대를 마쳤다.`);

  if(asked){
    const rst=ensureRecall(guest.id); rst.total++; if(correct) rst.correct++;
    const prevStat=save.conceptStats[guest.id]||{correct:0,total:0};
    save.conceptStats={...save.conceptStats,[guest.id]:{correct:prevStat.correct+(correct?1:0),total:prevStat.total+1}};
  }
  save.maxHp=nextMax; save.level=nextLevel; save.xp=nextXp; save.hp=effectiveMaxHp(save);
  save.questionsAnswered=nextQ; save.receptionsWon=nextWins;
  let bookGain=0;
  if(defeated){ bookGain=firstClear?BOOK_RULES.firstClear:rollRecallBooks(); addBooks(save,guest.id,bookGain); }
  rec.bookGain=bookGain;
  if(firstClear){ save.conqueredIds=[...save.conqueredIds,guest.id]; }
  persist();

  rec.emotion=emotion; rec.emotionCharge=charge; rec.combo=combo;
  rec.levelUpMessage=levelMsg; rec.emoUp=emoUp;
  rec.maxLight=Math.min(COMBAT.maxLightCap,COMBAT.baseLight+emotion);
  rec.phase="rolling";
  if(asked&&!correct) wrongFeedback();
  animateScene(steps, defeated, playerDead, asked&&!correct?{q:o.q,typed:o.typed}:null);
}

let gxExTimer=0;

function gxExSet(ex){ const sv=$("#gst-char svg.gx"); if(!sv) return; if(ex==null){ if(!gxExTimer) sv.dataset.ex="e0"; } else sv.dataset.ex=ex; }

function gxAttack(big){

/* 적 주사위 대상 다시 잇기: 원래 노린 대상으로 되돌린 뒤, 배치한 순서대로 "내 주사위가 더 빠르면 그 적 주사위를 나에게 끌어온다" */
function mbRelink(){
  for(const u of mbSide("enemy")){ const X=mb.x[u.id]; u.dice.forEach((d,k)=>{ const o=X.orig[k]; d.target=o?{unit:o.unit,die:o.die}:null; }); }
  const acts=[];
  for(const u of mbSide("ally")) u.dice.forEach((d,i)=>{ if(d.card&&d.target) acts.push({u,i,d,seq:mb.x[u.id].seq[i]||0}); });
  acts.sort((a,b)=>a.seq-b.seq);
  for(const a of acts){
    const t=a.d.target; if(t.die==null) continue;
    const tu=mbUnit(t.unit), td=tu&&tu.dice[t.die]; if(!td) continue;
    const already=td.target&&td.target.unit===a.u.id&&td.target.die===a.i;
    if(!already&&a.d.speed>td.speed) td.target={unit:a.u.id,die:a.i};

}
function mbIsClash(uid,i){
  const u=mbUnit(uid), d=u&&u.dice[i]; if(!d||!d.target||d.target.die==null) return false;
  const tu=mbUnit(d.target.unit), td=tu&&tu.dice[d.target.die];

function mbAssign(unitId,dieIdx,cardId,target){
  const B=mb&&mb.battle; if(!B||B.phase!=="assign") return {ok:false,reason:"phase"};
  const u=mbUnit(unitId); if(!u||u.side!=="ally"||u.hp<=0) return {ok:false,reason:"unit"};
  const d=u.dice[dieIdx]; if(!d) return {ok:false,reason:"die"};
  const X=mb.x[u.id], page=PAGE_BY[cardId]; if(!page) return {ok:false,reason:"card"};
  const prev=d.card;
  if(!X.handIds.includes(cardId)&&prev!==cardId) return {ok:false,reason:"not-in-hand"};
  const refund=prev?(PAGE_BY[prev].cost||0):0;
  if((page.cost||0)>u.light+refund) return {ok:false,reason:"light"};
  if((page.emotion||0)>u.emotion) return {ok:false,reason:"emotion"};
  const tu=target&&mbUnit(target.unit);
  if(!tu||tu.side!=="enemy"||tu.hp<=0) return {ok:false,reason:"target"};
  const tdie=target.die==null?null:+target.die;
  if(tdie!=null&&!tu.dice[tdie]) return {ok:false,reason:"target-die"};
  if(prev){ X.handIds.push(prev); u.light+=refund; }

}
function mbUnassign(unitId,dieIdx){
  const B=mb&&mb.battle; if(!B||B.phase!=="assign") return false;
  const u=mbUnit(unitId), d=u&&u.dice[dieIdx]; if(!d||!d.card||u.side!=="ally") return false;
  const X=mb.x[u.id]; X.handIds.push(d.card); u.light+=(PAGE_BY[d.card].cost||0);

}
function mbDiceOf(u,i){ return u.side==="ally"?PAGE_BY[u.dice[i].card].dice:mb.x[u.id].diePages[i].dice; }
/* 막 풀기: 모든 주사위를 속도 순(빠른 것부터)으로. 서로 노린 두 주사위는 합(기존 resolveScene), 아니면 일방 공격 */
function mbResolve(){
  const B=mb&&mb.battle; if(!B||B.phase!=="assign") return null;
  B.phase="resolve";
  const acts=[];
  for(const u of B.units){ if(u.hp<=0||mb.x[u.id].cu.stag>0) continue; u.dice.forEach((d,i)=>{ if(d.card) acts.push({u,i,d}); }); }
  acts.sort((a,b)=>b.d.speed-a.d.speed||(a.u.side===b.u.side?0:a.u.side==="ally"?-1:1)||a.u.slot-b.u.slot||a.i-b.i);
  const done=new Set(), K=(id,i)=>id+":"+i, events=[];
  const snap=()=>Object.fromEntries(B.units.map(u=>[u.id,{hp:u.hp,stagger:u.stagger,staggered:u.staggered}]));
  for(const a of acts){
    if(mb.outcome) break;
    if(done.has(K(a.u.id,a.i))) continue;
    done.add(K(a.u.id,a.i));
    if(a.u.hp<=0||mb.x[a.u.id].cu.stag>0){ events.push({kind:"skip",by:{unit:a.u.id,die:a.i},speed:a.d.speed}); continue; }
    const t=a.d.target; let tu=t&&mbUnit(t.unit), partner=null;
    if(tu&&tu.hp>0&&t.die!=null&&tu.dice[t.die]&&!done.has(K(tu.id,t.die))&&mbIsClash(a.u.id,a.i)&&mb.x[tu.id].cu.stag===0) partner={u:tu,i:t.die};
    if(!tu||tu.hp<=0){ const pool=mbLive(a.u.side==="ally"?"enemy":"ally"); if(!pool.length) continue; tu=pool[Math.floor(mb.rng()*pool.length)]; partner=null; }
    if(partner) done.add(K(partner.u.id,partner.i));
    const ally=a.u.side==="ally"?a.u:tu, enemy=a.u.side==="ally"?tu:a.u;
    const allyDie=a.u.side==="ally"?a.i:(partner?partner.i:null), enemyDie=a.u.side==="enemy"?a.i:(partner?partner.i:null);
    const pDice=allyDie!=null?mbDiceOf(ally,allyDie):null, gDice=enemyDie!=null?mbDiceOf(enemy,enemyDie):null;
    const AX=mb.x[ally.id], EX=mb.x[enemy.id];
    const shift=mb.bonus?mb.bonus+Math.floor((ally.emotion||0)/2):0;
    const steps=resolveScene({P:AX.cu,G:EX.cu,pDice,gDice,correct:false,isKey:false,rng:mb.rng,mods:AX.mods,stMul:1,
      pRangeFn:d=>{ const lo=Math.max(1,d.min+(AX.mods.dieMin||0)+shift); return [lo,Math.max(lo,d.max+shift)]; },
      gRangeFn:d=>{ const lo=Math.max(1,d.min); return [lo,Math.max(lo,d.max)]; }});
    mbSync(ally); mbSync(enemy);
    const clash=!!(pDice&&gDice);
    const res={kind:clash?"clash":"one-sided",by:{unit:a.u.id,die:a.i},speed:a.d.speed,ally:ally.id,allyDie,enemy:enemy.id,enemyDie,
      allyCard:allyDie!=null?ally.dice[allyDie].card:null,enemyCard:enemyDie!=null?enemy.dice[enemyDie].card:null,
      win:clash?(steps.filter(s=>s.outcome==="P").length>steps.filter(s=>s.outcome==="G").length?"ally":steps.some(s=>s.outcome!=="tie"&&s.outcome!=="none")?"enemy":"tie"):null,
      steps,snap:snap()};
    if(clash&&steps.some(s=>s.outcome==="P")) mbCharge(ally,1);
    steps.forEach(s=>s.newStag.forEach(w=>mb.log.push(`${(w==="P"?ally:enemy).name}이(가) 흐트러졌다!`)));
    events.push(res);
    if(clash) mbEmit("onClash",res);
    if(!mbLive("enemy").length) mb.outcome="win"; else if(!mbLive("ally").length) mb.outcome="lose";
  }
  for(const u of mbSide("ally")){ const X=mb.x[u.id]; u.dice.forEach(d=>{ if(d.card){ X.discardIds.push(d.card); if(d.card==="breathe") X.breathe++; } }); }
  for(const u of B.units) u.status=(u.status||[]).map(s=>typeof s.turns==="number"?{...s,turns:s.turns-1}:s).filter(s=>typeof s.turns!=="number"||s.turns>0);
  mb.events=events;
  mbEmit("onSceneEnd",{scene:B.scene,events});
  if(mb.outcome){ B.phase="end"; mbFinish(); }
  return events;
}
function mbFinish(){

/* 달의 계시: 오늘 퀴즈 점수비. 순수 함수라 테스트에서 오늘 날짜를 직접 넣을 수 있다. */
function todaySeoul(){ return new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Seoul"}); }
function moonBonus(s, todayStr){
  const m=s&&s.moon;
  if(!m||typeof m!=="object"||m.used===true) return {ratio:0,active:false};
  if(m.date!==todayStr) return {ratio:0,active:false};
  const reveal=Number(m.reveal), replay=Number(m.replay);
  const a=Number.isFinite(reveal)?Math.max(0,reveal):0;
  const b=Number.isFinite(replay)?Math.max(0,replay):0;
  return {ratio:Math.min(30,a+0.5*b)/30, active:true};
}
function moonAdjustedRate(isRecall, moon){
  const R=EGO_GIFT_RULES;
  let rate=isRecall?R.dropRateRecall:R.dropRateFirstClear;
  if(moon&&moon.active) rate=Math.min(isRecall?R.moonRecallCap:R.moonFirstCap, rate+R.moonBonusMax*moon.ratio);
  return rate;
}
/* 기프트는 그 접대에 나선 사서에게만 떨어진다. 이미 가진 기프트는 능력이 쌓이지 않는다. */

  if(!pool.length) return null;
  const applied=moon!==undefined?moon:moonBonus(save, todaySeoul());
  if(applied.active&&save.moon&&save.moon.used!==true){ save.moon.used=true; persist(); }
  L.pity[guest.id]=(L.pity[guest.id]||0)+1;
  const rate=moonAdjustedRate(!!isRecall, applied);
  const pity=EGO_GIFT_RULES.pityEvery && L.pity[guest.id]>=EGO_GIFT_RULES.pityEvery;
  if(!(Math.random()<rate || pity)) return null;
  const w=pool.map(g=>owned.has(g.id)?1:EGO_GIFT_RULES.newWeight), sum=w.reduce((a,b)=>a+b,0);
  let r=Math.random()*sum, item=pool[0]; for(let i=0;i<pool.length;i++){ if(r<w[i]){ item=pool[i]; break; } r-=w[i]; }
  L.pity[guest.id]=0;
  const dup=owned.has(item.id);
  if(dup){ const out={item,dup:true,libId:L.id,libName:L.name}; if(applied.active) out.moon=applied.ratio; return out; }
  L.gifts.owned=[...L.gifts.owned,item.id];
  if(!L.gifts.equipped[item.slot]) L.gifts.equipped[item.slot]=item.id;
  const out={item,dup:false,libId:L.id,libName:L.name};
  if(applied.active) out.moon=applied.ratio;
  return out;
}
function finishReceptionStats(guest, won){
  const st=ensureRecall(guest.id);
  const rec=reception;
  if(rec&&rec.isRecall){ st.recalls++; if(won) st.wins++; }
  else if(won){ st.wins++; }
  const tot=rec&&rec.sessionTotal||0, ok=rec&&rec.sessionCorrect||0;
  if(tot){ st.history=[...(st.history||[]), ok/tot].slice(-5); }
  save.recallStats={...save.recallStats, [guest.id]:st};
}

/* keep the list scroll position when a tap re-renders the same scene (deck equip, filters, gifts, cosmetics, books) */
function withScroll(sceneId,fn){
  let lastEpoch=-1;
  return function(...a){
    const el=document.getElementById(sceneId);
    const keep=lastEpoch===sceneEpoch&&el&&el.classList.contains("on");
    const nodes=()=>[el,...el.querySelectorAll(".page-scroll")];
    const tops=keep?nodes().map(n=>n.scrollTop):[];
    const r=fn.apply(this,a);
    lastEpoch=sceneEpoch;
    if(keep){ nodes().forEach((n,i)=>{ if(tops[i]) n.scrollTop=tops[i]; }); }
    return r;
  };
}

/* ============================================================
 * 달의 계시 / 달의 재현시 — 하루 1회 영단어 스피드 퀴즈 (4지선다 탭)
 * 계시: 오늘 분량(MOON_PER_DAY) × MOON_SEC_PER_WORD 초. 단어→뜻 / 뜻→단어 섞어서.
 * 재현시: 계시에서 틀리거나 못 푼 단어만, 같은 단어당 시간. 건너뛰기 가능.
 * 끝나면 save.moon = {date, reveal, replay, used:false} (보너스 계산·used 처리는 전투 쪽)
 * ============================================================ */
const MOON_PER_DAY=30;          // 하루 단어 수 — 여기 하나만 바꾸면 된다
const MOON_SEC_PER_WORD=2.5;    // 단어당 제한 시간(초)
const MOON_OK_MS=170, MOON_BAD_MS=650;  // 정답/오답 표시 시간 (이동 중엔 타이머 멈춤)
const Moon=(()=>{
  let nowFn=()=>new Date();
  const fmt=(()=>{ try{ return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}); }catch(e){ return null; } })();
  function today(){
    const d=nowFn();
    if(fmt){ const p={}; fmt.formatToParts(d).forEach(x=>p[x.type]=x.value); return `${p.year}-${p.month}-${p.day}`; }
    const k=new Date(d.getTime()+9*3600e3); return k.toISOString().slice(0,10);
  }
  /* 실제 단어(assets/data/moon-words.js → window.MOON_WORDS)가 있으면 그것, 없으면(404) 예시(moon-words.sample.js) */
  const isSample=()=>!(Array.isArray(window.MOON_WORDS)&&window.MOON_WORDS.length);
  const words=()=>(isSample()?(Array.isArray(window.MOON_WORDS_SAMPLE)?window.MOON_WORDS_SAMPLE:[]):window.MOON_WORDS).filter(x=>x&&x.w&&x.m);
  const doneToday=()=>!!(save.moon&&save.moon.date===today());
  const chunkCount=()=>Math.max(1,Math.ceil(words().length/MOON_PER_DAY));
  function todaysWords(){
    const all=words(); if(!all.length) return [];
    const ci=((save.moonChunk|0)%chunkCount()+chunkCount())%chunkCount();
    let set=all.slice(ci*MOON_PER_DAY,(ci+1)*MOON_PER_DAY);
    // 마지막 묶음이 모자라면 처음부터 채운다 (중복 없이)
    for(let i=0;set.length<Math.min(MOON_PER_DAY,all.length);i++) if(!set.includes(all[i])) set.push(all[i]);
    return set;
  }
  function buildQ(word,dir){
    const all=words(), key=dir==="w2m"?"m":"w";
    const seen=new Set([word[key]]);
    const pick=pool=>shuffle(pool).filter(x=>{ if(seen.has(x[key])) return false; seen.add(x[key]); return true; });
    let d=pick(all.filter(x=>x!==word&&x.pos===word.pos)).slice(0,3);
    if(d.length<3) d=d.concat(pick(all.filter(x=>x!==word&&x.pos!==word.pos)).slice(0,3-d.length));
    const opts=shuffle([word,...d]);
    return {word,dir,prompt:dir==="w2m"?word.w:word.m,options:opts.map(x=>x[key]),correctIndex:opts.indexOf(word)};
  }
  function buildRound(list){
    // 방향 반반 섞기 (각 문제마다 무작위 + 최소 한쪽씩 보장)
    const dirs=list.map((_,i)=>i%2?"w2m":"m2w"); const sd=shuffle(dirs);
    return shuffle(list).map((w,i)=>buildQ(w,sd[i]));
  }
  /* ---- 상태 ---- */
  let st=null, raf=0, advT=0;
  const timeLeft=()=>{ if(!st) return 0; const used=st.used+(st.runFrom?performance.now()-st.runFrom:0); return Math.max(0,st.limit-used); };
  function startRound(kind,list){
    cancelAnimationFrame(raf); clearTimeout(advT);
    const prev=st||{};
    st={kind,qs:buildRound(list),i:0,correct:0,wrong:[],limit:list.length*MOON_SEC_PER_WORD*1000,used:0,runFrom:0,
        reveal:prev.reveal, revealTotal:prev.revealTotal, wrongFromReveal:prev.wrongFromReveal, phase:"quiz", lock:false};
    render(); st.runFrom=performance.now(); tick();
  }
  function tick(){
    if(!st||st.phase!=="quiz") return;
    const left=timeLeft(), bar=$("#moon-timebar"), num=$("#moon-time");
    if(bar) bar.style.transform=`scaleX(${(left/st.limit).toFixed(4)})`;
    if(num) num.textContent=(left/1000).toFixed(left<10000?1:0);
    const wrap=$(".moon-timer"); if(wrap) wrap.classList.toggle("low",left<5000);
    if(left<=0){ endRound(); return; }
    raf=requestAnimationFrame(tick);
  }
  function pause(){ if(st&&st.runFrom){ st.used+=performance.now()-st.runFrom; st.runFrom=0; } }
  function resume(){ if(st&&!st.runFrom&&st.phase==="quiz"){ st.runFrom=performance.now(); } }
  function answer(idx){
    if(!st||st.phase!=="quiz"||st.lock) return;
    const q=st.qs[st.i]; if(!q) return;
    st.lock=true; pause();
    const ok=idx===q.correctIndex;
    const btns=$$("#scene-moon [data-mopt]");
    btns.forEach((b,i)=>{ b.disabled=true; if(i===q.correctIndex) b.classList.add("ok"); else if(i===idx) b.classList.add("bad"); });
    if(ok){ st.correct++; SFX.click(); }
    else { st.wrong.push(q.word); moonBonk(); }
    const sc=$("#moon-score"); if(sc) sc.textContent=st.correct;
    advT=setTimeout(()=>{ if(!st) return; st.i++; st.lock=false; if(st.i>=st.qs.length) endRound(); else { paintQ(); resume(); } }, ok?MOON_OK_MS:MOON_BAD_MS);
  }
  function moonBonk(){
    SFX.wrongBonk();
    const root=$("#shake"), card=$("#moon-qcard");
    if(root){ root.classList.remove("wrong-shake"); void root.offsetWidth; root.classList.add("wrong-shake"); setTimeout(()=>root.classList.remove("wrong-shake"),520); }
    if(card&&root){
      const r=card.getBoundingClientRect(), R=root.getBoundingClientRect();
      const book=document.createElement("div"); book.className="wrong-book"; book.style.left=(r.left-R.left+r.width/2)+"px"; book.style.top=(r.top-R.top+14)+"px"; book.innerHTML=WRONG_BOOK_SVG;
      root.appendChild(book); setTimeout(()=>book.remove(),600);

    }
  }
  function endRound(){

    // 시간 초과로 못 푼 단어는 틀린 것으로 (재현시에 다시 나온다)

      st.reveal=st.correct; st.revealTotal=st.qs.length; st.wrongFromReveal=st.wrong.slice();

  function finish(replay){

  function skipReplay(){ if(!st||st.phase==="result") return; cancelAnimationFrame(raf); clearTimeout(advT); pause(); finish(st.kind==="replay"?st.correct:0); }
  function open(){

  }
  function close(){ cancelAnimationFrame(raf); clearTimeout(advT); pause(); st=null; transit("lobby",()=>renderLobby()); }
  /* ---- 화면 ---- */
  const CLOCK=`<svg class="ico" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg>`;
  const E=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const POS={v:"동사",n:"명사",adj:"형용사",adv:"부사",prep:"전치사",conj:"접속사"};
  function moonSvg(s=64,cls=""){ return `<svg class="moon-art ${cls}" viewBox="0 0 64 64" width="${s}" height="${s}" aria-hidden="true"><defs><radialGradient id="mg${s}" cx="38%" cy="34%" r="70%"><stop offset="0" stop-color="#fbf5e4"/><stop offset=".6" stop-color="#d9d2c0"/><stop offset="1" stop-color="#8f8a9e"/></radialGradient></defs><circle cx="32" cy="32" r="22" fill="url(#mg${s})"/><circle cx="24" cy="38" r="4.6" fill="#000" opacity=".08"/><circle cx="37" cy="22" r="2.4" fill="#000" opacity=".07"/><circle cx="42" cy="41" r="1.7" fill="#000" opacity=".07"/><circle cx="32" cy="32" r="27" fill="none" stroke="#cfd6ff" stroke-opacity=".28" stroke-width="1"/></svg>`; }
  function head(title,sub){
    return `<div class="moon-head">
      <button class="x-btn moon-x" id="moon-close" type="button" aria-label="접대로 돌아가기"><span class="x-ico"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2 12 12M12 2 2 12"/></svg></span></button>
      <div class="moon-ttl">${moonSvg(22)}<b>${title}</b>${sub?`<span class="moon-sub">${sub}</span>`:""}</div>
    </div>`;
  }
  function paintQ(){
    const q=st.qs[st.i]; if(!q) return;
    const card=$("#moon-qcard"), grid=$("#moon-opts");

      begin(guestId,o){ o=o||{}; if(o.rng){ const r=o.rng; beginMultiReception(guestId); if(mb) mb.rng=r; } else beginMultiReception(guestId); return mb&&mb.battle; },
      create(guestId,o){ mb=mbCreate(guestId,o); reception={guestId,multi:true,isRecall:mb.isRecall,librarianIds:mb.battle.units.filter(u=>u.side==="ally").map(u=>u.libId),sessionCorrect:0,sessionTotal:0,droppedGift:null,phase:"multi",log:mb.log,bookGain:0,levelUpMessage:""}; mbStartScene(); return mb.battle; },
      answer(correct){ return mbAnswer(correct); }, answerUI:(c)=>mbAnswerUI(c),
      assign(unitId,dieIdx,cardId,target){ const r=mbAssign(unitId,dieIdx,cardId,target); mbRefresh(); return r; },
      unassign(unitId,dieIdx){ const r=mbUnassign(unitId,dieIdx); mbRefresh(); return r; },
      resolve(o){ return mbRunResolve(!(o&&o.animate)); }, resolveOnly:()=>mbResolve(), startScene(){ mbStartScene(); mbRefresh(); return mb.battle; },
      relink:()=>mbRelink(), isClash:(u,i)=>mbIsClash(u,i),
      setRng(fn){ if(mb) mb.rng=fn; },
      setEnemyTarget(eid,k,target){ const X=mb.x[eid]; X.orig[k]=target?{unit:target.unit,die:target.die}:null; mbRelink(); mbRefresh(); },
      hand:(uid)=>mb.x[uid].handIds, cardOf:(cid)=>mb.cards[cid]||PAGE_BY[cid]||null, internals:()=>mb.x, get mb(){ return mb; },
      get outcome(){ return mb&&mb.outcome; }, get current(){ return mb&&mb.cur; },
      enemyStats, hooks:MB_HOOKS, ENEMY_STATS, MB, libMods, libStartLight, libStartEmotion, libLightRegen, libDeckIds
    },
    libs:{unlockedCount:libUnlockedCount,nextAt:libNextAt,list:libsList,equipKey:libsEquipKey,setParty:libsSetParty,keyOf:libsKeyOf,sync:syncLibs,UNLOCK_AT:LIB_UNLOCK_AT,ORDER:LIB_ORDER,PARTY_MAX},
    debugPhotos(){ return FX.debugPhotos(); },
    openDeckEditor, renderDeckEditor, isDeckReady, activeDeck, ownedPageIds,
    giveAllPages(){ save.unlockedPageIds=COMBAT_PAGES.map(p=>p.id); ensureDecks(save); persist(); },
    setDeckPages(ids){ const d=activeDeck(save); d.pageIds=(ids||[]).slice(0,DECK_MAX); persist(); },
    get reception(){return reception;},
    playClashWin(){
      if(reception&&reception.phase==="select"){
        const p=reception.handIds.find(id=>PAGE_BY[id]&&PAGE_BY[id].cost<=reception.light&&PAGE_BY[id].emotion<=reception.emotion);
        if(p){
          choosePage(p);
          setTimeout(()=>{
            const bank=reception.quiz||GUEST_BY[reception.guestId].questions;
            const q=bank[reception.qIndex%bank.length];
            answer(q.correctIndex);
          }, 80);
        }
      }
    },
    openCardInspect, closeCardInspect,
    openGuestSheet, closeGuestSheet, showGuestLineup, hideGuestLineup,
    giftTotals, bonusLabel
  };
}

document.addEventListener("DOMContentLoaded", boot);
</script></body></html>
