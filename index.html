function rollRarity(pitySr,pitySsr){
  if(pitySsr+1>=GACHA_RULES.ssrPity) return "SSR";
  if(pitySr+1>=GACHA_RULES.srPity) return Math.random()<0.2?"SSR":"SR";
  const roll=Math.random()*100;
  const n=GACHA_RULES.rates.N, r=n+GACHA_RULES.rates.R, sr=r+GACHA_RULES.rates.SR;
  return roll<n?"N":roll<r?"R":roll<sr?"SR":"SSR";
}
function pickGachaItem(rarity, ownedIds){
  const owned=new Set(ownedIds);
  const unowned=COSMETIC_ITEMS.filter(i=>!owned.has(i.id));
  const of=(rar,only)=>COSMETIC_ITEMS.filter(i=>i.rarity===rar&&(!only||!owned.has(i.id)));
  if(!GACHA_RULES.preferUnowned||!unowned.length){ const p=of(rarity,false); return pick(p.length?p:COSMETIC_ITEMS); }
  let pool=of(rarity,true);
  if(!pool.length){
    const start=RARITY_ORDER.indexOf(rarity);
    for(let i=start+1;i<RARITY_ORDER.length;i++){ pool=of(RARITY_ORDER[i],true); if(pool.length) break; }
    if(!pool.length) for(let i=start-1;i>=0;i--){ pool=of(RARITY_ORDER[i],true); if(pool.length) break; }
    if(!pool.length) pool=unowned;
  }
  return pick(pool);
}

    { const s=c.createBufferSource(); s.buffer=nb; const f=c.createBiquadFilter(); f.type="highpass"; f.frequency.value=4800;

/* ---------- 책/책장 획득 (Ruina식: 책이 쌓이고, 소각하면 그 손님의 책장 풀에서 나온다) ---------- */
function ownedCount(s,id){
  const p=PAGE_BY[id]; if(!p) return 0;
  if(p.starter) return DECK_MAX_COPIES;
  return Math.min(DECK_MAX_COPIES,Math.max((s.pageCounts||{})[id]||0,(s.unlockedPageIds||[]).includes(id)?1:0));
}
function deckLimit(s,id){ return Math.min(DECK_MAX_COPIES,ownedCount(s,id)); }
function bookCount(s,gid){ return Math.max(0,(s.bookCounts||{})[gid]||0); }
function totalBooks(s){ return Object.values(s.bookCounts||{}).reduce((a,b)=>a+Math.max(0,b|0),0); }
function addBooks(s,gid,n){ if(n>0) s.bookCounts={...(s.bookCounts||{}),[gid]:bookCount(s,gid)+n}; return n; }
function rollRecallBooks(rng){ return (rng||Math.random)()<BOOK_RULES.recallOne?1:2; }
function entryName(e){ return e.k==="page"?(PAGE_BY[e.id]||{}).name:(KEY_BY[e.id]||{}).name; }
function entryOwned(s,e){
  return e.k==="page"?{count:ownedCount(s,e.id),cap:DECK_MAX_COPIES}:{count:(s.unlockedKeyIds||[]).includes(e.id)?1:0,cap:1};
}
/* 가중치: 미보유 ×3 (연속으로 새 책장을 못 얻을수록 추가 가산), 보유 1장이면 ×0.5, 상한이면 제외.
   pityGuarantee번 연속 중복이면 미보유 책장만 나온다. */
function poolEntries(s,gid){
  const pity=((s.bookPity||{})[gid])||0;
  const list=(BOOK_POOLS[gid]||[]).map(e=>{
    const o=entryOwned(s,e); let w=0;
    if(o.count<o.cap) w=e.w*(o.count===0?BOOK_RULES.newMul*(1+pity*.8):BOOK_RULES.dupMul);
    return {...e,count:o.count,cap:o.cap,w};
  });
  if(pity>=BOOK_RULES.pityGuarantee && list.some(e=>e.count===0)) list.forEach(e=>{ if(e.count>0) e.w=0; });
  const sum=list.reduce((a,e)=>a+e.w,0);
  list.forEach(e=>{ e.rate=sum?e.w/sum:0; });
  return list;
}
function grantEntry(s,e){
  if(e.k==="page"){
    s.pageCounts={...(s.pageCounts||{}),[e.id]:Math.min(DECK_MAX_COPIES,ownedCount(s,e.id)+1)};
    if(!s.unlockedPageIds.includes(e.id)) s.unlockedPageIds=[...s.unlockedPageIds,e.id];
  } else if(!s.unlockedKeyIds.includes(e.id)) s.unlockedKeyIds=[...s.unlockedKeyIds,e.id];
}
function burnBookOnce(s,gid,rng){
  if(bookCount(s,gid)<1) return {ok:false,why:"책이 없다"};
  const list=poolEntries(s,gid);
  if(!list.some(e=>e.w>0)) return {ok:false,why:"이 책의 책장을 모두 모았다"};
  let r=(rng||Math.random)()*list.reduce((a,e)=>a+e.w,0), pick=list.find(e=>e.w>0);
  for(const e of list){ if(e.w<=0) continue; if(r<e.w){ pick=e; break; } r-=e.w; }
  const isNew=pick.count===0;
  grantEntry(s,pick);
  s.bookCounts={...s.bookCounts,[gid]:bookCount(s,gid)-1};
  s.bookPity={...(s.bookPity||{}),[gid]:isNew?0:(((s.bookPity||{})[gid])||0)+1};
  return {ok:true,entry:pick,isNew,name:entryName(pick)};
}
/* 어느 손님의 책에서 나오는가 */
function sourcesOf(kind,id){
  return Object.keys(BOOK_POOLS).filter(gid=>GUEST_BY[gid]&&BOOK_POOLS[gid].some(e=>e.k===kind&&e.id===id));
}
function acqAudit(){
  const orphans=[];
  COMBAT_PAGES.forEach(p=>{ if(!p.starter&&!sourcesOf("page",p.id).length) orphans.push("page:"+p.id); });
  KEY_PAGES.forEach(k=>{ if(k.id!=="novice"&&!sourcesOf("key",k.id).length) orphans.push("key:"+k.id); });
  const bad=[];
  Object.entries(BOOK_POOLS).forEach(([gid,l])=>{ if(!GUEST_BY[gid]) bad.push("guest:"+gid); l.forEach(e=>{ if(!(e.k==="page"?PAGE_BY[e.id]:KEY_BY[e.id])) bad.push(gid+":"+e.id); }); });
  return {orphans,bad,ok:!orphans.length&&!bad.length};
}
/* 구버전 저장 이전: 책 상태(shelved/read/burned)는 모두 책 1권으로 환산 → 아무것도 잃지 않는다 */
function migrateAcq(s,r){
  s.bookCounts={};
  WEAK_POINTS.forEach(g=>{
    const st=(r.books||{})[g.id];
    if(st||(r.conqueredIds||[]).includes(g.id)) s.bookCounts[g.id]=1;
  });
  s.pageCounts={};
  (s.unlockedPageIds||[]).forEach(id=>{ if(PAGE_BY[id]&&!PAGE_BY[id].starter) s.pageCounts[id]=1; });
  s.bookPity={};
  s.books={};
  s.acqV=2;
  return s;
}

/* 구버전(전역 egoOwned/egoEquipped) → 사서별 기프트. 보유는 모두 유지, 같은 부위에 겹치면 먼저 장착된 것만 착용. */
function migrateLibrarians(s,r){
  const lib=mkLibrarian(LIB_DEFAULT_ID,"큐 양");
  lib.gifts.owned=[...new Set((Array.isArray(r.egoOwned)?r.egoOwned:[]).filter(id=>EGO_BY[id]))];
  Object.values(r.egoEquipped||{}).forEach(id=>{ const g=EGO_BY[id]; if(g&&lib.gifts.owned.includes(id)&&!lib.gifts.equipped[g.slot]) lib.gifts.equipped[g.slot]=id; });
  lib.pity=r.egoPity&&typeof r.egoPity==="object"?{...r.egoPity}:{};
  s.librarians={[LIB_DEFAULT_ID]:lib}; s.activeLibrarianId=LIB_DEFAULT_ID; s.libV=2;
  delete s.egoOwned; delete s.egoEquipped; delete s.egoPity;
  return s;

function sanitizeLibrarians(s){
  s.librarians=s.librarians&&typeof s.librarians==="object"?s.librarians:{};
  if(!s.librarians[LIB_DEFAULT_ID]) s.librarians[LIB_DEFAULT_ID]=mkLibrarian(LIB_DEFAULT_ID,"큐 양");
  for(const [k,L] of Object.entries(s.librarians)){

    L.gifts=L.gifts||{owned:[],equipped:{}};
    L.gifts.owned=[...new Set((L.gifts.owned||[]).filter(id=>EGO_BY[id]))];

}

const DECK_MIN=6, DECK_MAX=20;   /* 덱은 6~20장 (기존 6장 덱도 그대로 유효) */

function ownedPageIds(s){

function defaultDeckIds(s){

  s.decks.forEach((d,i)=>{
    d.id=d.id||("deck-"+(i+1));
    d.name=d.name||("제"+(i+1)+" 덱");
    const used={};
    d.pageIds=(d.pageIds||[]).filter(id=>{
      if(!owned.has(id)) return false;
      used[id]=(used[id]||0)+1;
      return used[id]<=deckLimit(s,id);
    }).slice(0,DECK_MAX);
  });
  if(!s.decks.some(d=>d.id===s.activeDeckId)) s.activeDeckId=s.decks[0].id;
  return s;
}
function activeDeck(s){
  ensureDecks(s);
  return s.decks.find(d=>d.id===s.activeDeckId)||s.decks[0];
}
function isDeckReady(s){
  const d=activeDeck(s);
  return !!(d&&d.pageIds.length>=DECK_MIN&&d.pageIds.length<=DECK_MAX&&d.pageIds.every(id=>PAGE_BY[id]));
}
function pageFloorName(p){
  if(!p||!p.floorId) return "기본";
  return (FLOORS.find(f=>f.id===p.floorId)||{}).name||p.floorId;
}
function pagePrimaryType(p){ return (p.dice&&p.dice[0]&&p.dice[0].type)||""; }
function removeOne(arr,id){
  const i=arr.indexOf(id);
  if(i>=0) arr.splice(i,1);
  return arr;
}
function drawPages(rec,n){
  const got=[];
  for(let i=0;i<n;i++){
    if(rec.handIds.length>=HAND_MAX) break;
    if(!rec.deckIds.length){
      if(!rec.discardIds.length) break;
      rec.deckIds=shuffle(rec.discardIds);
      rec.discardIds=[];
      rec.log.push("사용한 책장을 다시 섞었다.");
    }
    if(!rec.deckIds.length) break;
    const id=rec.deckIds.shift();
    rec.handIds.push(id);
    got.push(id);
  }
  return got;
}
function costCurveHtml(ids){
  const counts={0:0,1:0,2:0,3:0};
  (ids||[]).forEach(id=>{ const c=Math.min(3,PAGE_BY[id]?.cost||0); counts[c]++; });
  const max=Math.max(1,...Object.values(counts));
  const lab={0:"0",1:"1",2:"2",3:"3+"};
  return `<div class="cost-curve frame" aria-label="비용 곡선">${cornerHtml()}
    ${[0,1,2,3].map(c=>`<div class="cc-row"><span>빛 ${lab[c]}</span><div class="cc-track"><i style="width:${Math.round(counts[c]/max*100)}%"></i></div><b>${counts[c]}</b></div>`).join("")}
  </div>`;
}
function waxHtml(r){ r=r||"N"; return `<span class="wax rar-${r}" title="희귀도 ${r}">${r}</span>`; }
function paperLayers(){ return `<div class="paper-fiber"></div><div class="paper-stain"></div>`; }
/* 정답/오답에 따른 주사위 변화 미리보기 — 실제 전투 공식(playerDieRange/guestDieRange)을 그대로 쓴다 */
function previewCtx(){
  const rec=reception; if(!rec||rec.phase!=="select") return null;
  const t=withKeyMods(giftTotals(save),save);
  return {rec,dieMin:t.dieMin||0,isKey:!!(rec.intent&&rec.intent.big&&rec.g.stag<=0)};
}
function myDiePreview(d){
  const c=previewCtx(); if(!c) return null;
  return {ok:playerDieRange(d,true,c.isKey,c.rec.emotion,c.dieMin),ng:playerDieRange(d,false,c.isKey,c.rec.emotion,c.dieMin),isKey:c.isKey};
}
function guestDiePreview(d){
  const c=previewCtx(); if(!c) return null;

function dprevHtml(pv,cls=""){

function paperCardHtml(page, opts={}){
  const mini=!!opts.mini;
  const dice=(page.dice||[]).map(d=>`<span>${dieMark(d.type, mini?10:12)} ${(mini||opts.prev)?"":(d.type+" ")}${d.min}–${d.max}${opts.prev?dprevHtml(myDiePreview(d)):""}</span>`).join("");

function toggleDeckPage(id,opts){
  ensureDecks(save);
  const d=activeDeck(save);
  const have=d.pageIds.filter(x=>x===id).length, lim=deckLimit(save,id);
  if(opts&&opts.slot){ const k=d.pageIds.lastIndexOf(id); if(k>=0) d.pageIds.splice(k,1); }
  else if(have<lim&&d.pageIds.length<DECK_MAX){ d.pageIds.push(id); }
  else if(have>0){ d.pageIds=d.pageIds.filter(x=>x!==id); }       // 한도에 닿으면 한 번 더 눌러 모두 해제
  else if(d.pageIds.length>=DECK_MAX){ toast("덱은 "+DECK_MAX+"장까지입니다"); return; }
  else return;
  persist(); SFX.click(); renderDeckEditor();
}

function transit(next, fn){

}
let sceneEpoch=0;
function showScene(name){

  $$(".scene").forEach(s=>{
    const on=s.id==="scene-"+name;

    else { s.style.transition="none"; s.classList.remove("on"); s.style.visibility="hidden"; }
  });

function toast(msg, ms=1400){ const el=$("#toast"); el.textContent=msg; el.classList.add("on"); setTimeout(()=>el.classList.remove("on"),ms); }
let learnTimer;

  el.innerHTML=html; el.classList.add("on");
  clearTimeout(learnTimer);
  learnTimer=setTimeout(()=>el.classList.remove("on"), ms);

function shake(n=8){
  const el=$("#shake"); let i=0;
  const step=()=>{ i++; el.style.transform=`translate(${(Math.random()*2-1)*n}px,${(Math.random()*2-1)*n}px)`;
    if(i<10) requestAnimationFrame(step); else el.style.transform=""; };
  step();
}
function flash(a=.35){ const f=$("#flash"); f.style.opacity=a; f.style.transition="none"; requestAnimationFrame(()=>{ f.style.transition="opacity .35s ease"; f.style.opacity=0; }); }
/* curator stamp punch synced with SFX.tak(): tiny shake + flash + seal ring (non-blocking) */
function takPunch(turn){
  shake(4); flash(.16);
  const root=$("#shake"); if(!root) return;
  const z=document.querySelector(".clash-zone"); let x=innerWidth/2, y=innerHeight*.45;
  if(z){ const r=z.getBoundingClientRect(); if(r.width){ x=r.left+r.width/2; y=r.top+r.height/2; } }
  const d=document.createElement("div"); d.className="tak-stamp"; d.style.left=x+"px"; d.style.top=y+"px"; d.textContent=turn+"막";
  root.appendChild(d); setTimeout(()=>d.remove(),520);
}
function floatNum(x,y,text,kind,tag){
  const d=document.createElement("div");
  d.className="dmg "+(kind||"hp");
  d.innerHTML=`${tag?`<i class="dtag">${tag}</i>`:""}<span>${text}</span>`;
  d.style.left=x+"px"; d.style.top=y+"px";
  $("#shake").appendChild(d);
  setTimeout(()=>d.remove(),900);
}

function floorDotsHtml(cur){
  const n=FLOORS.length, MAXD=7;
  let a=0,b=n-1;
  if(n>MAXD){ a=Math.max(0,Math.min(n-MAXD,cur-Math.floor(MAXD/2))); b=a+MAXD-1; }
  const dots=[];

    dots.push(`<button class="fn-dot${i===cur?" on":""}${edge?" tiny":""}" type="button" data-fdot="${i}" role="tab" aria-selected="${i===cur}" aria-label="${FLOORS[i].name} (${i+1}/${n})"><i></i></button>`);
  }

}

function bindSheetSwipe(sheet){
  const mobile=()=>window.innerWidth<=860;
  const drag=(dy)=>{ if(dy>0) sheet.style.transform=mobile()?`translateY(${dy}px)`:`translateX(${Math.min(dy,200)}px)`; };
  const finish=(dy)=>{ sheet.style.transition=""; sheet.style.transform=""; if(dy>64) closeGuestSheet(); };
  if(sheet._swipeBound) return; sheet._swipeBound=true;
  // handle/header: pointer drag (mouse + touch + pen), delegated so it survives re-render
  let y0=null,dy=0,pid=null,headEl=null;
  sheet.addEventListener("pointerdown",e=>{
    const head=e.target.closest("#sheet-grab"); if(!head||e.target.closest(".x-btn")) return;
    headEl=head; y0=e.clientY; dy=0; pid=e.pointerId; sheet.style.transition="none";
    try{ head.setPointerCapture(pid); }catch(_){}
  });
  sheet.addEventListener("pointermove",e=>{ if(y0==null) return; dy=e.clientY-y0; drag(dy); });
  const up=()=>{ if(y0==null) return; const d=dy; y0=null; dy=0; finish(d); };
  sheet.addEventListener("pointerup",up); sheet.addEventListener("pointercancel",up);
  // body: swipe down when scrolled to the top
  let y1=null,d1=0;
  sheet.addEventListener("touchstart",e=>{ if(e.target.closest("#sheet-grab")||sheet.scrollTop>0){ y1=null; return; } y1=e.touches[0].clientY; d1=0; sheet.style.transition="none"; },{passive:true});
  sheet.addEventListener("touchmove",e=>{ if(y1==null) return; d1=e.touches[0].clientY-y1; drag(d1); },{passive:true});
  sheet.addEventListener("touchend",()=>{ if(y1==null) return; const d=d1; y1=null; d1=0; finish(d); });
}


function paintMiniFloor(cv, fid){
  if(!cv) return;
  const W=cv.clientWidth,H=cv.clientHeight; if(!W||!H) return;
  cv.width=W*devicePixelRatio; cv.height=H*devicePixelRatio;
  const c=cv.getContext("2d"); c.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  const g=c.createLinearGradient(0,0,0,H); g.addColorStop(0,"#161018"); g.addColorStop(1,"#0a080c");
  c.fillStyle=g; c.fillRect(0,0,W,H);
  const rg=c.createRadialGradient(W*.72,H*.3,6,W*.72,H*.35,W*.4);
  rg.addColorStop(0,"rgba(245,219,170,.28)"); rg.addColorStop(1,"transparent");
  c.fillStyle=rg; c.fillRect(0,0,W,H);
  const x0=W*0.48;
  c.fillStyle="#1a140c"; c.fillRect(x0,H-16,W-x0,16);
  c.fillStyle="rgba(236,186,104,.25)"; c.fillRect(x0,H-16,W-x0,1);
  const n=Math.max(6, Math.floor((W-x0)/16));
  for(let i=0;i<n;i++){
    const x=x0+8+i*16, hh=18+(i*9)%(H*0.55);
    c.fillStyle=i%5===0?"#c4a35a":(i%2?"#2a1c12":"#1a140c");
    c.fillRect(x, H-16-hh, 13, hh);
    if(i%3===0){ c.fillStyle="rgba(245,219,170,.15)"; c.fillRect(x+2, H-16-hh, 2, Math.min(10,hh)); }
  }
}

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function buildQuiz(guest, recall){
  let qs=guest.questions.map(q=>{
    if(!recall || q.type==="ox") return {...q, options:q.options.slice()};
    const pairs=q.options.map((o,i)=>({o,i}));
    const sh=shuffle(pairs);
    return {...q, options:sh.map(p=>p.o), correctIndex:sh.findIndex(p=>p.i===q.correctIndex)};
  });
  return recall?shuffle(qs):qs;
}
function ensureRecall(id){

}
function closeCardInspect(){
  const el=$("#card-inspect");
  if(el){ el.classList.remove("on"); el.setAttribute("aria-hidden","true"); el.innerHTML=""; }
  inspectState.pageId=null; inspectState.press=false; inspectState.reason=null;
  if(inspectState.timer){ clearTimeout(inspectState.timer); inspectState.timer=0; }
  if(inspectState.hoverTimer){ clearTimeout(inspectState.hoverTimer); inspectState.hoverTimer=0; }
}
function bindPageInspect(sel, onTap){
  $$(sel).forEach(c=>{
    const pageId=c.dataset.page||c.dataset.off;
    if(!pageId) return;
    c.addEventListener("contextmenu",ev=>{ ev.preventDefault(); ev.stopPropagation(); });
    c.addEventListener("selectstart",ev=>ev.preventDefault());
    c.addEventListener("pointerdown",ev=>{
      if(ev.pointerType==="mouse" && ev.button===1) return;
      if(ev.pointerType==="mouse" && ev.button===2){
        ev.preventDefault();
        if(inspectState.timer){clearTimeout(inspectState.timer);inspectState.timer=0}
        inspectState.press=true; inspectState.suppressClick=true; inspectState.reason="press";
        openCardInspect(pageId);
        try{ c.setPointerCapture(ev.pointerId); }catch(e){}
        return;
      }
      if(ev.pointerType==="mouse" && ev.button!==0) return;
      if(inspectState.timer){clearTimeout(inspectState.timer);inspectState.timer=0}
      inspectState.press=false; inspectState.suppressClick=false;
      inspectState.timer=setTimeout(()=>{
        inspectState.press=true; inspectState.suppressClick=true; inspectState.reason="press";
        openCardInspect(pageId);
        try{ c.setPointerCapture(ev.pointerId); }catch(e){}
      },300);
    });
    const endHold=()=>{
      if(inspectState.timer){clearTimeout(inspectState.timer);inspectState.timer=0}
      if(inspectState.press){
        closeCardInspect();
        setTimeout(()=>{inspectState.suppressClick=false},400);
      }
      inspectState.press=false;
    };
    c.addEventListener("pointerup",endHold);
    c.addEventListener("pointercancel",endHold);
    c.addEventListener("pointerenter",ev=>{
      if(ev.pointerType!=="mouse") return;
      SFX.hover();
      if(inspectState.hoverTimer) clearTimeout(inspectState.hoverTimer);
      inspectState.hoverTimer=setTimeout(()=>{
        if(!inspectState.press){ inspectState.reason="hover"; openCardInspect(pageId); }
      },300);
    });
    c.addEventListener("pointerleave",ev=>{
      if(ev.pointerType==="mouse" && !inspectState.press){
        if(inspectState.hoverTimer){clearTimeout(inspectState.hoverTimer);inspectState.hoverTimer=0}
        if(inspectState.reason==="hover") closeCardInspect();
      }
    });
    if(onTap){
      c.addEventListener("click",ev=>{
        if(inspectState.suppressClick){
          ev.preventDefault(); ev.stopImmediatePropagation();
          inspectState.suppressClick=false;
          return;
        }
        onTap(pageId,c,ev);
      });
    }
  });
}

// Whole-stage framing: backdrop, spotlights and a perspective stage floor.
function paintStage(c,cv,W,H){
  let feetY=H*.64, figH=Math.min(H*.34,300);
  try{
    const cr=cv.getBoundingClientRect(), ch=document.querySelector("#fig-lib .char");
    if(ch){ const r=ch.getBoundingClientRect(); if(r.height>20){ feetY=r.bottom-cr.top; figH=r.height; } }
  }catch(e){}
  // backdrop: deep tint toward the ceiling, stage haze near the floor
  const bgG=c.createLinearGradient(0,0,0,H);
  bgG.addColorStop(0,"rgba(6,7,16,.78)"); bgG.addColorStop(.38,"rgba(10,12,28,.12)");
  bgG.addColorStop(.7,"rgba(14,12,22,.28)"); bgG.addColorStop(1,"rgba(4,4,8,.92)");
  c.fillStyle=bgG; c.fillRect(0,0,W,H);
  // spotlights (additive)
  c.save(); c.globalCompositeOperation="screen";
  const cones=[[W*.5,"255,226,170",.2,W*.55],[W*.27,"255,214,150",.2,W*.34],[W*.73,"150,160,255",.18,W*.34]];
  for(const [cx,col,al,spread] of cones){
    const top=-10, yb=feetY+figH*.08;
    const g=c.createLinearGradient(0,top,0,yb);
    g.addColorStop(0,`rgba(${col},${al})`); g.addColorStop(.7,`rgba(${col},${al*.28})`); g.addColorStop(1,`rgba(${col},0)`);
    c.fillStyle=g; c.beginPath();
    c.moveTo(cx-W*.03,top); c.lineTo(cx+W*.03,top); c.lineTo(cx+spread*.5,yb); c.lineTo(cx-spread*.5,yb); c.closePath(); c.fill();
  }
  c.restore();
  // stage platform (perspective trapezoid)
  const yb=feetY-figH*.16, yf=feetY+figH*.2, lip=Math.max(8,figH*.05);
  const bx=W*.07, fx=-W*.04;
  c.beginPath(); c.moveTo(bx,yb); c.lineTo(W-bx,yb); c.lineTo(W-fx,yf); c.lineTo(fx,yf); c.closePath();
  const sf=c.createLinearGradient(0,yb,0,yf);
  sf.addColorStop(0,"rgba(52,58,96,.86)"); sf.addColorStop(1,"rgba(20,22,40,.94)");
  c.fillStyle=sf; c.fill();
  c.save(); c.clip();
  // plank/grid lines converge to the horizon
  c.strokeStyle="rgba(255,255,255,.055)"; c.lineWidth=1;
  for(let i=0;i<=14;i++){ const k=i/14; c.beginPath(); c.moveTo(bx+k*(W-2*bx),yb); c.lineTo(fx+k*(W-2*fx),yf); c.stroke(); }
  for(let i=1;i<6;i++){ const k=Math.pow(i/6,1.6), y=yb+(yf-yb)*k; c.beginPath(); c.moveTo(0,y); c.lineTo(W,y); c.stroke(); }
  // warm / cool pools of light under each fighter
  const pool=(cx,col)=>{ const g=c.createRadialGradient(cx,feetY,4,cx,feetY,W*.3);
    g.addColorStop(0,`rgba(${col},.42)`); g.addColorStop(1,`rgba(${col},0)`);
    c.save(); c.translate(0,feetY); c.scale(1,.26); c.translate(0,-feetY); c.fillStyle=g; c.fillRect(0,feetY-W*.4,W,W*.8); c.restore(); };
  pool(W*.27,"255,214,150"); pool(W*.73,"150,160,255");
  // centre clash ring on the floor
  c.strokeStyle="rgba(236,186,104,.28)"; c.lineWidth=1.2;
  c.beginPath(); c.ellipse(W/2,(yb+yf)/2+figH*.02,W*.3,(yf-yb)*.34,0,0,Math.PI*2); c.stroke();
  c.setLineDash([3,7]); c.strokeStyle="rgba(255,255,255,.14)";
  c.beginPath(); c.ellipse(W/2,(yb+yf)/2+figH*.02,W*.22,(yf-yb)*.24,0,0,Math.PI*2); c.stroke(); c.setLineDash([]);
  c.restore();
  // back edge rim light
  const rg=c.createLinearGradient(bx,0,W-bx,0);
  rg.addColorStop(0,"rgba(236,186,104,0)"); rg.addColorStop(.5,"rgba(255,230,180,.55)"); rg.addColorStop(1,"rgba(236,186,104,0)");
  c.strokeStyle=rg; c.lineWidth=1.4; c.beginPath(); c.moveTo(bx,yb); c.lineTo(W-bx,yb); c.stroke();
  // front lip (stage thickness) and the dark pit below
  c.fillStyle="rgba(10,11,22,.96)"; c.fillRect(0,yf,W,lip);
  c.fillStyle="rgba(236,186,104,.55)"; c.fillRect(0,yf,W,1.2);
  const pit=c.createLinearGradient(0,yf+lip,0,H);

function paintBattleFloor(cv, fid){
  if(!cv) return;
  const W=cv.clientWidth,H=cv.clientHeight;
  if(!W||!H) return;
  cv.width=W*devicePixelRatio; cv.height=H*devicePixelRatio;
  const c=cv.getContext("2d"); c.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  const battle=cv.id==="arena-bg";
  const img=libraryPhoto(battle?"battle":"lobby");
  if(!img){
    const retry=()=>paintBattleFloor(cv,fid);
    if(libraryPhoto.cache){
      libraryPhoto.cache.lobby.addEventListener("load", retry, {once:true});
      libraryPhoto.cache.battle.addEventListener("load", retry, {once:true});
    }
  } else {
    const iw=img.naturalWidth, ih=img.naturalHeight, sc=Math.max(W/iw,H/ih)*1.06;
    c.drawImage(img, (W-iw*sc)/2, (H-ih*sc)/2, iw*sc, ih*sc);
    c.fillStyle=battle?"rgba(6,7,14,.58)":"rgba(7,8,13,.28)";
    c.fillRect(0,0,W,H);
    if(battle) paintStage(c,cv,W,H);
    return;
  }

  // fallback procedural shelves
    const g=c.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#0a0c12"); g.addColorStop(.45,"#101018"); g.addColorStop(1,"#07060a");
  c.fillStyle=g; c.fillRect(0,0,W,H);
  // high faint arch, well above HUD
  c.save(); c.globalAlpha=.35; c.translate(W/2, -20);
  c.beginPath(); c.moveTo(-120,110); c.lineTo(-120,20); c.quadraticCurveTo(0,-40,120,20); c.lineTo(120,110); c.closePath();
  const wg=c.createLinearGradient(0,0,0,110);
  wg.addColorStop(0,"rgba(80,100,130,.35)"); wg.addColorStop(1,"rgba(20,24,36,.1)");
  c.fillStyle=wg; c.fill();
  c.strokeStyle="rgba(236,186,104,.35)"; c.lineWidth=1.5; c.stroke();
  c.restore();
  const sl=c.createRadialGradient(W*.22,H*.7,20,W*.22,H*.7,W*.3);
  sl.addColorStop(0,"rgba(245,219,170,.2)"); sl.addColorStop(1,"transparent");
  const sr=c.createRadialGradient(W*.78,H*.7,20,W*.78,H*.7,W*.3);
  sr.addColorStop(0,"rgba(170,150,200,.12)"); sr.addColorStop(1,"transparent");
  c.fillStyle=sl; c.fillRect(0,0,W,H); c.fillStyle=sr; c.fillRect(0,0,W,H);
  for(let side=0;side<2;side++){
    for(let row=0;row<7;row++){
      const y=H*.16+row*(H*.085);
      const x0=side?W-148:10;
      c.fillStyle="#120e0a"; c.fillRect(x0,y+26,138,7);
      c.fillStyle="rgba(236,186,104,.2)"; c.fillRect(x0,y+26,138,1);
      for(let i=0;i<9;i++){
        const hh=16+(i*7+row*3)%18;
        c.fillStyle=(i+row)%5===0?"#c4a35a":(i%2?"#2a1c12":"#1a140c");
        c.fillRect(x0+6+i*14,y+26-hh,12,hh);
      }
    }
  }
  c.beginPath();
  c.moveTo(W*.1,H*.82); c.lineTo(W*.9,H*.82); c.lineTo(W,H); c.lineTo(0,H); c.closePath();
  const fg=c.createLinearGradient(0,H*.82,0,H);
  fg.addColorStop(0,"rgba(32,24,14,.9)"); fg.addColorStop(1,"rgba(8,6,4,.96)");
  c.fillStyle=fg; c.fill();
  c.strokeStyle="rgba(236,186,104,.4)"; c.lineWidth=1.6;
  c.beginPath(); c.moveTo(W*.1,H*.82); c.lineTo(W*.9,H*.82); c.stroke();
  c.strokeStyle="rgba(236,186,104,.12)"; c.lineWidth=1;
  for(let i=1;i<8;i++){
    const y=H*.82+(H*.18)*(i/8);
    c.beginPath(); c.moveTo(W*.1*(1-i/8),y); c.lineTo(W-W*.1*(1-i/8),y); c.stroke();
  }
  for(let i=0;i<=10;i++){
    const k=i/10;
    c.beginPath(); c.moveTo(W*.1+k*W*.8,H*.82); c.lineTo(k*W,H); c.stroke();
  }
}

function runScene(o){
  const rec=reception, guest=GUEST_BY[rec.guestId], page=o.page, asked=!!o.q, correct=!!o.correct;
  const ticketsBefore=ticketsHeld(save);
  const gt=withKeyMods(giftTotals(save),save);
  const gDice=rec.g.stag>0?null:(rec.intent?rec.intent.dice:null);
  const pDice=(page&&rec.p.stag===0)?page.dice:null;
  rec.lastCorrect=correct; rec.crit=asked&&o.isKey&&correct; rec.lastKey=!!o.isKey; rec.lastQ=o.q||null;
  const steps=resolveScene({P:rec.p,G:rec.g,pDice,gDice,correct,isKey:!!o.isKey,emotion:rec.emotion,mods:gt});
  rec.lastSteps=steps;

  let emotion=rec.emotion, charge=rec.emotionCharge, combo=rec.combo, emoUp=false;
  if(asked){
    combo=correct?combo+1:0;
    if(correct){ charge+=1; if(charge>=COMBAT.chargesPerEmotion && emotion<COMBAT.emotionMax){ emotion+=1; charge=0; emoUp=true; } }
    else charge=0;
  }
  const defeated=rec.g.hp<=0;
  const playerDead=rec.p.hp<=0&&!defeated;
  const firstClear=defeated && !save.conqueredIds.includes(guest.id);
  const nextQ=save.questionsAnswered+(asked?1:0);
  const nextWins=save.receptionsWon+(firstClear?1:0);
  const ticketsGained=Math.max(0,(ticketsGranted(nextQ,nextWins)-save.ticketsSpent)-ticketsBefore);

  let nextLevel=save.level,nextXp=save.xp,nextMax=save.maxHp,levelMsg="";
  if(defeated){
    nextXp+=COMBAT.xpByWeakness[guest.weakness];
    let need=xpNeeded(nextLevel); const msgs=[];
    while(nextXp>=need){ nextXp-=need; nextLevel++; nextMax+=COMBAT.hpPerLevel; need=xpNeeded(nextLevel); msgs.push(`${pick(LEVEL_UP_MESSAGES)} (Lv.${nextLevel})`); }
    if(msgs.length) levelMsg=msgs.join(" ");
  }
  steps.forEach(st=>{
    const bits=[];
    if(st.pd) bits.push(`내 ${st.pd.type} ${st.pd.roll}`);
    if(st.gd) bits.push(`손님 ${st.gd.type} ${st.gd.roll}`);
    rec.log.push(`${bits.join(" vs ")} → ${st.outcome==="P"?"내가 우세":st.outcome==="G"?"손님이 우세":st.outcome==="tie"?"무승부":"공방 없음"}`);
    st.newStag.forEach(t=>rec.log.push(t==="G"?`${guest.concept} 손님이 흐트러졌다!`:"사서가 흐트러졌다!"));
  });
  if(asked&&!correct) rec.log.push("해설 · "+guest.explanation);
  if(emoUp){
    rec.pendingDraw=(rec.pendingDraw||0)+1;
    rec.pendingLight=(rec.pendingLight||0)+1;
  }
  if(ticketsGained) rec.log.push(`책갈피 뽑기권 +${ticketsGained}`);
  if(defeated) rec.log.push(firstClear?`${guest.concept} 손님이 책이 되었다.`:`재접대를 마쳤다.`);

  if(asked){
    const rst=ensureRecall(guest.id); rst.total++; if(correct) rst.correct++;
    const prevStat=save.conceptStats[guest.id]||{correct:0,total:0};
    save.conceptStats={...save.conceptStats,[guest.id]:{correct:prevStat.correct+(correct?1:0),total:prevStat.total+1}};
  }
  save.maxHp=nextMax; save.level=nextLevel; save.xp=nextXp; save.hp=effectiveMaxHp(save);
  save.questionsAnswered=nextQ; save.receptionsWon=nextWins;
  let bookGain=0;
  if(defeated){ bookGain=firstClear?BOOK_RULES.firstClear:rollRecallBooks(); addBooks(save,guest.id,bookGain); }
  rec.bookGain=bookGain;
  if(firstClear){ save.conqueredIds=[...save.conqueredIds,guest.id]; }
  persist();

  rec.emotion=emotion; rec.emotionCharge=charge; rec.combo=combo;
  rec.ticketsGained=ticketsGained; rec.levelUpMessage=levelMsg; rec.emoUp=emoUp;
  rec.maxLight=Math.min(COMBAT.maxLightCap,COMBAT.baseLight+emotion);
  rec.phase="rolling";
  animateScene(steps, defeated, playerDead, asked&&!correct?{q:o.q,typed:o.typed}:null);
}

function animateScene(steps,winAll,loseAll,miss){

    }, rec.crit?320:220);
  };

    if(st.gd&&(st.gd.type==="참격"||st.gd.type==="관통"||st.gd.type==="타격")) gxAttack(!!(rec.intent&&rec.intent.big));
    setTimeout(()=>{
      if(st.pd) dp.innerHTML=dieSvg(st.pd.type,st.pd.roll,st.outcome==="G"&&!!st.gd&&!st.gd.keeps)+(st.pd.reused?'<span class="reuse-tag">재사용</span>':"");

      if(rec.crit&&first){ clash.classList.add("crit"); document.body.classList.add("slowmo"); setTimeout(()=>document.body.classList.remove("slowmo"),280); }
      const {w,h}=FX.size();
      FX.burst(w/2,h*.44, rec.crit&&first?70:30, st.outcome==="G"?"#c45c4a":"#e6d3a3");

  if(!reception||busy) return;
  const rec=reception;
  const breathe=rec.chosenPageId==="breathe"?1:0;
  const cap=Math.min(COMBAT.maxLightCap,COMBAT.baseLight+rec.emotion);
  rec.phase="select"; rec.chosenPageId=undefined; rec.lastFlavor=undefined;
  for(const u of [rec.p,rec.g]){ if(u.stag===2) u.stag=1; else if(u.stag===1){ u.stag=0; u.st=u.stMax; } }
  const extraL=rec.pendingLight||0; rec.pendingLight=0;
  rec.light=Math.min(cap, rec.light+lightRegen(save)+breathe+extraL);
  rec.maxLight=cap; rec.turn++;
  const draws=1+(rec.pendingDraw||0); rec.pendingDraw=0;
  const got=drawPages(rec,draws);
  if(got.length) rec.log.push(`${got.length}장의 책장을 펼쳤다. 남은 책장 ${rec.deckIds.length} · 버린 책장 ${rec.discardIds.length}.`);
  rec.intent=planIntent(rec.kit,rec);
  if(rec.p.stag>0){ rec.phase="pstag"; rec.log.push("사서가 흐트러져 이 막은 행동할 수 없다."); }
  renderBattle();
  if(rec.phase==="pstag") setTimeout(()=>{ if(reception===rec&&rec.phase==="pstag"&&!busy) runScene({page:null,correct:false,isKey:false,q:null}); },1000);
}


/* 기프트는 그 접대에 나선 사서에게만 떨어진다. 이미 가진 기프트는 능력이 쌓이지 않고 뽑기권으로 바뀐다. */
function rollEgoGift(guest, isRecall, libId){
  const L=libOf(save,libId), owned=new Set(L.gifts.owned);
  const pool=EGO_GIFTS.filter(g=>g.guestId===guest.id);
  if(!pool.length) return null;
  L.pity[guest.id]=(L.pity[guest.id]||0)+1;
  const rate=isRecall?EGO_GIFT_RULES.dropRateRecall:EGO_GIFT_RULES.dropRateFirstClear;
  const pity=EGO_GIFT_RULES.pityEvery && L.pity[guest.id]>=EGO_GIFT_RULES.pityEvery;
  if(!(Math.random()<rate || pity || (!isRecall && rate>=1))) return null;
  const w=pool.map(g=>owned.has(g.id)?1:EGO_GIFT_RULES.newWeight), sum=w.reduce((a,b)=>a+b,0);
  let r=Math.random()*sum, item=pool[0]; for(let i=0;i<pool.length;i++){ if(r<w[i]){ item=pool[i]; break; } r-=w[i]; }
  L.pity[guest.id]=0;
  const dup=owned.has(item.id);
  if(dup){ save.ticketsSpent-=EGO_GIFT_RULES.dupTickets; return {item,dup:true,libId:L.id,libName:L.name}; }
  L.gifts.owned=[...L.gifts.owned,item.id];
  if(!L.gifts.equipped[item.slot]) L.gifts.equipped[item.slot]=item.id;
  return {item,dup:false,libId:L.id,libName:L.name};
}
function finishReceptionStats(guest, won){
  const st=ensureRecall(guest.id);
  const rec=reception;
  if(rec&&rec.isRecall){ st.recalls++; if(won) st.wins++; }
  else if(won){ st.wins++; }
  const tot=rec&&rec.sessionTotal||0, ok=rec&&rec.sessionCorrect||0;
  if(tot){ st.history=[...(st.history||[]), ok/tot].slice(-5); }
  save.recallStats={...save.recallStats, [guest.id]:st};
}

function bindDress(mode){
  const outfit=mode==="outfit", key=outfit?"outfit":"gifts";
  const stage=$("#dress-char"), grid=$("#dress-grid");
  const eqBtn=$("#dd-equip");
  if(eqBtn) eqBtn.onclick=()=>{ if(outfit) equipKey(dressSel.outfit||save.equippedKeyId); else equipGift(dressSel.gifts); };
  const back=$("#dd-back"); if(back) back.onclick=()=>{ dressSel.gifts=null; renderShelf(); };
  let suppress=false;
  const over=(x,y)=>{ const r=stage.getBoundingClientRect(); return x>=r.left-8&&x<=r.right+8&&y>=r.top-8&&y<=r.bottom+8; };
  $$(".dtile",grid).forEach(t=>{
    t.addEventListener("click",()=>{
      if(suppress){ suppress=false; return; }
      const id=t.dataset.t;
      dressSel[key]=(dressSel[key]===id&&!outfit)?null:id; SFX.click(); renderShelf();
    });
    t.addEventListener("contextmenu",e=>e.preventDefault());
    t.addEventListener("pointerdown",e=>{
      if(e.pointerType==="mouse"&&e.button!==0) return;
      if(t.dataset.locked==="1") return;
      const id=t.dataset.t, x0=e.clientX, y0=e.clientY, pid=e.pointerId;
      const equipped=t.classList.contains("eq");
      let ghost=null, dragging=false;
      const move=ev=>{
        if(ev.pointerId!==pid) return;
        if(!dragging){
          if(Math.hypot(ev.clientX-x0,ev.clientY-y0)<8) return;
          dragging=true; suppress=true; document.body.classList.add("dressing");
          ghost=document.createElement("div"); ghost.className="dghost"; ghost.innerHTML=`<svg viewBox="0 0 24 24">${(outfit?KEY_ICON[id]:GIFT_ICON[EGO_BY[id].art])||""}</svg>`;

        }
        ghost.style.transform=`translate(${ev.clientX-28}px,${ev.clientY-28}px) scale(1.08)`;
        stage.classList.toggle("drop-on",over(ev.clientX,ev.clientY));
        if(equipped&&!outfit) grid.classList.toggle("drop-off",!over(ev.clientX,ev.clientY));
        ev.preventDefault();
      };
      const end=ev=>{
        if(ev.pointerId!==pid) return;
        window.removeEventListener("pointermove",move); window.removeEventListener("pointerup",end); window.removeEventListener("pointercancel",end);
        document.body.classList.remove("dressing");
        if(!dragging) return;
        const inside=ev.type!=="pointercancel"&&over(ev.clientX,ev.clientY);
        ghost&&ghost.remove(); t.classList.remove("drag-src"); stage.classList.remove("can-drop","drop-on"); grid.classList.remove("can-off","drop-off");
        setTimeout(()=>{ suppress=false; },0);
        if(ev.type==="pointercancel") return;
        if(outfit){ if(inside) equipKey(id); }
        else if(inside) equipGift(id,true);
        else if(equipped) equipGift(id,false);
      };
      window.addEventListener("pointermove",move,{passive:false}); window.addEventListener("pointerup",end); window.addEventListener("pointercancel",end);
    });
  });
}

    idx=(idx+1)%reveals.length;
    $$(".gcard").forEach((c,i)=>c.style.display=i===idx?"block":"none");
    $("#gc"+idx).classList.remove("flip");
    if($("#gidx")) $("#gidx").textContent=`${idx+1} / ${reveals.length}`;
    SFX.gacha(reveals[idx].item.rarity); flip();
  };
}


function showGuestLineup(ids){
  const list=(ids&&ids.length?ids:WEAK_POINTS.map(g=>g.id)).slice(0,4).map(id=>GUEST_BY[id]).filter(Boolean);
  const ov=$("#lineup"); if(!ov) return;
  ov.innerHTML=list.map(g=>{
    const look=guestLook(g);
    return `<div class="lu-item fighter guest arch-${look.arch}" style="position:relative;bottom:auto;width:auto;animation-name:none;filter:none">
      ${guestSvg(g,false,240,380,false)}
      <div class="lu-name">${g.concept}</div>
      <div class="lu-sub">${look.art?artLabel(look.art):(ARCH_LABEL[look.arch]||look.arch)}</div>
    </div>`;
  }).join("");
  ov.classList.add("on");
  $$(".scene").forEach(s=>s.style.visibility="hidden");
}
function hideGuestLineup(){
  const ov=$("#lineup"); if(ov) ov.classList.remove("on");
  $$(".scene").forEach(s=>s.style.visibility="");
}

/* keep the list scroll position when a tap re-renders the same scene (deck equip, filters, gifts, cosmetics, books) */
function withScroll(sceneId,fn){
  let lastEpoch=-1;
  return function(...a){
    const el=document.getElementById(sceneId);
    const keep=lastEpoch===sceneEpoch&&el&&el.classList.contains("on");
    const nodes=()=>[el,...el.querySelectorAll(".page-scroll")];
    const tops=keep?nodes().map(n=>n.scrollTop):[];
    const r=fn.apply(this,a);
    lastEpoch=sceneEpoch;
    if(keep){ nodes().forEach((n,i)=>{ if(tops[i]) n.scrollTop=tops[i]; }); }
    return r;
  };
}
renderDeckEditor=withScroll("scene-deck",renderDeckEditor);
renderShelf=withScroll("scene-shelf",renderShelf);
renderCollection=withScroll("scene-collection",renderCollection);
renderLobby=withScroll("scene-lobby",renderLobby);

  ensureDecks(save);
  SFX.setSfxMuted(!!save.sfxMuted);
  SFX.setBgmMuted(save.bgmMuted!==false); // default off
  bindAudioToggles();
  ["pointerdown","touchend","click","keydown"].forEach(ev=>document.addEventListener(ev,()=>SFX.prime(),{capture:true,passive:true}));
  renderTitle();
  // debug for screenshots / tests
  window.__studyGame = {
    save, transit, showScene, renderLobby, renderBattle, renderCollection, renderShelf, renderTitle,
    beginReception, answer, answerShort, choosePage, SFX, takPunch, showWin, showLose, engine:{COMBAT,TIER,ATK_TYPES,mkUnit,resolveScene,guestCombat,planIntent,expectedDamage,checkShort,keyQsOf,WEAK_POINTS,COMBAT_PAGES,PAGE_BY,hitUnit,playerDieRange,guestDieRange,playerStaggerMax,FLAT_RESIST,getRec(){return reception;}}, pullGacha, giveTickets(n){ save.ticketsSpent=Math.max(0, save.ticketsSpent-n); persist(); },
    gx:{guestSvg,GX_VARIANTS,GX_VLABEL,GX_LABEL,gxAttack,gxExFlash,gxPick,GUEST_ART},
    data:{EGO_GIFTS,KEY_PAGES,COSMETIC_ITEMS,WEAK_POINTS,COMBAT_PAGES,FLOORS,KEY_QUESTIONS},
    acq:{BOOK_POOLS,BOOK_RULES,poolEntries,burnBookOnce,addBooks,bookCount,totalBooks,ownedCount,deckLimit,DECK_MIN,DECK_MAX,sourcesOf,acqAudit,migrateAcq,rollRecallBooks,loadSave,defaultSave,SAVE_KEY},
    setGifts(owned,equipped){ const L=libOf(save); L.gifts.owned=[...owned]; L.gifts.equipped={...emptyEgoEquip(),...(equipped||{})}; persist(); },
    gifts:{withKeyMods,effectiveMaxHp,libOf,giftTotals,giftMaxTotals,activeSets,rollEgoGift,migrateLibrarians,sanitizeLibrarians,equipGift,egoOwned,egoEquip,EGO_GIFT_RULES,loadSave,SAVE_KEY},
    toggleDeckPage, currentQuestion, setShelfTab(t){ shelfTab=t; },
    setScene(n){ showScene(n); if(n==="lobby")renderLobby(); if(n==="battle")renderBattle(); if(n==="collection")renderCollection(); if(n==="shelf")renderShelf(); if(n==="title")renderTitle(); if(n==="deck")renderDeckEditor(); if(n==="credits")renderCredits(); },
    debugPhotos(){ return FX.debugPhotos(); },
    openDeckEditor, renderDeckEditor, isDeckReady, activeDeck, ownedPageIds,
    giveAllPages(){ save.unlockedPageIds=COMBAT_PAGES.map(p=>p.id); ensureDecks(save); persist(); },
    setDeckPages(ids){ const d=activeDeck(save); d.pageIds=(ids||[]).slice(0,DECK_MAX); persist(); },
    setTab(tab){ collectTab=tab; if(scene==="collection") renderCollection(); },
    demoGacha(rarity){
      collectTab="gacha";
      const item=COSMETIC_ITEMS.find(i=>i.rarity===rarity)||COSMETIC_ITEMS[0];
      reveals=[{item,isNew:true,flavor:(REVEAL_TEXT[item.rarity]&&REVEAL_TEXT[item.rarity][0])||""}];
      showScene("collection"); renderCollection(); paintReveal();
    },
    forceTickets(n){ save.questionsAnswered = n * TICKET_RULES.questionsPerLecture; persist(); },
    get reception(){return reception;},
    playClashWin(){
      if(reception&&reception.phase==="select"){
        const p=reception.handIds.find(id=>PAGE_BY[id]&&PAGE_BY[id].cost<=reception.light&&PAGE_BY[id].emotion<=reception.emotion);
        if(p){
          choosePage(p);
          setTimeout(()=>{
            const bank=reception.quiz||GUEST_BY[reception.guestId].questions;
            const q=bank[reception.qIndex%bank.length];
            answer(q.correctIndex);
          }, 80);
        }
      }
    },
    openCardInspect, closeCardInspect,
    openGuestSheet, closeGuestSheet, showGuestLineup, hideGuestLineup,
    giftTotals, bonusLabel
  };
}

document.addEventListener("DOMContentLoaded", boot);
